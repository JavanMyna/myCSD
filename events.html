<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>myCSD events</title>
<style>
:root{
  --bg:#1F1D1A; --text:#E8E1D3; --muted:#8E8677; --rule:#3A362F; --amber:#E0A94A;
  --panel:#26231F; --warn:#E0A94A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
a{color:var(--amber)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)}

/* header */
header{border-bottom:1px solid var(--rule)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:12px;flex-wrap:wrap}
.brand{font:600 15px var(--mono);letter-spacing:.2px;margin:0}
.brand .mark{color:var(--amber)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;font:13px var(--mono);color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--amber)}
nav button:hover{color:var(--text)}

main{padding-top:14px;padding-bottom:28px;min-height:60vh}
.hidden{display:none!important}

/* summary + controls */
.summary{font:12px/1.5 var(--mono);color:var(--muted);margin:0 0 10px}
.summary b{color:var(--text);font-weight:500}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.search{flex:1 1 200px;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;font:13px var(--mono)}
.search::placeholder{color:var(--muted)}
.btn{background:none;border:1px solid var(--rule);border-radius:3px;padding:6px 10px;font:12px var(--mono);color:var(--muted);cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{color:var(--amber);border-color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font:12px var(--mono);color:var(--muted);cursor:pointer}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.chip .n{opacity:.75}
.fpanel{border:1px solid var(--rule);border-radius:3px;background:var(--panel);padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px 18px;font:12px var(--mono)}
.fpanel label{display:flex;align-items:center;gap:6px;color:var(--text)}
.fpanel select{background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:3px 6px;font:12px var(--mono);max-width:260px}
input[type=checkbox]{accent-color:var(--amber);width:15px;height:15px;margin:0}

/* date strip */
.strip{margin:0 0 14px;border:1px solid var(--rule);border-radius:3px}
.strip-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--rule);font:12px var(--mono);color:var(--muted)}
.strip-head button{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 8px;font:13px var(--mono)}
.strip-head button:hover:not(:disabled){color:var(--amber)}
.strip-head button:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{height:66px;display:grid;grid-template-rows:18px 26px 16px;justify-items:center;align-items:center;background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;padding:6px 0 0;color:var(--text)}
.day:last-child{border-right:0}
.day .dn{font:11px var(--mono);color:var(--muted);text-transform:lowercase}
.day .num{font:600 17px var(--mono);line-height:26px}
.day .star{font:13px var(--mono);color:var(--amber);line-height:16px;height:16px}
.day:hover{background:var(--panel)}
.day.today{background:var(--text);color:var(--bg)}
.day.today .dn{color:#5d574b}
.day.today .star{color:#8a5d10}
.day.sel{outline:2px solid var(--amber);outline-offset:-2px}

/* lists */
h2.sec{font:12px var(--mono);color:var(--muted);text-transform:lowercase;letter-spacing:.4px;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:400}
h2.sec .sub{color:var(--muted);opacity:.8}
ul.rows{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:72px 1fr auto;gap:2px 14px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:start}
.date{font:12px/1.4 var(--mono);color:var(--muted)}
.date .d1{color:var(--text);font-size:13px;display:block}
.main .title{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:500 15px/1.35 var(--sans);color:var(--text)}
.main .title:hover{color:var(--amber)}
.meta{font:12px/1.5 var(--mono);color:var(--muted);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font:11px/1.3 var(--mono);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.go{color:var(--amber);border-color:var(--amber)}
.tag.soon{color:var(--text);border-color:var(--amber)}
.tag.dashed{border-style:dashed}
.tag.chk{color:var(--amber)}
.side{text-align:right;font:12px/1.5 var(--mono);color:var(--muted);min-width:118px}
.side .cd{color:var(--amber);font-size:13px;display:block}
.side .pts{display:block}
.side>a{font:12px var(--mono);white-space:nowrap;display:block;margin-top:1px}
.side .poster{display:block}
.reg{display:inline-flex;align-items:center;gap:5px;margin-top:6px;cursor:pointer}
li.row.done .title{color:var(--muted)}
li.row.ended .title{color:var(--muted);font-weight:400}
.empty{padding:22px 0;color:var(--muted);font:13px var(--mono)}
details.fold{margin-top:20px;border-top:1px solid var(--rule)}
details.fold summary{cursor:pointer;font:12px var(--mono);color:var(--muted);padding:10px 0;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"+ ";color:var(--amber)}
details.fold[open] summary::before{content:"- "}
.note{font:12px/1.55 var(--mono);color:var(--muted);margin:8px 0}

/* settings */
.set{max-width:640px}
.set h3{font:13px var(--mono);color:var(--amber);margin:22px 0 6px;font-weight:400}
.set label.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.set input[type=radio]{accent-color:var(--amber);margin-top:4px}
.set p{margin:4px 0;color:var(--muted);font-size:13px}
.set ul{margin:6px 0 6px 18px;padding:0;color:var(--muted);font-size:13px}
.set li{margin:3px 0}

/* popup */
.ov{position:fixed;inset:0;background:rgba(10,9,8,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:10}
.pop{background:var(--bg);border:1px solid var(--rule);border-radius:4px;max-width:640px;width:100%;padding:16px 18px 18px;position:relative}
.pop h3{margin:0 28px 4px 0;font:600 17px/1.3 var(--sans)}
.pop .x{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font:18px var(--mono);cursor:pointer;padding:4px 8px}
.pop .x:hover{color:var(--amber)}
.pop dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:12px 0}
.pop dt{font:12px var(--mono);color:var(--muted)}
.pop dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.pop h4{font:12px var(--mono);color:var(--muted);margin:16px 0 6px;font-weight:400;text-transform:lowercase;border-bottom:1px solid var(--rule);padding-bottom:3px}
.pop .flag{font-size:13px;border-left:2px solid var(--amber);padding:2px 0 2px 9px;margin:6px 0;color:var(--text)}
.pop .flag.missing{border-left-color:var(--muted);color:var(--muted)}
.orig{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--mono);color:#c9c2b3;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:10px;max-height:260px;overflow:auto;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn.go{color:var(--bg);background:var(--amber);border-color:var(--amber);text-decoration:none;display:inline-block;font-weight:600}
.btn.go:hover{color:var(--bg);filter:brightness(1.08)}
.btn.out{text-decoration:none;color:var(--amber);border-color:var(--amber);display:inline-block}
.srcs{font:12px/1.5 var(--mono);color:var(--muted);margin:0;padding-left:16px}
.srcs li{margin:3px 0}

footer{border-top:1px solid var(--rule)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:22px;font:12px/1.5 var(--mono);color:var(--muted)}
footer .mark{color:var(--amber)}

@media (max-width:560px){
  body{font-size:14.5px}
  li.row{grid-template-columns:58px 1fr;gap:4px 12px}
  li.row .side{grid-column:2;text-align:left;min-width:0;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
  .side .cd,.side .pts,.side .poster{display:inline}
  .side>a{display:inline-block}
  .pop dl{grid-template-columns:1fr;gap:2px}
  .pop dd{margin-bottom:8px}
  .day{height:62px}
}
@media (prefers-reduced-motion:no-preference){ .chip,.btn,.day{transition:background-color .12s,color .12s,border-color .12s} }
</style>
</head>

s mean we are okay inside. Join our meaningful online talk session:\n✨ The Mind Behind The Smile\n💡 Understanding the emotions and struggles behind a smile\n🎤 Speaker: Puan Fauziah Binti Abdullah, Pegawai Psikologi Unit Kaunseling USM\n📅 Date: 29 Oct 2026 (Thursday)\n🕣 Time: 8.00 PM – 10.00 PM\n💻 Platform: Cisco Webex\n💰 Fee: RM1 only\nLink Google Form: https://forms.gle/BtSXstDxUwvhZ6jm9\n⏳Dateline register: 27 Oct 2026\nGain valuable insights about mental health, emotional challenges, recognising signs of emotional stress, and the importance of seeking support. 🌷\n📌 Don’t miss this opportunity to learn, understand and care for yourself and those around you!\n🌟 *MYCSD PROVIDED!*\nFor any inquiries:\n📞 Lim: 011-39408293\n📞 Syakira: 011-11195739","nPosts":3,"flags":[],"notes":[]},{"id":"leprosy","title":"Leprosy Awareness Talk","cat":"talk","start":"2026-10-30T21:00+08:00","end":"2026-10-30T22:00+08:00","where":"Google Meet (online)","mode":"online","fee":"RM1","points":"MyCSD application provided for USM students","desc":"Webinar with Dr. Por Heong Hong (Senior Lecturer, School of Social Science, USM) on leprosy, misconceptions and stigma.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"\"Open to: USM Students & the Public\""},"forms":[{"label":"Register","url":"https://forms.gle/oAkk9xtdmJuHSmyB7"}],"flags":[{"t":"note","text":"The post says myCSD is \"application provided for USM students\", so it appears to apply to USM students only. The word \"application\" is unclear."}],"sources":[{"role":"first","ts":"2026-10-09 07:01","sender":"UMisOne","orig":null,"line":6757,"snippet":"Leprosy Awareness Talk"},{"role":"latest","ts":"2026-10-14 19:01","sender":"UMisOne","orig":null,"line":8443,"snippet":"Leprosy Awareness Talk"}],"text":"Leprosy Awareness Talk\n🩺 How much do you really know about leprosy? Does the word ‘leprosy’ sound unfamiliar, or perhaps feel a little distant to you?\nBeyond the disease itself, the misconceptions, labels, and social stigma faced by patients are equally important issues that deserve our attention. Whether you are a USM student or a member of the public, we invite you to join us and learn more! 👀\nIn this webinar, we are honoured to invite Dr. Por Heong Hong (Senior Lecturer, School of Social Science, USM) to guide us in taking a closer look at this disease.\n📌 【 Event Details】\n🙋‍♂️ Open to: USM Students & the Public\n📆 Date: 30 October 2026 (Friday)\n⏰ Time: 9:00 PM – 10:00 PM\n🖥️ Platform: Google Meet (Online)\n💵 Registration Fee: RM 1 only\n✅ MyCSD application provided for USM students\n🔗 Register here now: https://forms.gle/oAkk9xtdmJuHSmyB7\n☎️ For any enquiries, please contact:\nChong Wai Feng +6011-3907 8440 or Jocelyn Kirk +6011-5336 0905","nPosts":2,"notes":[]},{"id":"colourrun","title":"USM Colour Run: Break the Frame","cat":"activity","start":"2026-10-31T07:00+08:00","end":"2026-10-31T11:30+08:00","where":"Padang Kawad, USM","mode":"in-person","fee":"RM20 Student A / RM37 Student B / RM57 Universal","points":"MYCSD listed in all three packages","desc":"5 km colour run. Student A (RM20): breakfast, colour powder, bag, wristband, e-cert. Student B (RM37): adds a T-shirt. Universal (RM57, open to all): adds a medal.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"Universal package (RM57) is \"Open to all!\"; Student A and B packages are for students"},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSdDixHLL7UghaueiwYb-r8xNLtuMCa7bDG1LZO4TIdT90Lpqw/viewform"}],"flags":[{"t":"conflict","text":"An earlier post (4 Oct) had a cut-off link. The full link from the 14 Oct post is used here."}],"sources":[{"role":"first","ts":"2026-10-04 14:01","sender":"UMisOne","orig":null,"line":4788,"snippet":"USM COLOUR RUN: BREAK THE FRAME"},{"role":"latest","ts":"2026-10-14 19:02","sender":"UMisOne","orig":null,"line":8535,"snippet":"USM COLOUR RUN: BREAK THE FRAME"}],"text":"USM COLOUR RUN: BREAK THE FRAME\n🎉 USM’s BIGGEST RUN is BACK & ready to BREAK THE FRAM ONE MORE UNTIL WHEN? – A TALK ABOUT OVERCOMING ADDICTION"},{"role":"related","ts":"2026-10-14 19:01","sender":"UMisOne","orig":null,"line":8458,"snippet":"Jom Sertai 4 Siri Online Talk Kesihatan Mental & Penjagaan Diri! ✨"}],"text":"📢 JUST ONE MORE UNTIL WHEN? – A TALK ABOUT OVERCOMING ADDICTION\nHave you ever caught yourself saying, \"Just one more game,\" or \"Just one more cigarette,\"? 🤨\nJoin us for an insightful sharing session on understanding and overcoming addiction!\n🗣 Speaker: Puan Sulastri Binti Samsudin\n(Pharmacy Officer, National Poison Centre, Universiti Sains Malaysia)\n📅 Date: 4 November 2026\n⏰ Time: 8:30 PM – 10:30 PM\n📍 Platform: Webex Meeting\n💵 Fee: RM 2\n🌟 Benefits: MyCSD & E-Certificate Provided!\n📞 Contact for Registration: 017-7725850 (Rohen)\n🔗 Registration Form:\nhttps://forms.gle/kAmz9rGbEkqbRrvT7\n✨ With You, For You ✨\n#WMHC2026\n#WMHD3.0\n#MRSUSM2627","nPosts":1,"flags":[],"notes":[]},{"id":"foam","title":"Foam O Run 2026","cat":"activity","start":"2026-11-29T07:00+08:00","end":"2026-11-29T12:00+08:00","where":"Kafe Jaya, USM Kampus Kejuruteraan Tuanku Syed Sirajuddin","mode":"in-person","fee":"RM45 (first 300 people) / RM50 normal","points":"MyCSD turut disediakan","desc":"Fun run with foam. Every participant gets a medal, an exclusive T-shirt, refreshments, a bubble stick and an e-certificate.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register (base44.app)","url":"https://wmhcarnivalmrs2627.base44.app","warn":true}],"notes":["A bus from the main campus (Induk) to the Engineering campus is provided.","RM45 is the early-bird price for the first 300 participants."],"flags":[{"t":"correction","text":"Posts on 7 Oct linked a tally.so form. Posts from 9–11 Oct use the base44.app page, which is used here."},{"t":"note","text":"The register link is a base44.app page (not Google Forms) and could not be checked from here. The same address appears in the mental-health series posts."}],"sources":[{"role":"first","ts":"2026-10-07 11:38","sender":"UMisOne","orig":null,"line":5916,"snippet":"FOAM O RUN 2026 🫧"},{"role":"latest","ts":"2026-10-20 07:57","sender":"UMisOne","orig":null,"msg":43937,"snippet":"CALLING OUT ALL FRESHIES! Bored over the weekend? 😩 Don't let FOMO hit you while watching your friends having "}],"text":"CALLING OUT ALL FRESHIES! Bored over the weekend? 😩 Don't let FOMO hit you while watching your friends having fun—let's join the crowd for a bubbly, casual run at the WMHC Foam-O Run! 🏃‍♂️💨🫧\nA relaxing run where you can also secure your MyCSD? Absolutely worth it! 🔥\n\nInfo & Registration: 👉 https://wmhcarnivalmrs2627.base44.app\n\n📌 Date: 29 Nov 2026\n📌 Time: 7.00 AM - 12.00 PM\n📌 Venue: Kafe Jaya, USMKKTSS\n📌 Price: RM45 (Early Bird for the first 300!)\nNormal Price: RM50\n\nYour registration comes with a T-shirt, medal, e-cert, refreshments, and a bubble stick! ✨\n\nThis event is open to everyone, so don't forget to invite your friends along! Scan the QR code at the end of the video quickly before tickets sell out! 🚀\n\n#FoamORun #MRSUSMKKJ #WMHC2026 #USMStudents","nPosts":5},{"id":"capturerun","title":"Capture Run: Caught in 4K","cat":"competition","start":"2026-10-19T00:00+08:00","end":"2026-10-25T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM1","points":"MyCSD provided","desc":"Online run challenge with prizes: 1st RM10, 2nd RM7, 3rd RM5.","kind":"window","myCsd":true,"elig":{"kind":"unstated","note":""},"org":"dgpharmakon 26/27 (from hashtag)","orgHow":"hashtag","forms":[{"label":"Register","url":"https://docs.google.com/forms/u/0/d/e/1FAIpQLSdhc6VxApx41qnjGZjzGWJ3WiyuSm4mzHHrPYdKA85EKkt7kQ/viewform?usp=send_form&pli=1&authuser=0"}],"sources":[{"role":"first","ts":"2026-10-14 19:02","sender":"UMisOne","orig":null,"line":8562,"snippet":"CAPTURE RUN: Caught in 4K! 📸🏃‍♂️"}],"text":"🏃‍♀️ 𝐂𝐀𝐏𝐓𝐔𝐑𝐄 𝐑𝐔𝐍: 𝐂𝐚𝐮𝐠𝐡𝐭 𝐢𝐧 𝟒𝐊! 📸🏃‍♂️\nReady, set, run! Lace up your shoes and join us for Capture Run! 👟✨\n📅 𝟏𝟗 – 𝟐𝟓 𝐎𝐜𝐭𝐨𝐛𝐞𝐫 𝟐𝟎𝟐𝟔\n💰 R  top 3 winners) will receive a special gift!🎉\n🏆Cash Prizes:\n🥇1st Place: RM15\n🥈2nd Place: RM10\n🥉3rd Place: RM5\n🔗Registration Link:\nhttps://forms.gle/NgqqduoDQGyNiQjt6\nFor any inquiries, feel free to contact:\n📞Lee Ping Sean (017-8657161)\n📞Daryl Lim (010-3989422)\nStay tuned and follow us on Instagram @pcc2627.usm for the latest updates!","nPosts":1,"flags":[],"notes":[]},{"id":"lightup","title":"Light Up Your Knowledge: Online Quiz","cat":"competition","start":"2026-09-01T00:00+08:00","end":"2026-10-25T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM1","points":"MYCSD POINTS ARE PROVIDED","desc":"Online quiz on Deepavali and Christmas traditions by Sekretariat Sukarelawan India (SSI) USM. Funds raised go towards supporting children in homes.","kind":"window","myCsd":true,"elig":{"kind":"unstated","note":""},"org":"Sekretariat Sukarelawan India (SSI) USM","orgHow":"stated","forms":[{"label":"Register","url":"https://forms.gle/GE53g6hLqfd3QoQY7"}],"sources":[{"role":"first","ts":"2026-09-02 21:10","sender":"UMisOne","orig":null,"line":824,"snippet":"Light Up Your Knowledge: Online Quiz !✨💡〛"},{"role":"latest","ts":"2026-09-27 22:05","sender":"UMisOne","orig":null,"line":3600,"snippet":"Light Up Your Knowledge: Online Quiz !✨💡〛"}],"text":"〚💡✨ 𝐋𝐢𝐠𝐡𝐭 𝐔𝐩 𝐘𝐨𝐮𝐫 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞: 𝐎𝐧𝐥𝐢𝐧𝐞 𝐐𝐮𝐢𝐳 !✨💡〛\nReady to test your knowledge and make a difference? 👀🧠✨\nJoin 𝐋𝐢𝐠𝐡𝐭 𝐔𝐩 𝐘𝐨𝐮𝐫 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞: 𝐎𝐧𝐥𝐢𝐧𝐞 𝐐𝐮𝐢𝐳 by 𝐒𝐞𝐤𝐫𝐞𝐭𝐚𝐫𝐢𝐚𝐭 𝐒𝐮𝐤𝐚𝐫𝐞𝐥𝐚𝐰𝐚𝐧 𝐈𝐧𝐝𝐢𝐚 (𝐒𝐒𝐈) 𝐔𝐒𝐌 and challenge yourself with fun questions inspired by the festive spirit of 𝐃𝐞𝐞𝐩𝐚𝐯𝐚𝐥𝐢 & 𝐂𝐡𝐫𝐢𝐬𝐭𝐦𝐚𝐬! 🪔🎄\nExplore the vibrant traditions, fascinating facts, and festive spirit surrounding 𝐃𝐞𝐞𝐩𝐚𝐯𝐚𝐥𝐢 & 𝐂𝐡𝐫𝐢𝐬𝐭𝐦𝐚𝐬! while putting your knowledge to the ultimate test. 💫\n📅 𝟏 𝐒𝐞𝐩𝐭𝐞𝐦𝐛𝐞𝐫 – 𝟐𝟓 𝐎𝐜𝐭𝐨𝐛𝐞𝐫 𝟐𝟎𝟐𝟔\n⏰ 𝐀𝐧𝐲𝐭𝐢𝐦𝐞 𝐰𝐢𝐭𝐡𝐢𝐧 𝐭𝐡𝐞 𝐠𝐢𝐯𝐞𝐧 𝐩𝐞𝐫𝐢𝐨𝐝\n📍 𝐏𝐥𝐚𝐭𝐟𝐨𝐫𝐦: 𝐆𝐨𝐨𝐠𝐥𝐞 𝐅𝐨𝐫𝐦\n💰 𝐏𝐚𝐫𝐭𝐢𝐜𝐢𝐩𝐚𝐭𝐢𝐨𝐧 𝐅𝐞𝐞: 𝐑𝐌𝟏 𝐎𝐧𝐥𝐲!\n🔗 𝐓𝐢𝐦𝐞 𝐭𝐨 𝐏𝐮𝐭 𝐘𝐨𝐮𝐫 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 𝐭𝐨 𝐭𝐡𝐞 𝐓𝐞𝐬𝐭: https://forms.gle/GE53g6hLqfd3QoQY7\nTogether, your participation can help spread kindness and t to do in an emergency…”\nThis is your sign to actually test yourself.\nOne quiz. First aid. Trail safety. And maybe a little panic when you realise you’re not as sure as you thought. 🩹😂\nSAFETY OR BLUNDER?\nSee you tomorrow.\n\nSign up here & give it a shot:\n🔗https://forms.gle/3Dox8g4vboYkjwbg7\n\n📅 21–28 October 2026\n💻 Online via Google Form · RM2\n🏆 RM15 / RM10 / RM5 up for grabs\n\n📩 Got the question?\nIrvin — 014-895 4642\nNurul Aimi — 011-3551 3992\n📸 @pscxusm26\n\n#FirstAid #TrailSafety #SafetyOrBlunder #OnlineQuiz #USM #PSCXUSM26 #HikingSafety #OutdoorSafety #FirstAidQuiz #TrailSafetyQuiz #CashPrize #Quiz2026 #USMEvents","nPosts":2,"flags":[],"notes":[]},{"id":"dementia","title":"HOPE Webinar 2: Beyond Forgetfulness (Dementia and Brain Care in Seniors)","cat":"talk","start":"2026-10-31T20:00+08:00","end":"2026-10-31T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM2","points":null,"desc":"Webinar by Assoc. Prof. Dr. Lee Chong Yew on dementia, brain health and healthy ageing.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/7inf5Jnh3WGNfaEG8"}],"sources":[{"role":"first","ts":"2026-10-14 22:10","sender":"UMisOne","orig":null,"line":9188,"snippet":"WEBINAR 2 : BEYOND FORGETFULNESS : UNDERSTANDING DEMENTIA AND BRAIN CARE IN SENIORS 🧠🧓"}],"text":"🧠🧓 𝐖𝐄𝐁𝐈𝐍𝐀𝐑 𝟐 : 𝐁𝐄𝐘𝐎𝐍𝐃 𝐅𝐎𝐑𝐆𝐄𝐓𝐅𝐔𝐋𝐍𝐄𝐒𝐒 : 𝐔𝐍𝐃𝐄𝐑𝐒𝐓𝐀𝐍𝐃𝐈𝐍𝐆 𝐃𝐄𝐌𝐄𝐍𝐓𝐈𝐀 𝐀𝐍𝐃 𝐁𝐑𝐀𝐈𝐍 𝐂𝐀𝐑𝐄 𝐈𝐍 𝐒𝐄𝐍𝐈𝐎𝐑𝐒 🧠🧓\nIs forgetfulness always a normal part of ageing? 🤔\nJoin us for an insightful session on 𝐝𝐞𝐦𝐞𝐧𝐭𝐢𝐚, 𝐛𝐫𝐚𝐢𝐧 𝐡𝐞𝐚𝐥𝐭𝐡, and 𝐡𝐞𝐚𝐥𝐭𝐡𝐲 𝐚𝐠𝐞𝐢𝐧𝐠. Learn more about recognising changes in memory and how we can support better brain health among seniors. 🧠✨\n🎤 𝐒𝐩𝐞𝐚𝐤𝐞𝐫 : Assoc. Prof. Dr. Lee Chong Yew\n📅 𝐃𝐚𝐭𝐞 : 31 October 2026 (Saturday)\n⏰ 𝐓𝐢𝐦𝐞 : 8.00 p.m. - 10.00 p.m.\n💻 𝐏𝐥𝐚𝐭𝐟𝐨𝐫𝐦 : Cisco Webex\n💵 𝐑𝐞𝐠𝐢𝐬𝐭𝐫𝐚𝐭𝐢𝐨𝐧 𝐅𝐞𝐞 : RM 2\n🔗 𝐑𝐞𝐠𝐢𝐬𝐭𝐞𝐫 𝐍𝐨𝐰 : https://forms.gle/7inf5Jnh3WGNfaEG8\n📞 Any Inquiries:\nYING HUAN : +6011-10732603\nFATIMAH: +6011-10950017\nDon’t miss out! Join us and discover how understanding 𝐝𝐞𝐦𝐞𝐧𝐭𝐢𝐚 and caring for our 𝐛𝐫𝐚𝐢𝐧 𝐡𝐞𝐚𝐥𝐭𝐡 can support healthier ageing 💚\nThank you!\n#HOPE2627\n#HealthOutreachProgramme\n#DementiaAwareness\n#BrainHealth\n#USMPharmacy\n#PusatPengajianSainsFarmasi","nPosts":1,"flags":[],"notes":[]},{"id":"canva","title":"Beyond the Template: Designing Better Content with Canva & AI","cat":"talk","start":"2026-11-03T20:00+08:00","end":"2026-11-03T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM2","points":null,"desc":"Hands-on sharing session on Canva and AI tools. Quiz prizes: RM10 / RM7 / RM5.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/iXA1mvyge8Kxii4fA"}],"sources":[{"role":"first","ts":"2026-10-16 11:27","sender":"UMisOne","orig":null,"line":9455,"snippet":"BEYOND THE TEMPLATE: Designing Better Content with Canva & AI ✨"},{"role":"latest","ts":"2026-10-20 07:55","sender":"UMisOne","orig":"16.10.2026 10:28","msg":43923,"snippet":"✨ 𝑩𝑬𝒀𝑶𝑵𝑫 𝑻𝑯𝑬 𝑻𝑬𝑴𝑷𝑳𝑨𝑻𝑬: 𝑫𝒆𝒔𝒊𝒈𝒏𝒊𝒏𝒈 𝑩𝒆𝒕𝒕𝒆𝒓 𝑪𝒐𝒏𝒕𝒆𝒏𝒕 𝒘𝒊𝒕𝒉 𝑪𝒂𝒏𝒗𝒂 & 𝑨𝑰 ✨"}],"text":"✨ 𝑩𝑬𝒀𝑶𝑵𝑫 𝑻𝑯𝑬 𝑻𝑬𝑴𝑷𝑳𝑨𝑻𝑬: 𝑫𝒆𝒔𝒊𝒈𝒏𝒊𝒏𝒈 𝑩𝒆𝒕𝒕𝒆𝒓 𝑪𝒐𝒏𝒕𝒆𝒏𝒕 𝒘𝒊𝒕𝒉 𝑪𝒂𝒏𝒗𝒂 & 𝑨𝑰 ✨\n\nLooking to transform your graphic design game and craft stunning visual content? 🎨🚀 Unlock your creative potential with us in this hands-on sharing session! Dive into essential design insights, clever hacks and powerful AI tools tailored to streamline your workflow and bring your ideas to life.\n\nEvent Details:\n🗓 Date: 3 November 2026\n⏰ Time: 8:00 PM – 10:00 PM\n💻 Platform: Cisco Webex\n🎟 Fee: RM2\n\n🎁 Exciting Quiz Prizes:\n🥇 1st Place: RM10\n🥈 2nd Place: RM7\n🥉 3rd Place: RM5\n\n📲 Scan the QR code in the poster to secure your spot today!\nhttps://forms.gle/iXA1mvyge8Kxii4fA \n\n\n📞 Got questions? feel free to contact:\n👤 Teoh Jia Xuan: 017-316 8721\n👤 Choo Zhen Lin: 017-491 3104\n\nDon't pass up the chance to supercharge your design skills. We can't wait to see you there! 👋✨\n\n#canva #design #graphicdesignworkshop #designskills #D  💊✨\nThink you know your meds? 👀💭 Put your pharmaceutical knowledge to the test with PharmQuiz: A Dose of Knowledge! 🧠💊 Whether you’re a pharmacy student or simply curious about medicines, this is your chance to challenge yourself, learn something new, and compete for exciting cash prizes! 🏆✨\nEvent Details:\n📅 Date: 𝟱 – 𝟭𝟴 𝗢𝗰𝘁𝗼𝗯𝗲𝗿 𝟮𝟬𝟮𝟲\n💻 Platform: 𝗚𝗼𝗼𝗴𝗹𝗲 𝗙𝗼𝗿𝗺 (𝗢𝗻𝗹𝗶𝗻𝗲)\n💵 Fee: 𝗥𝗠𝟭 𝗼𝗻𝗹𝘆\n📝 20 questions to test your knowledge!\n💰 Cash Prizes for Top 3:\n🥇 1st Place — RM5\n🥈 2nd Place — RM3\n🥉 3rd Place — RM1\n✨ MYCSD provided for all participants!\nReady to see how much you really know? 🤔💊\nThink fast, answer wisely, and get your dose of knowledge! 💉🧠✨\n🔗 Register here: https://forms.gle/5GMHL4wRQjFrED38A\n📲 Follow us for more updates and upcoming activities!\nAny inquiries:\n📞 Fazliyana: +6011-1076 5033\n📞 Haqimi: +6018-4699456\n#PharmQuiz\n#ADoseOfKnowledge\n#PharmacyQu\n…","nPosts":7,"forms":[],"flags":[],"notes":[],"elig":{"kind":"unstated","note":""}},{"mode":"in-person","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/z8G6HNBZjeTLPjJQA"}],"flags":[],"notes":["Transportation provided.","The post also says to scan the QR code on the poster."],"nPosts":1,"id":"tzuchi","title":"Tzu Chi Monthly Recycling Day 2026","cat":"activity","kind":"event","start":"2026-10-25T09:00+08:00","end":"2026-10-25T12:00+08:00","where":"HAMNA, Desa Permai Indah","fee":null,"points":"Earn MyCSD points","desc":"Hands-on morning of learning to sort recyclable items properly. Transport is provided.","org":"USM Green Ambassadors (from hashtag)","orgHow":"hashtag","sources":[{"role":"first","ts":"2026-10-20 07:55","sender":"UMisOne","orig":"19.10.2026 11:06","msg":43921,"snippet":"TZU CHI MONTHLY RECYCLING DAY 2026🌍♻️"}],"text":"TZU CHI MONTHLY RECYCLING DAY 2026🌍♻️\n\nJoin us for Tzu Chi Monthly Recycling Day and learn how to sort recyclable items properly while building a more sustainable community. Every item recycled is a step towards a cleaner and greener future! \n\n📅 Date: 25 October 2026 (Sunday)\n⏰ Time: 9:00 AM – 12:00 PM\n📍 Venue: HAMNA, Desa Permai Indah\n\nWhy join us?\n♻️ Learn how to sort recyclable items\n🎓 Earn MyCSD points\n🚐 Transportation provided \n\n📲 Scan the QR code on the poster or click the link to register now!\n🔗 https://forms.gle/z8G6HNBZjeTLPjJQA\n\nSmall actions, meaningful changes! 🪴✨\n\n#USMGreenAmbassadors #EPEHub #CGSS #TzuChi #RecyclingDay #Sustainability #GoGreen"},{"mode":"online","myCsd":true,"elig":{"kind":"all","note":"Open to students of USM, UniSZA, UUM, UniKL, KUIJSI, UMK and UNIMAS"},"forms":[{"label":"Register","url":"https://forms.gle/dXAhVuvQnfFfp1Cx8"}],"flags":[],"notes":["The post does not name the organiser."],"nPosts":1,"id":"beyondgrad","title":"Beyond Graduation: The Struggles of Real Life","cat":"talk","kind":"event","start":"2026-10-23T20:30+08:00","end":"2026-10-23T21:30+08:00","where":"Webex","fee":"RM2","points":"MyCSD Kebangsaan for USM students","desc":"Online talk with guest speaker YB Puan Kartiyaini Jeyapalan on the realities, challenges and preparation for life after university.","sources":[{"role":"first","ts":"2026-10-21 08:13","sender":"UMisOne","orig":"20.10.2026 08:04","msg":43940,"snippet":"📢 HEBAHAN PROGRAM | BEYOND GRADUATION: THE STRUGGLES OF REAL LIFE 🎓"}],"text":"📢 HEBAHAN PROGRAM | BEYOND GRADUATION: THE STRUGGLES OF REAL LIFE 🎓\n\nAssalamualaikum w.b.t. dan salam sejahtera!\n\nApa yang menanti kita selepas graduasi? Jom sertai *program BEYOND GRADUATION: THE STRUGGLES OF REAL LIFE* bersama tetamu jemputan istimewa, *YB PUAN KARTIYAINI JEYAPALAN* , untuk meneroka realiti, cabaran dan persediaan menghadapi kehidupan selepas universiti.\n\n📌 Butiran Program\n📅 Tarikh: 23 Oktober 2026 (Jumaat)\n⏰ Masa: 8.30 – 9.30 malam\n💻 Platform: Webex\n💰 Yuran: RM2 sahaja!\n🎯 MyCSD Kebangsaan untuk mahasiswa USM\n🏛️ Terbuka kepada mahasiswa USM, UniSZA, UUM, UniKL, KUIJSI, UMK dan UNIMAS.\n\n✨ Real Stories. Real Challenges. Real Talk for te","text":"The sign-up link is a Google Sheets file, not a form."}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-09-19 08:39","sender":"UMisOne","orig":null,"line":2135,"snippet":"PANGGUNG DEWATARA BAKAL BERMULA 🎊🎭"},{"role":"latest","ts":"2026-10-04 14:08","sender":"UMisOne","orig":null,"line":5417,"snippet":"PANGGUNG DEWATARA BAKAL BERMULA 🎊🎭"}],"text":"🎭🎊 *PANGGUNG DEWATARA BAKAL BERMULA* 🎊🎭\nSekreteriat Kebudayaan Adikarma USM KKTSS kini membuka peluang bagi korang menyertai kami sebagai *Ahli Jawatankuasa (AJK) Panggung Dewatara* 🎬‼️\nKami mencari krew bagi jabatan berikut:\n- *AJK Pendaftaran & 3K* ⌨️\n- *AJK Multimedia & Publisiti*🎥\n- *AJK Tajaan dan Undangan* 🎁\n- *AJK Teknikal dan Logistik* ⚒️\n- *AJK Pengurusan dan Protokol* 📋\n- *AJK Busana & MUA*💄\n- *AJK Vendor dan Jualan* 🍔\n- *AJK Hiasan dan Prop* 🎨\nInilah masanya bagi korang asah bakat, timba pengalaman dan hasilkan sebuah karya pementasan yang hebat bersama keluarga Adikarma‼️🌟\n*Daftar sekarang melalui pautan berikut:*\n- 🔗 https://docs.google.com/spreadsheets/d/1NLX0-XcN3y3bUFZRsU3l1P8Xg8qZbBlx/edit?usp=drive_link&ouid=113175343365388737395&rtpof=true&sd=true\n*Maklumat program:*\n- Tarikh: *19 December 2026 ~*⁠\n- Masa: *8:30PM - 11:00PM*\n- Lokasi: *Dewan Serbaguna (DSG)*⁠\nJangan lepaskan peluang ini 🆙 Ayuh sama-sama kita gegarkan Panggung Dewatara‼️🚀✨\n*#Adikarma*\n*#PanggungDewatara*","nPosts":2,"poster":false},{"id":"r-kprs","title":"KPRS USM: Peers 26/27","org":"Kelab Pembimbing Rakan Siswa (KPRS USM)","deadline":null,"kind":"recruit","dateText":"No deadline stated (posted 12 Oct)","csd":"myCSD not stated","who":"Not stated","note":"Only a Linktree page was posted, no form link.","forms":[{"label":"KPRS Linktree","url":"https://linktr.ee/kprsusm","warn":true}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-12 17:25","sender":"UMisOne","orig":null,"line":8222,"snippet":"PENCARIAN PEERS KELAB PEMBIMBING RAKAN SISWA (KPRS USM) SIDANG AKADEMIK 26/27] 🔉"},{"role er":"UMisOne","orig":"18.10.2026 22:08","msg":43915,"snippet":"✨ 𝐄𝐌𝐏𝐎𝐖𝐄𝐑𝐌𝐎𝐌 𝐂𝐑𝐄𝐀𝐓𝐈𝐎𝐍 𝐈𝐒 𝐇𝐈𝐑𝐈𝐍𝐆! ✨"}],"text":"✨ 𝐄𝐌𝐏𝐎𝐖𝐄𝐑𝐌𝐎𝐌 𝐂𝐑𝐄𝐀𝐓𝐈𝐎𝐍 𝐈𝐒 𝐇𝐈𝐑𝐈𝐍𝐆! ✨\n\nReady to gain real-world experience while creating meaningful social impact? 💖 EmpowerMom Creation (EMC) is opening recruitment for passionate 𝗨𝗦𝗠 𝘂𝗻𝗱𝗲𝗿𝗴𝗿𝗮𝗱𝘂𝗮𝘁𝗲 𝘀𝘁𝘂𝗱𝗲𝗻𝘁𝘀 to join our growing student-led social enterprise empowering B40 single mothers.\n\n📌 𝗢𝗽𝗲𝗻 𝗣𝗼𝘀𝗶𝘁𝗶𝗼𝗻𝘀:\nSecretary | Human Resource | Design | Publicity | Public Relation | Sales & Marketing | Logistic | Finance\n\n✨ 𝗪𝗵𝘆 𝗷𝗼𝗶𝗻 𝗘𝗠𝗖?\n ✔️ Hands-on job experience\n ✔️ Strengthen your resume & MYCSD profile\n ✔️ Build leadership & entrepreneurship skills\n ✔️ Be part of a purpose-driven team making real change\n\n📲 Scan the QR code or click on the link: https://forms.gle/hLaAif2KcGHiAM5b9 to 𝗮𝗽𝗽𝗹𝘆 𝗻𝗼𝘄!\n\nIf you’re proactive, a team player, and ready to grow with us — 𝘁𝗵𝗶𝘀 𝗶𝘀 𝘆𝗼𝘂𝗿 𝘀𝗶𝗴𝗻 🚀\n\n#EmpowerMomCreation\n#SDG\n#SocialEnterprise"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/i7yHfTeXSEhaHZwP7"}],"flags":[],"poster":false,"nPosts":1,"id":"r-umc27","title":"UMC27 (USM Mathematics Competition 2027): Committee","org":"UMC27","deadline":null,"dateText":"No deadline stated; interviews 22 & 23 Oct 2026, 8:30 – 10:30 pm (Webex)","csd":"myCSD not stated","who":"Not stated","note":"Departments: Registration, Protocol, Sponsorship, Special Duties & Prize, Technical, Media & Publicity, Question & Tester. The poster also has a QR code.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-20 07:54","sender":"UMisOne","orig":"15.10.2026 06:53","msg":43917,"snippet":"📣 *WE ARE RECRUITING! UMC27 NEEDS YOU!* 🧮💚"}],"text":"📣 *WE ARE RECRUITING! UMC27 NEEDS YOU!* 🧮💚\n\nHi everyone! *USM Mathematics Competition 2027* is looking for new committee members! 🎉\n\nInterested in gaining experience, making new connections and being part of an exciting event? Join our team! ✨\n\n📌 Departments: Registration, Protocol, Sponsorship, Special Duties & Prize, Technical, Media & Publicity, Question & Tester\n\n🗓️ *Interview: 22 & 23 October 2026*\n⏰ *8:30 PM – 10:30 PM*\n💻 *Online via Webex*\n\nScan the QR code on the poster or click here to register: https://forms.gle/i7yHfTeXSEhaHZwP7 ! \nDon’t miss this opportunity to be part of UMC27. 🫶🏻\n\nYour journey with UMC27 starts here! 💚"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/dSHYYX3ytfmqTTZ67"}],"flags":[],"poster":false,"nPosts":1,"id":"r-siswa","title":"SISWA USM: Exco & Pembantu Exco 2026/27","org":"SISWA USM","deadline":"2026-10-27","dateText":"Applications until 27 Oct 2026; interviews 30 & 31 Oct 2026","csd":"\"mata MYCSD\" through involvement (stated)","who":"Years 1 – 3, \"PKU & Pelajar Normal\"","note":"Five departments: Academic & Career, Alumni & External Relations, Culture & Sports, Welfare/Safety/Health, TDF & Protocol. The post says SISWA works for the welfare of students with disabilities (OKU). Interview time and place not stated. The poster also has a QR code.","eligKind":"all","sources":[{"role":"first","ts":"2026-10-20 07:55","sender":"UMisOne","orig":"19.10.2026 12:22","msg":43925,"snippet":"💜 PENGAMBILAN EXCO & PEMBANTU EXCO SISWA USM 2026/2027 💜"}],"text":"💜 PENGAMBILAN EXCO & PEMBANTU EXCO SISWA USM 2026/2027 💜\n\nKami membuka peluang kepada mahasiswa/i USM yang bersemangat, komited dan ingin menimba pengalaman baharu untuk menyertai barisan Exco SISWA bagi Sidang Akademik 2026/2027. ♿💜\n\nMengapa sertai SISWA?\n💙 Berpeluang memperoleh mata MYCSD melalui penglibatan dalam aktiviti dan program SISWA\n✨ Mengembangkan kemahiran kepimpinan dan kerja berpasukan\n💜 Menyumbang kepada kesejahteraan mahasiswa OKU\n\n📎Pautan Permohonan : https://forms.gle/dSHYYX3ytfmqTTZ67\n\nPengambilan terbuka kepada jabatan-jabatan berikut:\n📚 *Akademik & Kerjaya*\n🤝 *Alumni & Perhubungan Luar*\n🎨 *Kebudayaan & Sukan*\n🛡️ *Kebajikan, Keselamatan & Kesihatan*\n🎯 *TDF & Protokol*\n\n🗓️ Tarikh Akhir Permohonan:  27 Oktober 2026\n🗣️ Tarikh Temuduga: 30 Oktober 2026 dan 31 Oktober  2026\n🎓 Kelayakan: Terbuka kepada Pelajar Tahun 1-3 (PKU & Pelajar Normal)\n\n> 💬 Sebarang pertanyaan lanjut boleh hubungi:\n> • Thisha: 010-3902376\n> • Danial: 012-2939138\n\nJangan tunggu lagi! Imbas kod QR pada poster atau daftar sekarang sebelum 27 Oktober 2026! 💪✨\n\n#SISWAUSM #RecruitmentExco #USM #Inklusiviti #MahasiswaPrihatin #OKU"},{"kind":"recruit","forms":[],"flags":[],"poster":true,"nPosts":1,"id":"r-eneur","title":"Kelab Keusahawanan USM (Eneur Club): Exco Fasa 2","org":"Kelab Keusahawanan USM (Eneur Club)","deadline":"2026-10-22","dateText":"Applications 15 – 22 Oct 2026; interviews 24 & 25 Oct 2026","csd":"\"Kumpul mata MYCSD\" (stated)","who":"Not stated","note":"Five departments: Activities/Operations/Technical, Finance & Welfare, Multimedia & Documentation, Marketing & R&D, External Relations. Applying is by QR code on the poster only (no link posted). Interview platform and place not stated.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-20 07:57","sender":"UMisOne","orig":"19.10.2026 21:23","msg":43935,"snippet":"🚨 *PENGUMUMAN*🚨"}],"text":"🚨 *PENGUMUMAN*🚨\n\n🔥 *PENCARIAN REKRUT KELAB KEUSAHAWANAN USM (Eneur Club) FASA 2 KINI DIBUKA!* 🔥\n\nNak tambah pengalaman, bina keyakinan diri dan kembangkan kemahiran sambil sertai program-program menarik? Inilah masanya! 💜🤍\n\n✨ APA ISTIMEWANYA? 🎉\n• Boost kemahiran kepimpinan 🚀\n• Bina leadership & teamwork 🤝\n• Tingkatkan kemahiran komunikasi 🗣️\n• Kumpul mata MYCSD 🎓\n\n💼 JABATAN YANG DITAWARKAN:\n🔹 Aktiviti, Operasi & Teknikal\n🔹 Kewangan & Kebajikan\n🔹 Multimedia & Dokumentasi\n🔹 Pemasaran & R&D\n🔹 Perhubungan Luar\n\n📅 Tarikh Permohonan: 15 Oktober – 22 Oktober 2026\n💻 Temuduga: 24 & 25 Oktober 2026\n\n📢 Jangan lepaskan peluang untuk menjadi Exco Eneur!\n\n👉 IMBAS KOD QR PADA POSTER & DAFTAR SEKARANG!\n\n📲 Sebarang pertanyaan, boleh hubungi:\nAimran: 011-21520173\nYasmine: 011-53529311\nSyazana: 017-4337129\n\n#USM #EneurUSM #KelabKeusahawananUSM D not stated in the post","who":"All students","forms":[{"label":"Register / renew","url":"https://forms.gle/iGyJsh3uuB91gHY3A"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-09-16 14:08","sender":"UMisOne","orig":null,"line":1953,"snippet":"PENDAFTARAN DAN PEMBAHARUAN KEAHLIAN PERKUMPULAN ANAK-ANAK SARAWAK (PERKASA) USM SIDANG AKADEMIK 2026/2027]"}],"text":"*[PENDAFTARAN DAN PEMBAHARUAN KEAHLIAN PERKUMPULAN ANAK-ANAK SARAWAK (PERKASA) USM SIDANG AKADEMIK 2026/2027]*\nAssalamualaikum, Salam Sejahtera dan Salam Encang, Bumi Kenyalang 💛❤️🖤\nSukacita dimaklumkan bahawa PERKASA telah *membuka pendaftaran* kepada semua mahasiswa/i untuk menjadi *AHLI PERKUMPULAN ANAK-ANAK SARAWAK (PERKASA) USM bagi SIDANG AKADEMIK 2026/2027.*\nSehubungan dengan itu, *Yuran Pendaftaran* adalah ditetapkan seperti berikut:\n- *Pembaharuan Keahlian: RM 8*\n- ⁠*Ahli Baharu: RM 10*\nPermohonan Ahli Baharu dan Pembaharuan Keahlian boleh dilakukan menerusi Google Form berikut:\n🔗 https://forms.gle/iGyJsh3uuB91gHY3A\n📍Tarikh pendaftaran dan pembaharuan keahlian akan dibuka pada *15 September hingga 20 Oktober 2026 !*\n📣 Jangan lepaskan peluang untuk menjadi ahli dengan pelbagai hebahan, program dan inisiatif oleh Perkumpulan Anak-anak Sarawak (PERKASA) Universiti Sains Malaysia.\nSebarang pertanyaan, boleh hubungi:\n📞 *Caroline Lema (019-4840377)*\n📞 *Herman Gabriel (011-36361074)*","nPosts":1,"flags":[],"poster":false},{"id":"m-ibos","title":"IBOS USM (Integration Balance of Skills)","fee":"RM3","close":"2026-10-25","kind":"member","dateText":"5 – 25 Oct 2026","csd":"\"Mata MyCSD diberikan kepada ahli aktif\" (active members)","who":"All students","forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLScsfXBKam8LJE368kchHhUd380McylAh9qzqDjb7aAEq4jDJg/viewform?usp=dialog"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-07 11:38","sender":"UMisOne","orig":null,"line":5957,"snippet":"PENCARIAN AHLI AKTIF SEKRETARIAT IBOS USM]"},{"role":"latest","ts":"2026-10-20 07:54","sender":"UMisOne","orig":"19.10.2026 08:55","msg":43920,"snippet":"🔊*[PENCARIAN AHLI AKTIF SEKRETARIAT IBOS USM]*"}],"text":"🔊*[PENCARIAN AHLI AKTIF SEKRETARIAT IBOS USM]*\n\nAsalammualaikum dan Salam Sejahtera 💙\n\nSekretariat Integration Balance of Skills (IBOS USM) kini membuka peluang kepada semua mahasiswa/i untuk menjadi sebahagian daripada keluarga besar IBOS USM!\n\nAntara keistimewaan yang dapat diperoleh jika anda menyertai kami seperti yang berikut:\n\n- Pelbagai aktiviti yang menarik bakal menanti anda\n- ⁠Mata *MyCSD* diberikan kepada ahli aktif\n\nTARIKH PENDAFTARAN:\n📆 5 - 25 Oktober 2026\n\n*BAYARAN YURAN RM3 SAHAJA*\n\nhttps://docs.google.com/forms/d/e/1FAIpQLScsfXBKam8LJE368kchHhUd380McylAh9qzqDjb7aAEq4jDJg/viewform?usp=dialog\n\nJangan lepaskan peluang keemasan ini !!!\n\nSebarang pertanyaan, boleh hubungi:\n\n☎️ 017-5987715 ( syasya )\n\n*\"Sinergi Kemahiran, Keseimbangan Kejayaan\"*\n\n-♟️💙🛠️\n\n#IBOSUSM\n#WeLead\n#IntegrationBalanceOfSkills\n#TVETUSM","nPosts":9,"flags":[],"poster":false},{"id":"m-ksusm","title":"Kelab Sejarah USM (KSUSM)","fee":"Renewal RM2 / new RM3","close":"2026-10-25","kind":"member","dateText":"5 – 25 Oct 2026","csd":"\"berpeluang memperoleh mata MyCSD\" (a chance to earn)","who":"All students","forms":[{"label":"Register / renew","url":"https://docs.google.com/forms/d/e/1FAIpQLSePC6B6vxWB-FHzjqNQL3rqICCdA8eZRaA7KnbN-DUD1qkUHQ/viewform"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-09 07:14","sender":"UMisOne","orig":null,"line":7135,"snippet":"PENCARIAN AHLI KELAB SEJARAH USM 2026/2027 KINI DIBUKA!"}],"text":"📢 *PENCARIAN AHLI KELAB SEJARAH USM 2026/2027 KINI DIBUKA!*\nAssalamualaikum, Salam Sejahtera & Salam Kami Memimpin! 💛🖤\nKelab Sejarah Universiti Sains Malaysia (KSUSM) kini membuka Pencarian Ahli bagi Sidang Akademik 2026/2027! 🔥\nPeluang ini terbuka kepada semua pelajar USM yang berminat untuk menyertai aktiviti dan program KSUSM 🫱🏽‍🫲🏽\nBukan itu sahaja, anda juga berpeluang memperoleh :[{"role":"first","ts":"2026-10-04 14:04","sender":"UMisOne","orig":null,"line":5252,"snippet":"PENCARIAN AHLI AKTIF SEKRETARIAT SUKARELAWAN USM (SUKASS)"}],"text":"PENCARIAN AHLI AKTIF SEKRETARIAT SUKARELAWAN USM (SUKASS)\nKami daripada Sekretariat Sukarelawan USM (SUKASS) mengalu-alukan semua mahasiswa/i USM untuk mendaftar keahlian SUKASS bagi Sidang Akademik 2026/2027!\nKelebihan ahli SUKASS:\n🚨 Menjadi golongan utama yang menerima hebahan pencarian sukarelawan.\n🚨 Mempunyai peluang terlibat sebagai sekretariat bagi projek-projek penganjuran SUKASS.\n🚨 Berpeluang terlibat program Majlis Sukarelawan Universiti Awam Malaysia (MASKUM).\n🚨 MyCSD Ahli Aktif\nPautan pendaftaran:\nhttps://forms.gle/SW9TYXBG75orXstMA\nYuran keahlian: RM 5 sahaja!\nSebarang pertanyaan mohon hubungi;\n📲 Fami : 011-39638297\n📲 Tata : 017-9859213\nAtau layari laman rasmi Instagram kami\nhttps://www.instagram.com/sukarelawanusm?stkn=MTQ5bW5jdnQxYzcxMQ==\n\"WE SERVE OVER THE BOUND\"","nPosts":1,"flags":[],"poster":false},{"id":"m-greenlung","title":"USM Green Lung","fee":"New RM5 / renewal RM3","close":null,"kind":"member","dateText":"No closing date stated. Membership valid for one tenure only","csd":"\"Earn MyCSD points through your involvement\"","who":"Old and new members","forms":[{"label":"Register / renew","url":"https://docs.google.com/forms/d/e/1FAIpQLSe5CR_YUu5XKPIELtUuxukYj2nrWfUWApSyPSuKXK72zRdDjQ/viewform"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-01 22:35","sender":"UMisOne","orig":null,"line":4632,"snippet":"USM Green Lung Membership】"}],"text":"【𝙐𝙎𝙈 𝙂𝙧𝙚𝙚𝙣 𝙇𝙪𝙣𝙜 𝙈𝙚𝙢𝙗𝙚𝙧𝙨𝙝𝙞𝙥】\nGreetings from Sekretariat Green Lung USM ! 💚\nReady to be part of something meaningful? We’re excited to announce that membership registration for the Green Lung is officially opened for old and new members! 🌱✨\nWhether you’re a returning member or joining us for the first time, this is your chance to be part of the USM Green Lung community and contribute towards a healthier, tobacco-free future! 🚭\nWhy become a Green Lung member?\n🌟 Enjoy exclusive member-only discounts\n🤝 Get opportunities to join our committee\n🎯 Earn MyCSD points through your involvement\n🌱 Be part of tobacco control advocacy and meaningful activities\n💸 𝗡𝗲𝘄 𝗠𝗲𝗺𝗯𝗲𝗿𝘀𝗵𝗶𝗽: RM5\n🔁 𝗠𝗲𝗺𝗯𝗲𝗿𝘀𝗵𝗶𝗽 𝗥𝗲𝗻𝗲𝘄𝗮𝗹: RM3\n🔗 Register or renew your membership here:\nhttps://docs.google.com/forms/d/e/1FAIpQLSe5CR_YUu5XKPIELtUuxukYj2nrWfUWApSyPSuKXK72zRdDjQ/viewform\n📌 Membership is valid for ONE TENURE only.","nPosts":1,"flags":[],"poster":false},{"id":"m-smi","title":"Sekretariat Mahasiswa Intelek (SMI), ahli","fee":"Not stated","close":null,"kind":"member","dateText":"No closing date stated","csd":"Join 3 SMI programmes to qualify for MYCSD as an active member (conditional)","who":"USM students","forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSeoqdyYowVy7cT7FHDJbc58KNZF1SumgELClgknQj_hp7xsqQ/viewform"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-09-25 17:51","sender":"UMisOne","orig":null,"line":2979,"snippet":"PENCARIAN AHLI SERKETARIAT MAHASISWA INTELEK SIDANG AKADEMIK 2026/2027🔊"}],"text":"🔊PENCARIAN AHLI SERKETARIAT MAHASISWA INTELEK SIDANG AKADEMIK 2026/2027🔊\nAssalamualaikum dan salam sejahtera.🙌✨\nTumbuh Bersama Sekretariat Mahasiswa Intelek!\nAdakah anda mahasiswa USM yang berjiwa besar? Ingin membina potensi diri sambil menyumbang bakti kepada masyarakat? Kami di Sekretariat Mahasiswa Intelek (SMI) mencari anda untuk menjadi sebahagian daripada komuniti kami!\nSertai kami untuk:\n✅ Membina kebolehan diri\n✅ Kembali menyumbang kepada masyarakat\n✅ Menerima hebahan progam terawal\n💥Sertai 3 program SMI untuk melayakkan diri mendapatkan MYCSD sebagai ahli aktif💥\nDaftar Sekarang!\nhttps://docs.google.com/forms/d/e/1FAIpQLSeoqdyYowVy7cT7FHDJbc58KNZF1SumgELClgknQj_hp7xsqQ/viewform\nSebarang pertanyaan, sila hubungi:\n📞ALISYA (011-51340128)\n📞HAFIZ (011-7083294)\nJangan tunggu lagi, ruang untuk menyerlahkan potensi anda sedang menanti! 💜\n#WadahPen   if (props) for (const k in props){
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c === null || c === undefined || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

  const all = visibleBase(now);
  // summary line (counts each event once; only events that still can happen)
  const live = ITEMS.filter(it => it.myCsd && !hasEnded(it, now));
  const ticked = live.filter(it => ticks[it.id]).length;
  root.append(h('p', {class:'summary'},
    h('b', {text:live.length+' upcoming or open events'}), ' say myCSD is provided · amounts are never stated in the chat, so no total is shown · ',
    h('b', {text:ticked+' ticked'}), ' as registered'));
  // controls
  const q = h('input', {class:'search', type:'search', placeholder:'search title, organiser, venue…', 'aria-label':'Search events', value:S.q});
  q.addEventListener('input', () => { S.q = q.value; renderList(); });
  const fbtn = h('button', {class:'btn', type:'button', 'aria-expanded':S.fOpen, 'aria-controls':'fpanel', text:'filter', onclick:() => { S.fOpen = !S.fOpen; render(); }});
  root.append(h('div', {class:'controls'}, q, fbtn));
  if (S.fOpen){
    const orgs = [...new Set(ITEMS.filter(i => i.org).map(i => i.org))].sort((a,b) => a.localeCompare(b));
    const sel = h('select', {'aria-label':'Organiser', onchange:e => { S.org = e.target.value; renderList(); renderChips(); }},
      h('option', {value:'', text:'any organiser'}), orgs.map(o => h('option', {value:o, text:o, selected:S.org===o})));
    root.append(h('div', {class:'fpanel', id:'fpanel'},
      h('label', {}, h('input', {type:'checkbox', checked:S.regOnly, onchange:e => { S.regOnly = e.target.checked; renderList(); renderChips(); }}), 'can still register (a link or poster QR exists, no stated deadline passed)'),
      h('label', {}, h('input', {type:'checkbox', checked:S.weekOnly, onchange:e => { S.weekOnly = e.target.checked; renderList(); renderChips(); }}), 'this week (starts or ends within 7 days)'),
      h('label', {}, 'organiser ', sel)));
  }
  root.append(h('div', {class:'chips', id:'chips', role:'group', 'aria-label':'Type of event'}));
  if (useStrip()) root.append(h('div', {id:'stripbox'}));
  root.append(h('div', {id:'listbox'}));
  renderChips(); renderList();
}
function renderChips(){
  const box = document.getElementById('chips'); if (!box) return;
  const now = Date.now();
  const base = visibleBase(now).filter(it => !hasEnded(it, now) && (!S.day || (it.kind === 'event' && dayKey(it.s) === S.day)));
  box.textContent = '';
  CATS.forEach(([k, label]) => {
    const n = k === 'all' ? base.length : base.filter(i => i.cat === k).length;
    box.append(h('button', {class:'chip', type:'button', 'aria-pressed':S.cat===k, onclick:() => { S.cat = k; renderChips(); renderList(); }},
      label, ' ', h('span', {class:'n', text:'('+n+')'})));
  });
}
function renderList(){
  const box = document.getElementById('listbox'); if (!box) return;
  const now = Date.now();
  box.textContent = '';
  const sb = document.getElementById('stripbox');
  const base = visibleBase(now);
  if (sb){ sb.textContent = ''; sb.append(renderStrip(now, base.filter(it => !hasEnded(it, now)).filter(it => S.cat === 'all' || it.cat === S.cat))); }
  const inCat = it => S.cat === 'all' || it.cat === S.cat;
  const up = base.filter(it => !hasEnded(it, now) && it.kind === 'event' && inCat(it) && (!S.day || dayKey(it.s) === S.day)).sort((a,b) => a.s - b.s);
  const open = S.day ? [] : base.filter(it => !hasEnded(it, now) && it.kind === 'window' && inCat(it)).sort((a,b) => a.e - b.e);
  const endedRows = base.filter(it => hasEnded(it, now) && inCat(it)).sort((a,b) => b.e - a.e);
  box.append(section('upcoming', up.length+' with a start time', up.map(it => rowFor(it, now))));
  if (!S.day) box.append(section('open now', open.length+' that run over a period (no single start time)', open.map(it => rowFor(it, now))));
  else box.append(h('p', {class:'note', text:'Pick the same day again to clear it. Items that run over a period are hidden while a day is picked.'}));
  if (endedRows.length){
    const det = h('details', {class:'fold'}, h('summary', {text:'ended ('+endedRows.length+')'}),
      h('p', {class:'note', text:'Past myCSD events seen in the chat, newest first. Corrections posted later are noted inside each one.'}),
      h('ul', {class:'rows'}, endedRows.map(it => rowFor(it, now))));
    box.append(det);
  }
  if (!settings.showNoCsd) box.append(h('p', {class:'note', text:'Events that never mention myCSD are hidden. You can show them in settings.'}));
}

/* ---------- recruitment / memberships tabs ---------- */
function listRow(it, now, kind){
  const closes = it.dl;
  const dt = deadlineTag(closes, now);
  const li = h('li', {class:'row'});
  li.append(h('div', {class:'date'}, h('span', {class:'d1', text:closes ? dm(closes) : '—'}), closes ? 'closes' : 'no date'));
  const meta = kind === 'recruit' ? it.org : it.fee;
  const tags = h('div', {class:'tags'});
  if (dt) tags.append(h('span', {class:'tag '+dt.cls, text:dt.text}));
  else tags.append(h('span', {class:'tag', text:'no deadline stated'}));
  let el;
  if (it.campus) el = eligTag(it);
  else if (it.eligKind === 'all') el = {text:'open to you', cls:'go'};
  else if (it.eligKind === 'limited') el = {text:'limited', cls:''};
  else el = {text:'eligibility not stated', cls:''};
  tags.append(h('span', {class:'tag '+el.cls, text:el.text, title:it.who||null}));
  if (/not stated/i.test(it.csd || '')) tags.append(h('span', {class:'tag', text:'myCSD not stated'}));
  if ((it.flags||[]).some(f => f.t === 'conflict')) tags.append(h('span', {class:'tag chk', text:'check details'}));
  li.append(h('div', {class:'main'},
    h('button', {class:'title', type:'button', text:it.title, 'aria-haspopup':'dialog', onclick:e => openPop(it, e.currentTarget)}),
    h('div', {class:'meta', text:meta}), tags));
  const side = h('div', {class:'side'});
  if (dt) side.append(h('span', {class:'cd', text:dt.text}));
  const f = (it.forms||[])[0];
  if (f && safeUrl(f.url)) side.append(link(f, null, kind === 'recruit' ? 'apply' : 'register'));
  else if (it.poster) side.append(h('span', {class:'poster', text:'poster QR only'}));
  li.append(side);
  return li;
}
function renderSimple(root, arr, kind, titleText, intro, closedStatic){
  const now = Date.now();
  const openRows = arr.filter(r => r.dl === null || now <= r.dl).sort((a,b) => (a.dl===null) - (b.dl===null) || a.dl - b.dl);
  const closedRows = arr.filter(r => r.dl !== null && now > r.dl).sort((a,b) => b.dl - a.dl);
  root.append(h('p', {class:'summary', text:intro}));
  root.append(section(titleText, openRows.length+' listed, soonest deadline first', openRows.map(r => listRow(r, now, kind))));
  const closedAll = closedRows.map(r => listRow(r, now, kind));
  const det = h('details', {class:'fold'}, h('summary', {text:'closed ('+(closedRows.length+closedStatic.length)+')'}),
    closedAll.length ? h('ul', {class:'rows'}, closedAll) : null,
    h('ul', {class:'rows'}, closedStatic.map(c => h('li', {class:'row ended'}, h('div', {class:'date'}), h('div', {class:'main'}, h('button', {class:'title', type:'button', text:c[0], onclick:e => openPop({kind:'closed', title:c[0], dateText:c[1], sources:c[2]||[], text:c[3]||'', id:c[4]||c[0]}, e.currentTarget)}), h('div', {class:'meta', text:c[1]})), h('div', {class:'side'})))),
    h('p', {class:'note', text:'Only drives I read in the chat and could confirm as closed are listed. Older August and September drives are not listed one by one.'}));
  root.append(det);
}

/* ---------- settings tab ---------- */
function renderSettings(root){
  const nTicks = Object.keys(ticks).length;
  const radio = (name, val, label, cur, set) => h('label', {class:'opt'}, h('input', {type:'radio', name, value:val, checked:cur===val, onchange:() => { set(val); saveSettings(); render(); }}), h('span', {text:label}));
  root.append(h('div', {class:'set'},
    h('h3', {text:'layout (events page)'}),
    radio('layout','auto','Automatic: date strip on wide screens, plain list on phones', settings.layout, v => settings.layout = v),
    radio('layout','strip','Always show the date strip above the list', settings.layout, v => settings.layout = v),
    radio('layout','list','Plain list only', settings.layout, v => settings.layout = v),
    h('h3', {text:'reference campus'}),
    radio('campus','induk','Induk (main campus, Penang)', settings.campus, v => settings.campus = v),
    radio('campus','kej','Kejuruteraan (Engineering campus, Nibong Tebal)', settings.campus, v => settings.campus = v),
    h('p', {text:'This only changes the "open to you" marker on drives that name one campus (for example the Drone Club is Engineering campus only). Events that do not say who can join stay "eligibility not stated".'}),
    h('h3', {text:'events that do not mention myCSD'}),
    h('label', {class:'opt'}, h('input', {type:'checkbox', checked:settings.showNoCsd, onchange:e => { settings.showNoCsd = e.target.checked; saveSettings(); render(); }}), h('span', {text:'Show events that don\'t mention myCSD (they get a dashed "no myCSD mentioned" tag)'})),
    h('h3', {text:'saved in this browser'}),
    h('p', {text: storageOK ? 'Your ticks and these settings are saved only in this browser on this device. They do not sync to your phone or to your friend, and clearing browser data wipes them.' : 'This browser is blocking saving, so ticks and settings last only until you close or reload the page.'}),
    h('p', {text:nTicks+' event'+(nTicks===1?'':'s')+' ticked as registered.'}),
    h('button', {class:'btn', type:'button', text:'clear all ticks', disabled:!nTicks, onclick:() => { if (confirm('Remove all registered ticks from this browser?')){ ticks = {}; saveTicks(); render(); } }}),
    h('h3', {text:'how to read this page'}),
    h('ul', {},
      h('li', {text:'Dates and times are Malaysia time (UTC+8). A post\'s own date is never used as the event date.'}),
      h('li', {text:'Registration deadlines without a time are treated as running to the end of that day.'}),
      h('li', {text:'"open to you" appears only when the post clearly says who can join. Otherwise it says "eligibility not stated".'}),
      h('li', {text:'Types: webinars & talks = talks and sharing sessions; competitions = quizzes, contests, tournaments and runs with ranked winners or prizes; activities = everything else (runs, workshops, performances, interaction days). I decided this from each post, so tell me if one is in the wrong group.'}),
      h('li', {text:'Points: the chat only ever says myCSD is "provided". No point amounts appear, so none are shown or added up.'}),
      h('li', {text:'Same event posted many times is shown once. Open an event to see the first and latest posts it came from.'})),
    h('h3', {text:'things the chat leaves unresolved'}),
    h('ul', {},
      h('li', {text:'Vitamins quiz (From A to Z): two different register links posted 12 seconds apart; the 21 Oct repost carries only the first.'}),
      h('li', {text:'Beyond the Turf (hockey talk): two different register forms; the Malay post also leaves out the fee.'}),
      h('li', {text:'KPRS USM Exco: the post gives 22 – 23 Oct at Kafe Indah Kembara but does not say if that is sign-up or interviews.'}),
      h('li', {text:'BikeCommute@USM: the 26 Aug and 7 Sep posts have different form links.'}),
      h('li', {text:'Glow Paint Run: one of three posted links differs by capital letters; the twice-posted one is used.'}),
      h('li', {text:'Links on base44.app (Foam O Run and the mental-health series) could not be checked from here.'}),
      h('li', {text:'Photography Competition and MedHealth 8.0 quiz: the year is not written; 2026 is assumed.'}),
      h('li', {text:'CUS Interaction Day: "CUS" is never spelled out.'}),
      h('li', {text:'Green ConvEx Ep 3, Mario Kart, BYIC and the Eneur Club exco drive: registration only by poster QR, no link in the chat.'}))));
}

/* ---------- popup ---------- */
function dd(label, value){ return value ? [h('dt', {text:label}), h('dd', {}, value)] : []; }
function srcList(it){
  const s = it.sources || [];
  if (!s.length) return null;
  return h('ul', {class:'srcs'}, s.map(x => h('li', {},
    (x.role === 'first' ? 'first posted ' : x.role === 'latest' ? 'latest post ' : x.role === 'related' ? 'related post ' : 'post ') + stamp(x.ts) + ' · ' + x.sender + (x.orig ? ' (forwarded, originally '+x.orig+')' : '') + (x.line ? ' · line ' + x.line + ' of the chat file' : ' · message #' + x.msg + ' of the 21 Oct export'),
    h('br'), '“' + x.snippet + '”')));
}
function whenText(it){
  if (it.kind === 'ended') return it.dateText;
  if (it.kind === 'window') return dmy(it.s)+' to '+dmy(it.e)+' (whole days; no times stated)';
  if (it.s === null) return null;
  const same = dayKey(it.s) === dayKey(it.e);
  return wk(it.s)+' '+dmy(it.s)+', '+hm(it.s)+(same ? '–'+hm(it.e) : ' to '+wk(it.e)+' '+dmy(it.e)+' '+hm(it.e))+' (Malaysia time)';
}
function openPop(it, trigger){
  S.lastFocus = trigger || document.activeElement;
  const now = Date.now();
  const root = document.getElementById('pop-root'); root.textContent = '';
  const close = () => { root.textContent = ''; document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); if (S.lastFocus && S.lastFocus.focus) S.lastFocus.focus(); };
  const onKey = e => {
    if (e.key === 'Escape'){ close(); return; }
    if (e.key === 'Tab'){
      const f = [...pop.querySelectorAll('a[href],button:not(:disabled),input,select,[tabindex="0"]')];
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  };
  const pop = h('div', {class:'pop', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'pop-title'});
  pop.append(h('button', {class:'x', type:'button', 'aria-label':'Close', text:'×', onclick:close}));
  pop.append(h('h3', {id:'pop-title', text:it.title}));
  const tags = h('div', {class:'tags'});
  if (it.cat) tags.append(h('span', {class:'tag', text:CATNAME[it.cat]}));
  if (it.kind === 'event' || it.kind === 'window'){
    if (it.myCsd === false) tags.append(h('span', {class:'tag dashed', text:'no myCSD mentioned'}));
    if (!hasEnded(it, now)){ const st = statusTag(it, now); tags.append(h('span', {class:'tag '+st.cls, text:st.text})); tags.append(h('span', {class:'tag', text:countdown(it, now)})); }
    else tags.append(h('span', {class:'tag', text:'ended'}));
  } else if (it.kind === 'ended' || it.kind === 'closed') tags.append(h('span', {class:'tag', text:'ended'}));
  pop.append(tags);

  const rows = [];
  if (it.kind === 'recruit' || it.kind === 'member' || it.kind === 'closed'){
    rows.push(dd('when', it.dateText));
    rows.push(dd('organiser', it.org));
    rows.push(dd('fee', it.fee));
    rows.push(dd('myCSD', it.csd));
    rows.push(dd('who can join', it.who));
    if (it.dl) rows.push(dd('closing', dmy(it.dl) + ' (no time stated, treated as end of day)'));
    rows.push(dd('details', it.note));
  } else {
    rows.push(dd('when', whenText(it)));
    rows.push(dd('where', it.where));
    rows.push(dd('organiser', it.org ? it.org + (it.orgHow === 'hashtag' ? ' (inferred from a hashtag or name in the post)' : '') : (it.kind==='ended'?null:'not stated')));
    rows.push(dd('fee', it.kind === 'ended' ? null : (it.fee || 'not stated')));
    rows.push(dd('myCSD', it.myCsd === false ? 'not mentioned in the post' : it.points));
    if (it.kind !== 'ended') rows.push(dd('who can join', (it.elig && it.elig.kind === 'all') ? 'Open: ' + (it.elig.note || '') : 'not stated'));
    if (it.dl) rows.push(dd('register by', dmy(it.dl) + ' (no time stated, treated as end of day)'));
    if (it.notes && it.notes.length) rows.push(dd('good to know', h('div', {}, it.notes.map(n => h('div', {text:n})))));
    rows.push(dd('about', it.desc));
  }
  pop.append(h('dl', {}, rows.flat()));

  (it.flags || []).forEach(f => pop.append(h('div', {class:'flag '+f.t, text:(f.t==='conflict'?'Unresolved: ':f.t==='inferred'?'Assumed: ':f.t==='missing'?'Missing: ':f.t==='correction'?'Corrected later: ':'Note: ')+f.text})));

  const forms = (it.forms || []);
  if (forms.length || it.poster){
    pop.append(h('h4', {text:'registration'}));
    const b = h('div', {class:'btns'});
    forms.forEach((f, i) => {
      const x = safeUrl(f.url);
      const a = link(f, i === 0 && !f.warn ? 'btn go' : 'btn out');
      b.append(a);
      if (x && (f.warn || !/^(forms\.gle|docs\.google\.com)$/.test(x.hostname))) b.append(h('span', {class:'note', text:'goes to '+x.hostname}));
    });
    if (it.poster) b.append(h('span', {class:'note', text: forms.length ? 'The post also mentions a poster QR code.' : 'No link was posted in the chat. Scan the QR code on the poster.'}));
    pop.append(b);
  }
  if (it.kind === 'event' || it.kind === 'window'){
    if (!hasEnded(it, now)) pop.append(h('div', {}, regBox(it)));
  }
  if (it.text){
    pop.append(h('h4', {text:'original message' + ((it.sources||[]).length ? ' (latest post)' : '')}));
    pop.append(h('pre', {class:'orig', tabindex:'0', text:it.text}));
    if (it.nPosts > 1) pop.append(h('p', {class:'note', text:'This announcement appears '+it.nPosts+' times in the chat. Only the latest is shown above.'}));
  }
  const sl = srcList(it);
  if (sl){ pop.append(h('h4', {text:'sources'})); pop.append(sl); }

  const ov = h('div', {class:'ov', onclick:e => { if (e.target === ov) close(); }}, pop);
  root.append(ov);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onKey);
  pop.querySelector('.x').focus();
}

/* ---------- shell ---------- */
const TABS = [['events','events'],['recruitment','recruitment'],['memberships','memberships'],['settings','settings']];
function renderNav(){
  const nav = document.getElementById('nav'); nav.textContent = '';
  TABS.forEach(([k, label]) => nav.append(h('button', {type:'button', 'aria-current':S.tab===k?'page':null, text:label, onclick:() => { S.tab = k; history.replaceState(null,'','#'+k); render(); window.scrollTo(0,0); }})));
}
function render(){
  renderNav();
  const root = document.getElementById('main'); root.textContent = '';
  if (S.tab === 'events') renderEvents(root);
  else if (S.tab === 'recruitment') renderSimple(root, RECRUIT, 'recruit', 'open and undated drives', 'Exco and committee drives. These are not events, so they live apart from the timeline. Sorted by application deadline; drives with no stated deadline come last and may already be closed.', DATA.closedRecruit);
  else if (S.tab === 'memberships') renderSimple(root, MEMBERS, 'member', 'membership sign-ups', 'Societies that say membership gives myCSD (or do not say). Fees and dates are exactly as posted. Sorted by closing date; no stated closing date comes last.', DATA.closedMembers);
  else renderSettings(root);
  document.getElementById('foot').textContent = 'chat up to ' + stamp(DATA.meta.chatUpTo) + ' · times are Malaysia time (UTC+8)';
}
const hashTab = (location.hash || '').slice(1);
if (TABS.some(t => t[0] === hashTab)) S.tab = hashTab;
render();
setInterval(() => { if (S.tab !== 'settings' && !document.querySelector('.ov')) { const sb = document.getElementById('listbox'); if (S.tab === 'events' && sb) renderList(); else if (S.tab !== 'events') render(); } }, 30000);
window.matchMedia('(min-width: 800px)').addEventListener('change', () => { if (S.tab === 'events') render(); });
</script>
