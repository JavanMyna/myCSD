Sep)","csd":"\"guaranteed monthly MyCSD points\" (stated; monthly project)","who":"Not stated","note":"Roles: Head of Desa, Assistant Head of Desa, Normal AJK. May already be closed. The chat does not say.","forms":[{"label":"Apply","url":"https://forms.gle/XVNM8zwBW5sHWSj86"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-09-06 13:41","sender":"UMisOne","orig":null,"line":1310,"snippet":"GA DESA RECYCLE DAY COMMITTEE RECRUITING"},{"role":"latest","ts":"2026-09-16 14:07","sender":"UMisOne","orig":null,"line":1939,"snippet":"GA DESA RECYCLE DAY COMMITTEE RECRUITING"}],"text":"GA DESA RECYCLE DAY COMMITTEE RECRUITING\nHey everyone! 👋\nWe’re the Green Ambassadors (GA) under CGSS (Centre for Global Sustainability Studies), and we need your help to make Desa Recycle Day a regular habit across our campus!\nWe’re recruiting for a few roles:\n- Head of Desa\n- Assistant Head of Desa\n- Normal AJK\nThe best part? This is a monthly project, so you get guaranteed monthly MyCSD points!\nReady to make a real impact on campus? Join us today! 🌱\nRegister Link: https://forms.gle/XVNM8zwBW5sHWSj86\nGot questions? Feel free to drop us a message:\nAlycia: 011-1066 3268\nJames: 010-283 5800","nPosts":3,"flags":[],"poster":false},{"id":"r-adikarma","title":"Adikarma Kejut: New Members (Talent & Production units)","org":"Sekretariat Kebudayaan Adikarma USM Kejut","deadline":null,"kind":"recruit","dateText":"No deadline stated (posted 20 Sep)","csd":"MYCSD DISEDIAKAN (stated)","who":"Years 1 and 2","note":"Talent unit: Band, Dance, Acting. Production unit: Management, Technical, Multimedia.","forms":[{"label":"Apply","url":"https://forms.gle/2mXUaDW84jJFnj6VA"}],"eligKind":"limited","sources":[{"role":"first","ts":"2026-09-02 21:21","sender":"UMisOne","orig":null,"line":983,"snippet":"SERTAI ADIKARMA KEJUT: DETAK JANTUNG BAKAT KREATIF DI USM! ✨"},{"role":"latest","ts":"2026-09-20 09:26","sender":"UMisOne","orig":null,"line":2463,"snippet":"SERTAI ADIKARMA KEJUT: DETAK JANTUNG BAKAT KREATIF DI USM! ✨"}],"text":"✨ SERTAI ADIKARMA KEJUT: DETAK JANTUNG BAKAT KREATIF DI USM! ✨\nMinat dalam muzik, tarian, lakonan, atau ingin menyumbang di belakang tabir? Sekretariat Kebudayaan Adikarma USM Kejut membuka pengambilan ahli baharu!\nTERBUKA KEPADA PELAJAR TAHUN 1 DAN TAHUN 2\nUnit Bakat\n🎸 Band\n💃 Tarian\n🎭 Lakonan\nUnit Produksi\n🎬 Pengurusan\n💻 Teknikal\n📸 Multimedia\nKembangkan bakat, tambah pengalaman, dan cipta kenangan bersama kami.\nMYCSD DISEDIAKAN!!\n📲 Daftar sekarang:\nhttps://forms.gle/2mXUaDW84jJFnj6VA\n#ADIKARMAUSMKKJ #FEELTHECULTURELIVETHEART 🔥","nPosts":2,"flags":[],"poster":false},{"id":"r-dewatara","title":"Panggung Dewatara: AJK (committee)","org":"Sekretariat Kebudayaan Adikarma USM KKTSS","deadline":null,"kind":"recruit","dateText":"No deadline stated. The show itself: 19 Dec 2026 ~ , 8:30 – 11:00 pm, Dewan Serbaguna (DSG)","csd":"myCSD not stated","who":"Not stated","note":"Eight AJK departments (Registration & 3K, Multimedia & Publicity, Sponsorship & Invitations, Technical & Logistics, Management & Protocol, Costume & MUA, Vendors & Sales, Decoration & Props). The date is written \"19 December 2026 ~\" so it may be approximate.","forms":[{"label":"Sign-up (Google Sheets)","url":"https://docs.google.com/spreadsheets/d/1NLX0-XcN3y3bUFZRsU3l1P8Xg8qZbBlx/edit?usp=drive_link&ouid=113175343365388737395&rtpof=true&sd=true","warn":true}],"flags":[{"t":"note","text":"The sign-up link is a Google Sheets file, not a form."}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-09-19 08:39","sender":"UMisOne","orig":null,"line":2135,"snippet":"PANGGUNG DEWATARA BAKAL BERMULA 🎊🎭"},{"role":"latest","ts":"2026-10-04 14:08","sender":"UMisOne","orig":null,"line":5417,"snippet":"PANGGUNG DEWATARA BAKAL BERMULA 🎊🎭"}],"text":"🎭🎊 *PANGGUNG DEWATARA BAKAL BERMULA* 🎊🎭\nSekreteriat Kebudayaan Adikarma USM KKTSS kini membuka peluang bagi korang menyertai kami sebagai *Ahli Jawatankuasa (AJK) Panggung Dewatara* 🎬‼️\nKami mencari krew bagi jabatan berikut:\n- *AJK Pendaftaran & 3K* ⌨️\n- *AJK Multimedia & Publisiti*🎥\n- *AJK Tajaan dan Undangan* 🎁\n- *AJK Teknikal dan Logistik* ⚒️\n- *AJK Pengurusan dan Protokol* 📋\n- *AJK Busana & MUA*💄\n- *AJK Vendor dan Jualan* 🍔\n- *AJK Hiasan dan Prop* 🎨\nInilah masanya bagi korang asah bakat, timba pengalaman dan hasilkan sebuah karya pementasan yang hebat bersama keluarga Adikarma‼️🌟\n*Daftar sekarang melalui pautan berikut:*\n- 🔗 https://docs.google.com/spreadsheets/d/1NLX0-XcN3y3bUFZRsU3l1P8Xg8qZbBlx/edit?usp=drive_link&ouid=113175343365388737395&rtpof=true&sd=true\n*Maklumat program:*\n- Tarikh: *19 December 2026 ~*⁠\n- Masa: *8:30PM - 11:00PM*\n- Lokasi: *Dewan Serbaguna (DSG)*⁠\nJangan lepaskan peluang ini 🆙 Ayuh sama-sama kita gegarkan Panggung Dewatara‼️🚀✨\n*#Adikarma*\n*#PanggungDewatara*","nPosts":2,"poster":false},{"id":"r-kprs","title":"KPRS USM: Peers 26/27","org":"Kelab Pembimbing Rakan Siswa (KPRS USM)","deadline":null,"kind":"recruit","dateText":"No deadline stated (posted 12 Oct)","csd":"myCSD not stated","who":"Not stated","note":"Only a Linktree page was posted, no form link.","forms":[{"label":"KPRS Linktree","url":"https://linktr.ee/kprsusm","warn":true}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-12 17:25","sender":"UMisOne","orig":null,"line":8222,"snippet":"PENCARIAN PEERS KELAB PEMBIMBING RAKAN SISWA (KPRS USM) SIDANG AKADEMIK 26/27] 🔉"},{"role":"latest","ts":"2026-10-16 11:26","sender":"UMisOne","orig":null,"line":9404,"snippet":"PENCARIAN PEERS KELAB PEMBIMBING RAKAN SISWA (KPRS USM) SIDANG AKADEMIK 26/27] 🔉"}],"text":"🔉 [ PENCARIAN PEERS KELAB PEMBIMBING RAKAN SISWA (KPRS USM) SIDANG AKADEMIK 26/27] 🔉\nAssalamualaikum, Salam Sejahtera dan Salam Sayang Siswa💜🩷\nKelab Pembimbing Rakan Siswa (KPRS USM) mengalu-alukan anda semua yang berminat untuk menjadi sebahagian daripada keluarga KPRS sebagai PEERS bagi Sidang Akademik 2026/2027.\n💜🩷 Apa yang anda boleh dapat sebagai PEERS\n📍Membina kemahiran komunikasi dan interpersonal\n📍Menambah pengalaman dalam aktiviti kemahasiswaan\n📍Berpeluang menyertai program dan aktiviti KPRS\n📍Membina hubungan dan komuniti bersama rakan-rakan\n💥 Ayuh sertai kami dan bersama-sama menjadi sebahagian daripada keluarga KPRS USM🤗\n📌 Daftar sekarang dan jumpa kami dalam keluarga KPRS!\nSebarang pertanyaan sila hubungi:\n☎️ 012-578 8498 (Syazwina)\n☎️ 011-21828896 (Caprill)\n”Guide with care🫶🏻”\n📌Ikuti kami di: https://linktr.ee/kprsusm\n#kprsusm #peerskprs #janganlupafollow #leadwithjoy #peers26/27","nPosts":2,"flags":[],"poster":false},{"kind":"recruit","forms":[{"label":"KPRS Linktree","url":"https://linktr.ee/kprsusm","warn":true}],"flags":[{"t":"missing","text":"The post gives 22 – 23 Oct 2026 at Kafe Indah Kembara L05 but does not say whether these are sign-up or interview dates."}],"poster":false,"nPosts":1,"id":"r-kprs-exco","title":"KPRS USM: Exco 26/27","org":"Kelab Pembimbing Rakan Siswa (KPRS USM)","deadline":null,"dateText":"22 – 23 Oct 2026, 8:30 – 10:00 pm, Kafe Indah Kembara L05 (posted 20 Oct)","csd":"myCSD not stated","who":"Not stated","note":"A separate drive from the KPRS Peers one. Seven departments: Spiritual & Insaniah, Academic, External Relations, Recreation & Volunteering, Entrepreneurship, Media, Publicity. Only a Linktree page was posted, no form link. May already be closed. The chat does not say.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-20 07:53","sender":"UMisOne","orig":"16.10.2026 12:26","msg":43907,"snippet":"🔉 [ PENCARIAN EXCO KELAB PEMBIMBING RAKAN SISWA (KPRS USM) SIDANG AKADEMIK 26/27] 🔉"}],"text":"🔉 [ PENCARIAN EXCO KELAB PEMBIMBING RAKAN SISWA (KPRS USM) SIDANG AKADEMIK 26/27] 🔉\n\nAssalamualaikum, Salam Sejahtera dan Salam Sayang Siswa💜🩷\n\nKelab Pembimbing Rakan Siswa (KPRS USM) mengalu-alukan anda semua yang berminat untuk menjadi sebahagian daripada keluarga KPRS dalam usaha bersama membimbing mahasiswa/i ke arah kejayaan.\n\nOleh itu, pihak kami membuka pencarian EXCO KPRS USM bagi Sidang Akademik 2026/2027\n\n📆 Tarikh: 22 - 23 Oktober 2026\n🎪 Lokasi: Kafe Indah Kembara L05.\n⏰ Masa: 8.30 malam - 10.00 malam\n\n🔥 Jabatan Yang Ditawarkan:\n\n📍Jabatan Kerohanian & Insaniah\n📍Jabatan Akademik\n📍Jabatan Hubungan Luar\n📍Jabatan Rekreasi & Kesukarelawanan\n📍Jabatan Keusahawanan\n📍Jabatan Media\n📍Jabatan Publisiti\n\nSebarang pertanyaan sila hubungi:\n☎️ 012-578 8498 (Syazwina)\n☎️ 011-21828896 (Caprill)\n\n”Guide with care🫶🏻”\n\n📌Ikuti kami di: https://linktr.ee/kprsusm\n\n#kprsusm\n#janganlupafollow\n#leadwithjoy\n#excoKPRS26/27"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/hLaAif2KcGHiAM5b9"}],"flags":[],"poster":false,"nPosts":2,"id":"r-emc","title":"EmpowerMom Creation (EMC): Recruitment","org":"EmpowerMom Creation (EMC)","deadline":null,"dateText":"No deadline stated (posted 18 Oct)","csd":"\"Strengthen your resume & MYCSD profile\" (stated)","who":"USM undergraduate students","note":"Student-led social enterprise empowering B40 single mothers. Open positions: Secretary, Human Resource, Design, Publicity, Public Relation, Sales & Marketing, Logistic, Finance. The poster also has a QR code. May already be closed. The chat does not say.","eligKind":"all","sources":[{"role":"first","ts":"2026-10-20 07:53","sender":"UMisOne","orig":"18.10.2026 11:27","msg":43910,"snippet":"✨ 𝐄𝐌𝐏𝐎𝐖𝐄𝐑𝐌𝐎𝐌 𝐂𝐑𝐄𝐀𝐓𝐈𝐎𝐍 𝐈𝐒 𝐇𝐈𝐑𝐈𝐍𝐆! ✨"},{"role":"latest","ts":"2026-10-20 07:54","sender":"UMisOne","orig":"18.10.2026 22:08","msg":43915,"snippet":"✨ 𝐄𝐌𝐏𝐎𝐖𝐄𝐑𝐌𝐎𝐌 𝐂𝐑𝐄𝐀𝐓𝐈𝐎𝐍 𝐈𝐒 𝐇𝐈𝐑𝐈𝐍𝐆! ✨"}],"text":"✨ 𝐄𝐌𝐏𝐎𝐖𝐄𝐑𝐌𝐎𝐌 𝐂𝐑𝐄𝐀𝐓𝐈𝐎𝐍 𝐈𝐒 𝐇𝐈𝐑𝐈𝐍𝐆! ✨\n\nReady to gain real-world experience while creating meaningful social impact? 💖 EmpowerMom Creation (EMC) is opening recruitment for passionate 𝗨𝗦𝗠 𝘂𝗻𝗱𝗲𝗿𝗴𝗿𝗮𝗱𝘂𝗮𝘁𝗲 𝘀𝘁𝘂𝗱𝗲𝗻𝘁𝘀 to join our growing student-led social enterprise empowering B40 single mothers.\n\n📌 𝗢𝗽𝗲𝗻 𝗣𝗼𝘀𝗶𝘁𝗶𝗼𝗻𝘀:\nSecretary | Human Resource | Design | Publicity | Public Relation | Sales & Marketing | Logistic | Finance\n\n✨ 𝗪𝗵𝘆 𝗷𝗼𝗶𝗻 𝗘𝗠𝗖?\n ✔️ Hands-on job experience\n ✔️ Strengthen your resume & MYCSD profile\n ✔️ Build leadership & entrepreneurship skills\n ✔️ Be part of a purpose-driven team making real change\n\n📲 Scan the QR code or click on the link: https://forms.gle/hLaAif2KcGHiAM5b9 to 𝗮𝗽𝗽𝗹𝘆 𝗻𝗼𝘄!\n\nIf you’re proactive, a team player, and ready to grow with us — 𝘁𝗵𝗶𝘀 𝗶𝘀 𝘆𝗼𝘂𝗿 𝘀𝗶𝗴𝗻 🚀\n\n#EmpowerMomCreation\n#SDG\n#SocialEnterprise"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/i7yHfTeXSEhaHZwP7"}],"flags":[],"poster":false,"nPosts":1,"id":"r-umc27","title":"UMC27 (USM Mathematics Competition 2027): Committee","org":"UMC27","deadline":null,"dateText":"No deadline stated; interviews 22 & 23 Oct 2026, 8:30 – 10:30 pm (Webex)","csd":"myCSD not stated","who":"Not stated","note":"Departments: Registration, Protocol, Sponsorship, Special Duties & Prize, Technical, Media & Publicity, Question & Tester. The poster also has a QR code.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-20 07:54","sender":"UMisOne","orig":"15.10.2026 06:53","msg":43917,"snippet":"📣 *WE ARE RECRUITING! UMC27 NEEDS YOU!* 🧮💚"}],"text":"📣 *WE ARE RECRUITING! UMC27 NEEDS YOU!* 🧮💚\n\nHi everyone! *USM Mathematics Competition 2027* is looking for new committee members! 🎉\n\nInterested in gaining experience, making new connections and being part of an exciting event? Join our team! ✨\n\n📌 Departments: Registration, Protocol, Sponsorship, Special Duties & Prize, Technical, Media & Publicity, Question & Tester\n\n🗓️ *Interview: 22 & 23 October 2026*\n⏰ *8:30 PM – 10:30 PM*\n💻 *Online via Webex*\n\nScan the QR code on the poster or click here to register: https://forms.gle/i7yHfTeXSEhaHZwP7 ! \nDon’t miss this opportunity to be part of UMC27. 🫶🏻\n\nYour journey with UMC27 starts here! 💚"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/dSHYYX3ytfmqTTZ67"}],"flags":[],"poster":false,"nPosts":2,"id":"r-siswa","title":"SISWA USM: Exco & Pembantu Exco 2026/27","org":"SISWA USM","deadline":"2026-10-27","dateText":"Applications until 27 Oct 2026; interviews 30 & 31 Oct 2026","csd":"\"mata MYCSD\" through involvement (stated)","who":"Years 1 – 3, \"PKU & Pelajar Normal\"","note":"Five departments: Academic & Career, Alumni & External Relations, Culture & Sports, Welfare/Safety/Health, TDF & Protocol. The post says SISWA works for the welfare of students with disabilities (OKU). Interview time and place not stated. The poster also has a QR code.","eligKind":"all","sources":[{"role":"first","ts":"2026-10-20 07:55","sender":"UMisOne","orig":"19.10.2026 12:22","msg":43925,"snippet":"💜 PENGAMBILAN EXCO & PEMBANTU EXCO SISWA USM 2026/2027 💜"},{"role":"latest","ts":"2026-10-25 09:06","sender":"UMisOne","orig":"19.10.2026 12:22","msg":44006,"snippet":"💜 PENGAMBILAN EXCO & PEMBANTU EXCO SISWA USM 2026/2027 💜"}],"text":"💜 PENGAMBILAN EXCO & PEMBANTU EXCO SISWA USM 2026/2027 💜\n\nKami membuka peluang kepada mahasiswa/i USM yang bersemangat, komited dan ingin menimba pengalaman baharu untuk menyertai barisan Exco SISWA bagi Sidang Akademik 2026/2027. ♿💜\n\nMengapa sertai SISWA?\n💙 Berpeluang memperoleh mata MYCSD melalui penglibatan dalam aktiviti dan program SISWA\n✨ Mengembangkan kemahiran kepimpinan dan kerja berpasukan\n💜 Menyumbang kepada kesejahteraan mahasiswa OKU\n\n📎Pautan Permohonan : https://forms.gle/dSHYYX3ytfmqTTZ67\n\nPengambilan terbuka kepada jabatan-jabatan berikut:\n📚 *Akademik & Kerjaya*\n🤝 *Alumni & Perhubungan Luar*\n🎨 *Kebudayaan & Sukan*\n🛡️ *Kebajikan, Keselamatan & Kesihatan*\n🎯 *TDF & Protokol*\n\n🗓️ Tarikh Akhir Permohonan:  27 Oktober 2026\n🗣️ Tarikh Temuduga: 30 Oktober 2026 dan 31 Oktober  2026\n🎓 Kelayakan: Terbuka kepada Pelajar Tahun 1-3 (PKU & Pelajar Normal)\n\n> 💬 Sebarang pertanyaan lanjut boleh hubungi:\n> • Thisha: 010-3902376\n> • Danial: 012-2939138\n\nJangan tunggu lagi! Imbas kod QR pada poster atau daftar sekarang sebelum 27 Oktober 2026! 💪✨\n\n#SISWAUSM #RecruitmentExco #USM #Inklusiviti #MahasiswaPrihatin #OKU"},{"kind":"recruit","forms":[],"flags":[],"poster":true,"nPosts":2,"id":"r-eneur","title":"Kelab Keusahawanan USM (Eneur Club): Exco Fasa 2","org":"Kelab Keusahawanan USM (Eneur Club)","deadline":"2026-10-22","dateText":"Applications 15 – 22 Oct 2026; interviews 24 & 25 Oct 2026","csd":"\"Kumpul mata MYCSD\" (stated)","who":"Not stated","note":"Five departments: Activities/Operations/Technical, Finance & Welfare, Multimedia & Documentation, Marketing & R&D, External Relations. Applying is by QR code on the poster only (no link posted). Interview platform and place not stated.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-20 07:57","sender":"UMisOne","orig":"19.10.2026 21:23","msg":43935,"snippet":"🚨 *PENGUMUMAN*🚨"},{"role":"latest","ts":"2026-10-23 11:07","sender":"UMisOne","orig":"22.10.2026 22:25","msg":43992,"snippet":"🚨 *PENGUMUMAN*🚨"}],"text":"🚨 *PENGUMUMAN*🚨\n\n🔥 *PENCARIAN REKRUT KELAB KEUSAHAWANAN USM (Eneur Club) FASA 2 KINI DIBUKA!* 🔥\n\nNak tambah pengalaman, bina keyakinan diri dan kembangkan kemahiran sambil sertai program-program menarik? Inilah masanya! 💜🤍\n\n✨ APA ISTIMEWANYA? 🎉\n• Boost kemahiran kepimpinan 🚀\n• Bina leadership & teamwork 🤝\n• Tingkatkan kemahiran komunikasi 🗣️\n• Kumpul mata MYCSD 🎓\n\n💼 JABATAN YANG DITAWARKAN:\n🔹 Aktiviti, Operasi & Teknikal\n🔹 Kewangan & Kebajikan\n🔹 Multimedia & Dokumentasi\n🔹 Pemasaran & R&D\n🔹 Perhubungan Luar\n\n📅 Tarikh Permohonan: 15 Oktober – 22 Oktober 2026\n💻 Temuduga: 24 & 25 Oktober 2026\n\n📢 Jangan lepaskan peluang untuk menjadi Exco Eneur!\n\n👉 IMBAS KOD QR PADA POSTER & DAFTAR SEKARANG!\n\n📲 Sebarang pertanyaan, boleh hubungi:\nAimran: 011-21520173\nYasmine: 011-53529311\nSyazana: 017-4337129\n\n#USM #EneurUSM #KelabKeusahawananUSM #KamiMemimpin #WeLead #MYCSD"},{"kind":"recruit","forms":[{"label":"Sign up","url":"https://docs.google.com/forms/d/e/1FAIpQLScLIH1T8xoUXyCPALq2xdi4PDhELQ-Vlt0xzI-pKJ_SywPCKg/viewform?usp=dialog"}],"flags":[],"poster":false,"nPosts":1,"id":"r-saintis","title":"Saintis Cilik: Volunteers","org":"PEACE USM (from hashtag)","deadline":null,"dateText":"No deadline stated; the event is on 1 Nov 2026 (Sunday)","csd":"\"MyCSD disediakan\" (stated)","who":"Aimed at students taking Chemistry, Physics, Mathematics, Science, Technology or Engineering (not stated as a requirement)","note":"Volunteers for science activities at 4 mosques around the main (Induk) and Engineering campuses. A WhatsApp contact link (plain http) was also posted and is not shown here. May already be closed. The chat does not say.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-20 07:57","sender":"UMisOne","orig":"19.10.2026 22:17","msg":43936,"snippet":"💥 PENCARIAN SUKARELAWAN💥"}],"text":"💥 PENCARIAN SUKARELAWAN💥\n\n🔬🕌 SAINTIS CILIK IS COMING! 🕌🔬\n\nAmbil kos Kimia, Fizik, Matematik, Sains, Teknologi, Kejuruteraan? \n\nPernah terfikir bagaimana sains boleh mendekatkan kita dengan komuniti? 🤔✨\n\nJom bersama-sama mencipta pengalaman pembelajaran yang menarik, berkongsi ilmu dan menyemai minat terhadap sains dalam suasana yang bermakna! 💙🧪\n\n📍 Lokasi: 4 buah masjid sekita USM Induk & Kejuruteraan \n🗓 Tarikh: 1 November 2026 (Ahad)\n\n🎯 Apa yang menanti anda?\n🔬 Aktiviti sains yang menarik\n🧪 Eksperimen yang menyeronokkan\n🤝 Pengalaman bersama komuniti\n💡 MyCSD disediakan  \n\n📱 Hubungi: http://www.wasap.my/60177831002/VOLUNTEERSC\n\n📌 Daftar sekarang:  \nhttps://docs.google.com/forms/d/e/1FAIpQLScLIH1T8xoUXyCPALq2xdi4PDhELQ-Vlt0xzI-pKJ_SywPCKg/viewform?usp=dialog\n\n#SaintisCilik\n #PEACEUSM #SukarelawanUSM"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/1KCS4WpcWmjQXfN88"}],"flags":[{"t":"inferred","text":"The myCSD line comes from a separate one-line message sent right after the post, not from the poster text itself. It is read as applying to this drive."}],"poster":false,"nPosts":1,"id":"r-usmastro","title":"USMastro Club: Jr. Exco Recruitment","org":"USMastro Club (USM Astronomy Club, from hashtags)","deadline":"2026-10-25","dateText":"Registration 20 – 25 Oct 2026; interviews 26 – 27 Oct 2026 (all applicants must attend)","csd":"\"MyCSD akan diberikan kepada sesiapa yang dipilih menjadi junior exco\" (follow-up message)","who":"Not stated","note":"Roles: Jr. Secretary, Jr. Treasurer, Jr. Multimedia, Jr. Public Relations, Jr. Entrepreneurship, Technology & Software Development Exco, Astronomy & Observation Exco. Interview place and platform not stated. The poster also has a QR code.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-23 11:06","sender":"UMisOne","orig":"22.10.2026 19:53","msg":43986,"snippet":"✨*USMASTRO CLUB JR. EXCO RECRUITMENT*✨"},{"role":"related","ts":"2026-10-23 11:06","sender":"UMisOne","orig":null,"msg":43987,"snippet":"MyCSD akan diberikan kepada sesiapa yang dipilih menjadi junior exco"}],"text":"✨*USMASTRO CLUB JR. EXCO RECRUITMENT*✨\n\nEver looked up at the stars and wanted to do more than just stargaze? Now is your chance to step up, lead and gain new experience!🔭👩‍🚀\n\nCome be a part of our team! We're looking for passionate individuals to fill these roles:\n📝 Jr. Secretary\n💵 Jr. Treasurer\n📸 Jr. Multimedia\n📞 Jr. Public Relations\n💰 Jr. Entrepreneurship\n💻 Technology & Software Development Exco\n🔭 Astronomy & Observation Exco\n\nScan the Qr Code on the poster or click the link below to apply :\nhttps://forms.gle/1KCS4WpcWmjQXfN88\n\n📌 The registration will be opened from 20th - 25th Oct 2026\n\n📌 An interview session will be held from 26th - 27th Oct 2026 and all applicants are required to be present🚀\n\nFor any inquiries, please contact:\nAvinash: 011-31781353\nUma: 011-64941910\n\n#USMAstro2627\n#USMAstronomyClub\n#KAUSM\n#AstroVerse"},{"kind":"recruit","forms":[{"label":"Apply (link ends in /formResponse)","url":"https://docs.google.com/forms/d/e/1FAIpQLSci_QNzAn7sSaWhmxcTstgxzcn_0i2BScwnEISsysiI7gQe0g/formResponse","warn":true}],"flags":[],"poster":false,"nPosts":1,"id":"r-pbmusm2","title":"PBMUSM: Exco Fasa 2 (Persatuan Bahasa Melayu)","org":"Persatuan Bahasa Melayu USM (PBMUSM)","deadline":"2026-10-30","dateText":"Applications 23 – 30 Oct 2026","csd":"myCSD not stated","who":"Years 1, 2 and 3","note":"The form link ends in /formResponse, so it may not open the form.","eligKind":"all","sources":[{"role":"first","ts":"2026-10-27 07:40","sender":"UMisOne","orig":null,"msg":44030,"snippet":"📢*[PENCARIAN EXCO FASA 2 PERSATUAN BAHASA MELAYU UNIVERSITI SAINS MALAYSIA SIDANG AKADEMIK 2026/2027"}],"text":"📢*[PENCARIAN EXCO FASA 2 PERSATUAN BAHASA MELAYU UNIVERSITI SAINS MALAYSIA SIDANG AKADEMIK 2026/2027]*\n\nAssalamualaikum dan Selamat Sejahtera.\n\nPersatuan Bahasa Melayu Universiti Sains Malaysia (PBMUSM) Sidang Akademik 2026/2027 kini dibuka lagi untuk mencari exco bagi menjadi tunjang penggerak kepimpinan organisasi kali ini.\n\nTarikh Buka Permohonan:\n23 Oktober 2026 sehingga 30 Oktober 2026\nhttps://docs.google.com/forms/d/e/1FAIpQLSci_QNzAn7sSaWhmxcTstgxzcn_0i2BScwnEISsysiI7gQe0g/formResponse\n\nTERBUKA KEPADA MAHASISWA USM TAHUN 1, 2 DAN 3!\n\nSebarang pertanyaan lanjut, sila hubungi:\n+6011-11088016 (HUSNA)\n+6011-61003958  (SHAFIYAH)\n+6011-11182742 (HAZIL)\n\nMARI SERTAI KAMI !\n\n#BersamaMenjulangBahasa\n#PBMUSM #LinguistikBahasaMelayuUSM"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/uGR7Z87kAqb2ts9s9"}],"flags":[],"poster":false,"nPosts":1,"id":"r-amar","title":"AMAR USM: Exco 2026/27","org":"AMAR USM","deadline":"2026-10-31","dateText":"Applications 15 – 31 Oct 2026; interviews 1 & 2 Nov 2026 (online)","csd":"myCSD not stated in this post","who":"All USM students","note":"Departments: Protocol, Sports & Recreation, Welfare & Spiritual, Sponsorship, Media & Publicity, Technical & Physical.","eligKind":"all","sources":[{"role":"first","ts":"2026-10-27 07:40","sender":"UMisOne","orig":null,"msg":44031,"snippet":"🔥 PENCARIAN EXCO AMAR USM SIDANG AKADEMIK 2026/2027 BERMULA! 🔥 ❤️💙"}],"text":"🔥 PENCARIAN EXCO AMAR USM SIDANG AKADEMIK 2026/2027 BERMULA! 🔥 ❤️💙\n\nAssalamualaikum dan Salam Sejahtera✨ \n\nAdakah anda seorang pelajar USM yang bersemangat, komited dan berminat untuk menyumbang kepada usaha membentuk mahasiswa yang berintegriti serta bebas rasuah? Inilah peluang anda untuk menjadi sebahagian daripada keluarga AMAR USM! 💪🏻\n\n📌 JAWATAN EXCO YANG DITAWARKAN:\n▶️Jabatan Protokol\n▶️Jabatan Sukan & Rekreasi\n▶️Jabatan Kebajikan & Kerohanian\n▶️Jabatan Penajaan\n▶️Jabatan Media & Publisiti\n▶️Jabatan Teknikal dan Fizikal\n\n📅 TARIKH PERMOHONAN:\n15 Oktober – 31 Oktober 2026\n\n💻 TARIKH TEMU DUGA:\n1 & 2 November 2026\n(Secara dalam talian)\n\n🎯 TERBUKA KEPADA SEMUA PELAJAR USM!\n\n🌟Pelbagai aktiviti yang menarik akan dianjurkan di luar kawasan usm. Marilah kita beramai- ramai sertai AMAR 🔥🔥\n\n🔗https://forms.gle/uGR7Z87kAqb2ts9s9\n\n📞 Sebarang pertanyaan, sila hubungi:\nAnis: 017-516 7933\nSuraya: 014-806 6822\n\nMembina Mahasiswa Berintegriti, Membanteras Rasuah! 🔥\n\nAmanah • Tegas • Adil\n\n#amanahtegasadil\n#AMARUSM\n#WELEAD"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/fp5pRZxyttdipkKp9"}],"flags":[],"poster":false,"nPosts":1,"id":"r-els","title":"English Language Society (ELS): Exco 2026/27","org":"English Language Society (ELS)","deadline":"2026-11-01","dateText":"Recruitment 26 Oct – 1 Nov 2026; interview online","csd":"\"MyCSD points through various programmes\" (stated)","who":"Not stated","note":"Positions: Welfare, Media & Publicity, Alumni.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-27 07:45","sender":"UMisOne","orig":null,"msg":44061,"snippet":"📢 ELS EXCO RECRUITMENT 2026/2027 IS HERE! 🎤✨"}],"text":"📢 ELS EXCO RECRUITMENT 2026/2027 IS HERE! 🎤✨\n\nReady to take the next step, meet new people, and make a difference? The English Language Society (ELS) is recruiting new EXCO members for Welfare, Media & Publicity, and Alumni!\n\n📅 *Recruitment period:* 26th October 2026 to 1st November 2026\n💻 *Interview:* Online\n📌 *Positions:*\n- Welfare \n- Media & Publicity\n-  Alumni\n\n🌟 WHAT YOU'LL GET:\n✨ External collaborations and networking opportunities\n✨ MyCSD points through various programmes\n✨ Exciting volunteer opportunities\n✨ Improve your English communication skills\n✨ Develop leadership and event management skills\n\nThis is your chance to grow, gain experience, and be part of something meaningful! Don't miss out on this opportunity to make your university experience more exciting. 🫵🏻\n\n🔗 Please fill up this form if interested:\nhttps://forms.gle/fp5pRZxyttdipkKp9\n\n📩 Interested? Contact us: Jaafar: +60128209936 | Khaaviyah: +60164611441 | Puja: +60128891490\n\n#ELSRecruitment #ExcoRecruitment #EnglishLanguageSociety"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/c5KkVQwpSKGw2XFx7"}],"flags":[],"poster":false,"nPosts":1,"id":"r-infinitum","title":"INFINITUM 2027: AJK (committee)","org":"INFINITUM (USM Mathematics Society, from hashtags)","deadline":null,"dateText":"No deadline stated; interviews 2 – 4 Nov 2026, 8:00 – 10:00 pm (Microsoft Teams)","csd":"\"NATIONAL MYCSD PROVIDED\" (stated)","who":"USM students","note":"For a national-level math competition. Departments: Problem Design & Judging; Event Management & Protocol; Publicity & Multimedia; Food & Beverages and Gifts & Souvenirs; Sponsorship; Technical & Logistics; Participant Management.","eligKind":"all","sources":[{"role":"first","ts":"2026-10-29 06:59","sender":"UMisOne","orig":null,"msg":44101,"snippet":"🤍💙 [ 👀 AJK RECRUITMENT NOTICE ‼️] 💙🤍"}],"text":"🤍💙 [ 👀 AJK RECRUITMENT NOTICE ‼️] 💙🤍\n\nNATIONAL MYCSD PROVIDED\n\n🔎Searching for USM students who loves challenges, teamwork and looking for new experiences !  INFINITUM is back and is now recruiting secretariats! 🌟 \n\nBe part of our crew, learn new skills, make new friends and help us build a national-level math competition from scratch. No experience? No problem. Just bring your energy! 💥💡Fill the form below to have a chance to be part of the crew ! 🤍💙\n\nDepartments offered :\n💙 Problem Design & Judging\n🤍 Event Management & Protocol\n💙 Publicity & Multimedia\n🤍 Food and Beverages & Gifts and Souvenirs\n💙 Sponsorship\n🤍 Technical & Logistics\n💙 Participant Management\n\nhttps://forms.gle/c5KkVQwpSKGw2XFx7\n\n📆 Interview Date : 2 - 4 November 2026\n⏰ Time : 8.00 PM - 10.00 PM\n🖥️ Platform : Microsoft Teams\n\n📞For any inquiries, please contact: \nSky — 016-246 0901\nShifak — 019-915 8851\n\nbeyond limits, into infinity ✨\n\n#MATH@USM\n#USMMATHSOC\n#INFINITUM2027"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://forms.gle/ktQwXFysiDjTwBD17"}],"flags":[],"poster":false,"nPosts":1,"id":"r-wie","title":"Women in Engineering (WIE): Committee","org":"Women in Engineering (WIE)","deadline":"2026-11-04","dateText":"Applications close 4 Nov 2026","csd":"myCSD not stated","who":"Not stated","note":"Positions: Vice Treasurer; HOD and EXCO of Industrial Engagement; HOD and EXCO of Volunteering & Empowerment; EXCO of Maker Girls, Publicity and Multimedia.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-29 09:09","sender":"UMisOne","orig":null,"msg":44107,"snippet":"✨ WIE IS RECRUITING! 💜"}],"text":"✨ WIE IS RECRUITING! 💜\nReady to make a difference, empower women in engineering, and be part of something meaningful? 🚀 The Women in Engineering (WIE) committee is looking for passionate and dedicated individuals to join our team!\n\n🌟 Available Positions:\nVice Treasurer\nHOD of Industrial Engagement\nHOD of Volunteering & Empowerment\nEXCO of Maker Girls\nEXCO of Volunteering & Empowerment\nEXCO of Industrial Engagement\nEXCO of Publicity\nEXCO of Multimedia\n\n💡 Whether you’re passionate about leadership, creativity, community service, industry engagement, or content creation, there’s a place for you in WIE!\n\n📌 Application Details\n🔗 Application Form: https://forms.gle/ktQwXFysiDjTwBD17\n📅 Deadline: 4 November 2026\nDon’t miss this opportunity to develop your skills, gain valuable experience, and connect with like-minded individuals! Let’s inspire, empower, and shape the future of women in engineering together. 💪💖\n\nFor more details:\n📱010-215 7887 (Dhameswary)\n\n💜 Join WIE. Empower Women. Engineer the Future. ✨\n\n#WIE #WomenInEngineering #Recruitment #JoinOurCommittee"},{"kind":"recruit","forms":[],"flags":[],"poster":true,"nPosts":1,"id":"r-ansos2","title":"ANSOS Club USM: Exco, Second Round","org":"ANSOS Club USM (Anthropology & Sociology)","deadline":null,"dateText":"No deadline stated (posted 27 Oct)","csd":"myCSD not stated in this post","who":"First-year students are very welcome","note":"EXCO positions: Multimedia & Publicity, Technical & Physical, Student Development & Protocol. Apply by QR code on the poster only (no link posted).","eligKind":"all","sources":[{"role":"first","ts":"2026-10-27 07:42","sender":"UMisOne","orig":null,"msg":44039,"snippet":"✨*ANSOS PEEPS, Our Second Round of Recruitment is Here!*✨ We're open for more committees ‼️"}],"text":"✨*ANSOS PEEPS, Our Second Round of Recruitment is Here!*✨ We're open for more committees ‼️\n\nAre you interested in *culture society and humans?* Then, let's step up and make your university experience more meaningful with us! \n\n*ANSOS Club USM*🎉 is now looking for new committee members for the 2026/2027 Academic Session!\n\nHere are the positions available:\n\n✨ *EXCO POSITIONS*✨\n• Multimedia & Publicity\n• Technical & Physical\n• Student Development & Protocol \n\nFirst year students are very welcome! No experience? Don't worry, we're looking for curious, open and like-minded people who love discovering new things. Let's be part of ANSOS Society 2026/2027 ✨\n\n*SCAN THE QR CODE TO JOIN!*\n\nFor more information:\n📞 Afrina: 011-69432094\n📞 Nabila: 019-6033404\n\n#ansosclubusm #ansos #anthropology #sociology"},{"kind":"recruit","forms":[{"label":"Apply","url":"https://docs.google.com/forms/d/e/1FAIpQLSfeE2YzCURlHVlcThDmUzMHJC0r2gqavBR8QPOLTkDrQUseEg/viewform"}],"flags":[{"t":"missing","text":"The post does not say whether 3 – 4 Nov are sign-up or interview dates."}],"poster":false,"nPosts":1,"id":"r-sastrasa","title":"KESASTERA: AJK Pesta Sastrasa 2027","org":"Kelab Sastera USM (KESASTERA)","deadline":null,"dateText":"3 – 4 Nov 2026, 8:00 pm, Kafeteria Indah Kembara (walk-ins also open). The festival itself is 4 – 6 May 2027","csd":"myCSD not stated","who":"Not stated","note":"AJK departments: Protocol; Media & Publicity; Technical & Physical; Logistics; Koridor Niaga; Sponsorship; Registration & Performance Management; Food; Special Duties; 3K.","eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-02 12:10","sender":"UMisOne","orig":null,"msg":44128,"snippet":"ASSALAMUALAIKUM, SALAM SEJAHTERA DAN SALAM KESASTERA LASKAR AKSARA! 💙🩵🤍"}],"text":"ASSALAMUALAIKUM, SALAM SEJAHTERA DAN SALAM KESASTERA LASKAR AKSARA! 💙🩵🤍\n\n📣 PENGAMBILAN AJK PESTA SASTRASA 2027! 📣\n\nBuat julung kalinya, Kelab Sastera Universiti Sains Malaysia (KESASTERA) bakal menganjurkan PESTA SASTRASA 2027 pada 4 hingga 6 Mei 2027! 🎭📜✨\n\n🔊 PENGENALAN PROGRAM\n\nPESTA SASTRASA merupakan sebuah platform yang menggabungkan seni, sastera, kebudayaan dan gastronomi melalui persembahan puisi, aktiviti kebudayaan, pesta makanan serta jualan thrift. Program ini bertujuan memartabatkan seni dan warisan budaya Melayu, di samping menyediakan ruang untuk masyarakat menikmati kepelbagaian seni, kreativiti dan gaya hidup lestari.\n\n✨ SENARAI AJK YANG DITAWARKAN\n📍 Protokol\n📍 Media & Publisiti\n📍 Teknikal & Fizikal\n📍 Logistik\n📍 Koridor Niaga\n📍 Penajaan\n📍 Pendaftaran & Pengurusan Persembahan\n📍 Makanan\n📍 Tugas-tugas Khas\n📍 3K\n\n💌 JOM SERTAI KAMI!\n\nAnda aktif, suka bekerja dalam kumpulan dan ingin menimba pengalaman baharu? Inilah peluang untuk anda menjadi sebahagian daripada pasukan yang bakal menjayakan PESTA SASTRASA 2027! ❤️‍🔥\n\n📅 Tarikh: 3–4 November 2026\n⏰ Masa: 8.00 malam\n📍 Tempat: Kafeteria Indah Kembara\n\n📝 Pautan Pendaftaran:\nhttps://docs.google.com/forms/d/e/1FAIpQLSfeE2YzCURlHVlcThDmUzMHJC0r2gqavBR8QPOLTkDrQUseEg/viewform\n\n🚶🏻‍♀️ WALK-IN TURUT DIBUKA!\n\nSebarang pertanyaan, sila hubungi:\n\n📞 010-918 5385 – Fawwaz\n📞 011-2184 5713 – Amsyar\n\nAyuh bersama-sama menghidupkan seni, menyemarakkan sastera dan mencipta pengalaman yang bermakna melalui PESTA SASTRASA 2027! 💙🩵🤍\n\n#KESASTERAUSM\n#KELABSASTERA\n#PESTASASTRASA202"},{"id":"r-ashrae","title":"ASHRAE USM Student Branch: Committee","org":"ASHRAE USM Student Branch","deadline":"2026-11-15","kind":"recruit","dateText":"Deadline extended to 15 Nov 2026","csd":"\"Setiap kali buat event akan ada committee csd\" (follow-up message; each event gives committee CSD)","who":"Engineering campus (Tuanku Syed Sirajuddin) students only","note":"Original deadline is not in this export; the post says it was extended.","forms":[{"label":"Apply","url":"https://forms.gle/YjoNSpMzbKaYcmBV6"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-10 15:26","sender":"UMisOne","orig":null,"msg":44337,"snippet":"📢 GOOD NEWS! THE DEADLINE HAS BEEN EXTENDED! 💙"}],"text":"📢 GOOD NEWS! THE DEADLINE HAS BEEN EXTENDED! 💙\n\nStill thinking about joining the ASHRAE USM Student Branch Committee? Here's your chance! 👀\n\nWe've extended the application deadline to 15 November 2026! Don't miss this extra time to take the next step and be part of something meaningful. ✨\n\nBe part of a team where you can:\n💡 Develop new skills and discover your strengths\n🤝 Connect with like-minded peers and industry professionals\n⚙️ Gain hands-on experience beyond the classroom\n🌍 Make an impact through engineering and sustainability\n\n📅 New Registration Deadline: 15 November 2026\n📍 Open To: All USM Tuanku Syed Sirajuddin Engineering Campus students\n💻 Apply Here: https://forms.gle/YjoNSpMzbKaYcmBV6 \n\n📞 For any enquiries, please contact:\nKhoo Hsien Jie (011-1669 6088)\nTieu Qihan (019-790 8278)\n\n!!️Follow us for latest updates: \nFacebook: Ashrae USM\nInstagram: https://instagram.com/ashraeusm\n\n#ASHRAEUSM #CommitteeRecruitment","nPosts":1,"flags":[{"t":"inferred","text":"The myCSD line comes from a short follow-up message sent right after the post, so it is read as applying to this drive."}],"poster":false,"campus":"kej"},{"id":"r-gps","title":"Gerak Pengguna Siswa (GPS) USM: MT & Exco","org":"GPS USM","deadline":null,"kind":"recruit","dateText":"No deadline stated (posted 4 Nov)","csd":"\"Kumpul mata MyCSD\" (stated)","who":"Not stated","note":"Majlis Tertinggi (MT) and Exco: Teknikal & Fizikal, Media & Publisiti, Hubungan Luar, Keusahawanan. May already be closed.","forms":[{"label":"Apply","url":"https://forms.gle/qMT3MnN4E7hAqJcQ8"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-04 08:13","sender":"UMisOne","orig":null,"msg":44207,"snippet":"🔥 WE ARE RECRUITING: MT & EXCO GERAK PENGGUNA SISWA (GPS) USM! 🔥"}],"text":"🔥 WE ARE RECRUITING: MT & EXCO GERAK PENGGUNA SISWA (GPS) USM! 🔥\n\n\nHai warga USM! 🎓✨ Korang tengah cari peluang untuk asah bakat kepimpinan, tambah pengalaman best, dan paling penting... nak KUMPUL MATA MyCSD? 🤩📈\n\n\nInilah masanya! Sertai barisan kepimpinan GPS USM sekarang! 🌟💪\n\n\n📌 PORTFOLIO & JAWATAN YANG DIBUKA: 📌\n\n\n1️⃣ Majlis Tertinggi [MT] 👑✨\n 2️⃣ Exco Portfolio:\n 📋 🛠️ Teknikal dan Fizikal \n📸 Media dan Publisiti \n🤝 Hubungan Luar \n💼 Keusahawanan\n\n\n🎁 KENAPA KORANG KENA JOIN KITORANG? 🎁\n✅ Kumpul mata MyCSD banyakkk! 🎯🪙 \n✅ Peluang keemasan jadi Sekretariat Program 🎪🗣️ \n✅ Asah soft skills & tambah kawan baru 🤝❤️\n✅ Pengalaman organisasi yang gempak untuk resume! 📄🚀\n\n\n📲 MACAM MANA NAK APPLY? Imbas je kod QR pada poster 📱🔍 atau klik link https://forms.gle/qMT3MnN4E7hAqJcQ8\n\n\nAda sebarang soalan? Terus roger kitorang: 👇 📞 WhatsApp: 017-8056878 tel:017-8056878 📸 Instagram: @gps.usm\n\n\nJom jadi sebahagian daripada keluarga kami! Cepat daftar sebelum terlambat tau! 🏃‍♂️💨✨","nPosts":1,"flags":[],"poster":false},{"id":"r-skg1","title":"Sekretariat Kebolehpasaran Graduan (SKG): Ketua & Penolong Ketua Unit","org":"Sekretariat Kebolehpasaran Graduan (SKG)","deadline":"2026-11-08","kind":"recruit","dateText":"Closes 8 Nov 2026","csd":"\"MYCSD di setiap program\"","who":"Not stated","note":"Departments: Media & Komunikasi, Pengurusan & Protokol, Logistik & Operasi, Jaringan Strategik & Pameran, Kerjaya & Industri.","forms":[{"label":"Apply","url":"https://docs.google.com/forms/d/e/1FAIpQLSfYjs6rWJtY9MOnSqtoQ3xsm2l8ZnLdaUzhK7Dy8BdqQAaejQ/viewform?usp=publish-editor"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-06 10:53","sender":"UMisOne","orig":null,"msg":44249,"snippet":"🔥PENCARIAN KETUA & PENOLONG KETUA UNIT SEKRETARIAT KEBOLEHPASARAN GRADUAN 2026 /2027 🔥"}],"text":"🔥PENCARIAN KETUA & PENOLONG KETUA UNIT SEKRETARIAT KEBOLEHPASARAN GRADUAN 2026 /2027 🔥\n\nAssalamualaikum dan salam sejahtera! 👋✨\n\nAdakah anda bersedia untuk mengasah bakat kepimpinan dan membawa Sekretariat Kebolehpasaran Graduan (SKG) ke tahap yang lebih tinggi? 🚀\n\nSKG kini membuka peluang kepada mahasiswa/i yang berdedikasi, berwawasan, dan berketerampilan untuk mengisi jawatan Ketua & Penolong Ketua Unit bagi sidang 2026 /2027!\n\n🏛️ JABATAN YANG DITAWARKAN:\n📸 Media & Komunikasi\n🤝 Pengurusan & Protokol\n🚚 Logistik & Operasi\n📈 Jaringan Strategik & Pameran\n🏢 Kerjaya & Industri\n\n\n📅 Tarikh Tutup Permohonan: 8 November 2026\n🔗 Pautan Pendaftaran:https://docs.google.com/forms/d/e/1FAIpQLSfYjs6rWJtY9MOnSqtoQ3xsm2l8ZnLdaUzhK7Dy8BdqQAaejQ/viewform?usp=publish-editor\n\nSertai kami sekarang dan dapat memperolehi Career exposure di peringkat Antarabangsa💪✨\n\nMYCSD di setiap program\n\n“Lead. Connect. Empower.”\n\nSebarang pertanyaan sila hubungi:\nRidwan \nhttps://wa.me/@aridwanrizal\nSook Man\nhttps://wa.me/@sookman.y","nPosts":1,"flags":[],"poster":false},{"id":"r-skg2","title":"Sekretariat Kebolehpasaran Graduan (SKG): Exco 2026/27","org":"Sekretariat Kebolehpasaran Graduan (SKG)","deadline":"2026-11-22","kind":"recruit","dateText":"Closes 22 Nov 2026","csd":"myCSD not stated in this post","who":"Not stated","note":"A separate call from the Ketua / Penolong Ketua one. Only the closing date is in the export.","forms":[{"label":"Apply","url":"https://docs.google.com/forms/d/e/1FAIpQLSfd6dx0Y7NLzWFiQQLfvFLuuy3VAsk8p8g5TVZ59hOVWoJbNg/viewform"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-19 13:41","sender":"UMisOne","orig":null,"msg":44501,"snippet":"🔥PENCARIAN EXCO SEKRETARIAT KEBOLEHPASARAN GRADUAN 2026 /2027 🔥"}],"text":"🔥PENCARIAN EXCO SEKRETARIAT KEBOLEHPASARAN GRADUAN 2026 /2027 🔥\n\nAssalamualaikum dan salam sejahtera! 👋✨\n\nAdakah anda bersedia untuk mengasah bakat kepimpinan dan membawa Sekretariat Kebolehpasaran Graduan (SKG) ke tahap yang lebih tinggi? 🚀\n\nSKG kini membuka peluang kepada mahasiswa/i yang berdedikasi, berwawasan, dan berketerampilan untuk menyertai kami sebagai ahli exco bagi sidang 2026 /2027!\n\n🏛️ JABATAN YANG DITAWARKAN:\n📸 Media & Komunikasi\n🤝 Pengurusan & Protokol\n🚚 Logistik & Operasi\n📈 Jaringan Strategik & Pameran\n🏢 Kerjaya & Industri\n\n\n📅 Tarikh Tutup Permohonan: 22 November 2026\n🔗 Pautan pendaftaran: https://docs.google.com/forms/d/e/1FAIpQLSfd6dx0Y7NLzWFiQQLfvFLuuy3VAsk8p8g5TVZ59hOVWoJbNg/viewform\n\nSertai kami sekarang dan dapat memperolehi pendedahan kerjaya di peringkat Antarabangsa💪✨\n\n“Lead. Connect. Empower.”\n\nSebarang pertanyaan sila hubungi:\nRidwan: 01174912480 tel:01174912480\nSook Man: 016-5956918 tel:016-5956918\n\n#SKG2627 #PencarianExco  #SekretariatKebolehpasaranGraduan #USM #BHEPA","nPosts":1,"flags":[],"poster":false},{"id":"r-cima","title":"CIMA Cash Flow Competition: Committee","org":"CIMA Cash Flow Competition","deadline":"2026-11-15","kind":"recruit","dateText":"Closes 15 Nov 2026, 11:59 pm","csd":"\"MyCSD Provided\" (stated)","who":"Not stated","note":"Departments: Design & Multimedia, Publicity, Logistics & Banquet, Programme & Protocol, Competition, Sponsorship.","forms":[{"label":"Apply","url":"https://docs.google.com/forms/d/e/1FAIpQLSfrB4uZuR7dHP4ml8U2Tziluq-NLRRx9LJoKmwj3Fslqry5wA/viewform?usp=header"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-13 20:14","sender":"UMisOne","orig":null,"msg":44372,"snippet":"🚨 [CIMA CASH FLOW COMPETITION — COMMITTEE RECRUITMENT IS NOW OPEN!] 🚨"}],"text":"🚨 [CIMA CASH FLOW COMPETITION — COMMITTEE RECRUITMENT IS NOW OPEN!] 🚨\n\nAre you ready to step out of your comfort zone, challenge yourself and gain unforgettable experiences? 👀✨\n\nThe CIMA Cash Flow Competition is officially recruiting committee members, and we want YOU to be part of our team! \n\n📌 AVAILABLE DEPARTMENTS:\n- Design & Multimedia\n- Publicity\n- Logistics & Banquet\n- Programme & Protocol\n- Competition\n- Sponsorship\n\n🌟 WHY JOIN US?\n- Gain valuable event management experience\n- Enhance your leadership and teamwork skills\n- Expand your network and make new friends\n- MyCSD Provided\n\n📅 Application Deadline: 15 November 2026 (11:59 PM)\n\n📲 HOW TO APPLY?\nScan the QR code or fill in the registration form link below and submit your application before the deadline!\nRegistration form: https://docs.google.com/forms/d/e/1FAIpQLSfrB4uZuR7dHP4ml8U2Tziluq-NLRRx9LJoKmwj3Fslqry5wA/viewform?usp=header\n\nEvery great event starts with a great team. Don't miss your chance to be part of ours! 💜","nPosts":1,"flags":[],"poster":false},{"id":"r-zbb","title":"Zero Burden Bazaar: Committee","org":"USM Green Ambassadors (from hashtag)","deadline":null,"kind":"recruit","dateText":"No deadline stated (the bazaar was 14 Nov)","csd":"\"Earn MYCSD points\" (stated)","who":"Not stated","note":"Roles: Logistics & Usher Coordinator, Event Volunteer. The bazaar has already taken place, so this is probably closed.","forms":[{"label":"Apply","url":"https://forms.gle/iSUPkd8MQJcR1oDHA"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-11-06 10:55","sender":"UMisOne","orig":null,"msg":44256,"snippet":"🎉 Calling all USM students! Ready to make an impact and be part of something big?"},{"role":"latest","ts":"2026-11-08 19:46","sender":"UMisOne","orig":null,"msg":44297,"snippet":"🎉 Calling all USM students! Ready to make an impact and be part of something big?"}],"text":"🎉 Calling all USM students! Ready to make an impact and be part of something big?\n\nThe Zero Burden Bazaar Committee is officially recruiting! Whether you love organizing logistics behind the scenes or guiding crowds on event day, we have a place for you.\n\nWhy Join Us?\n✅ Earn MYCSD points\n✅ Gain real-world event planning & leadership experience\n✅ Meet awesome teammates and expand your network\n\n📋 Open Positions: \n1️⃣ Logistics & Usher Coordinator\n2️⃣ Event Volunteer\n\n📲 Ready to apply?\nScan the QR code on the poster or click on the link below 👇\nhttps://forms.gle/iSUPkd8MQJcR1oDHA   \n\nFor any inquiries contact Ker Xuen at 011-5662 7525!\nDon’t miss out—apply today! 🙌✨\n \n#EPEHub \n#SustainabilityUSM\n#USMzeroburdenbazaar","nPosts":2,"flags":[],"poster":false},{"id":"r-lubkos","title":"LUBKOS ke-20: Fasilitator","org":"Program Libatsama Universiti Bersama Komuniti Orang Asli (LUBKOS)","deadline":"2026-11-13","kind":"recruit","dateText":"Closes 13 Nov 2026; interviews 14 Nov (online)","csd":"myCSD not stated","who":"Full-time USM Induk students","note":"Participation fee: KUSISDARI members RM30 / non-members RM35.","forms":[{"label":"Apply","url":"https://forms.gle/scZ1fmf4fbsR9SNn6"}],"eligKind":"limited","sources":[{"role":"first","ts":"2026-11-10 15:10","sender":"UMisOne","orig":null,"msg":44332,"snippet":"📢 PENCARIAN FASILITATOR LUBKOS KE-20! 🌿"}],"text":"📢 PENCARIAN FASILITATOR LUBKOS KE-20! 🌿\n\nJom sertai kami dalam Program Libatsama Universiti Bersama Komuniti Orang Asli (LUBKOS KE-20)!\n\nInilah peluang untuk menimba pengalaman sebagai sukarelawan, mengenali komuniti Orang Asli dengan lebih dekat serta meningkatkan kemahiran komunikasi dan kerjasama berpasukan. ❤️\n\n📌 Terbuka kepada: Semua mahasiswa/i sepenuh masa USM Kampus Induk.\n\n📅 Tarikh tutup pendaftaran: 13 November 2026\n💻 Temu duga: 14 November 2026 (Dalam talian)\n\n💰 Yuran penyertaan:\n• Ahli KUSISDARI: RM30\n• Bukan ahli: RM35\n\n🔗 Pautan pendaftaran:\nhttps://forms.gle/scZ1fmf4fbsR9SNn6\n\nJangan lepaskan peluang untuk menjadi sebahagian daripada pengalaman bermakna ini. Jom bersama-sama menyumbang bakti kepada komuniti! 🌱\n\n\nSebarang pertanyaan,sila berhubung :\n\nHazil : 011-1118 2742\nErmy : 014-626 6400","nPosts":1,"flags":[],"poster":false,"campus":"induk"},{"id":"r-mpdr","title":"Majlis Penghuni Desasiswa Restu (MPDR): Exco & Penolong Exco","org":"MPDR (Desasiswa Restu)","deadline":"2026-11-22","kind":"recruit","dateText":"Open 17 Nov 12 pm to 22 Nov 2026, 12 pm","csd":"myCSD not stated","who":"Residents of Desasiswa Restu","note":"Closes at noon on 22 Nov, not end of day.","forms":[{"label":"Apply","url":"https://forms.gle/71xZVWSZKU8qEsC19"}],"eligKind":"limited","sources":[{"role":"first","ts":"2026-11-19 13:40","sender":"UMisOne","orig":null,"msg":44494,"snippet":"[PENCARIAN EXCO & PENOLONG EXCO MPDR SIDANG 2026/2027]"}],"text":"[PENCARIAN EXCO & PENOLONG EXCO MPDR SIDANG 2026/2027]\n\nNadi Oren, Mengukir Legasi.\n\nAssalamualaikum, Salam Sejahtera & Salam Restu Wow Hebat!\n\nBarisan Kepimpinan Majlis Penghuni Desasiswa Restu (MPDR) kini membuka peluang kepada seluruh penghuni Desasiswa Restu untuk menyertai kami dalam barisan kepimpinan baharu sebagai Exco dan Penolong Exco bagi Sidang Akademik 2026/2027.\n\n📆Tarikh pendaftaran dibuka:\nBuka: 17 November 2026, 12 PM\nTutup: 22 November 2026, 12 PM\n\n🔗Pautan pendaftaran:\nhttps://forms.gle/71xZVWSZKU8qEsC19\n\nAyuh gilap potensi anda dan sertai kami untuk menjadi sebahagian daripada keluarga Nadi Oren, dan semangat #WOWHEBAT!🐯\n\n📱Sebarang pertanyaan boleh hubungi: \nDaniel Dennis: 019-876 4298\nNizzatul Hanis: 013-498 5201\n\n#NADIOREN\n#MPDR2627\n#WOWHEBAT\n#BiarNgaumanJadiSaksi","nPosts":1,"flags":[],"poster":false}],"members":[{"id":"m-perkasa","title":"PERKASA USM (Sarawak students)","fee":"Renewal RM8 / new RM10","close":"2026-10-20","kind":"member","dateText":"15 Sep – 20 Oct 2026","csd":"myCSD not stated in the post","who":"All students","forms":[{"label":"Register / renew","url":"https://forms.gle/iGyJsh3uuB91gHY3A"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-09-16 14:08","sender":"UMisOne","orig":null,"line":1953,"snippet":"PENDAFTARAN DAN PEMBAHARUAN KEAHLIAN PERKUMPULAN ANAK-ANAK SARAWAK (PERKASA) USM SIDANG AKADEMIK 2026/2027]"}],"text":"*[PENDAFTARAN DAN PEMBAHARUAN KEAHLIAN PERKUMPULAN ANAK-ANAK SARAWAK (PERKASA) USM SIDANG AKADEMIK 2026/2027]*\nAssalamualaikum, Salam Sejahtera dan Salam Encang, Bumi Kenyalang 💛❤️🖤\nSukacita dimaklumkan bahawa PERKASA telah *membuka pendaftaran* kepada semua mahasiswa/i untuk menjadi *AHLI PERKUMPULAN ANAK-ANAK SARAWAK (PERKASA) USM bagi SIDANG AKADEMIK 2026/2027.*\nSehubungan dengan itu, *Yuran Pendaftaran* adalah ditetapkan seperti berikut:\n- *Pembaharuan Keahlian: RM 8*\n- ⁠*Ahli Baharu: RM 10*\nPermohonan Ahli Baharu dan Pembaharuan Keahlian boleh dilakukan menerusi Google Form berikut:\n🔗 https://forms.gle/iGyJsh3uuB91gHY3A\n📍Tarikh pendaftaran dan pembaharuan keahlian akan dibuka pada *15 September hingga 20 Oktober 2026 !*\n📣 Jangan lepaskan peluang untuk menjadi ahli dengan pelbagai hebahan, program dan inisiatif oleh Perkumpulan Anak-anak Sarawak (PERKASA) Universiti Sains Malaysia.\nSebarang pertanyaan, boleh hubungi:\n📞 *Caroline Lema (019-4840377)*\n📞 *Herman Gabriel (011-36361074)*","nPosts":1,"flags":[],"poster":false},{"id":"m-ibos","title":"IBOS USM (Integration Balance of Skills)","fee":"RM3","close":"2026-10-25","kind":"member","dateText":"5 – 25 Oct 2026","csd":"\"Mata MyCSD diberikan kepada ahli aktif\" (active members)","who":"All students","forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLScsfXBKam8LJE368kchHhUd380McylAh9qzqDjb7aAEq4jDJg/viewform?usp=dialog"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-07 11:38","sender":"UMisOne","orig":null,"line":5957,"snippet":"PENCARIAN AHLI AKTIF SEKRETARIAT IBOS USM]"},{"role":"latest","ts":"2026-10-25 09:09","sender":"UMisOne","orig":"24.10.2026 11:18","msg":44016,"snippet":"🔊*[PENCARIAN AHLI AKTIF SEKRETARIAT IBOS USM]*"}],"text":"🔊*[PENCARIAN AHLI AKTIF SEKRETARIAT IBOS USM]*\n\nAsalammualaikum dan Salam Sejahtera 💙\n\nSekretariat Integration Balance of Skills (IBOS USM) kini membuka peluang kepada semua mahasiswa/i untuk menjadi sebahagian daripada keluarga besar IBOS USM!\n\nAntara keistimewaan yang dapat diperoleh jika anda menyertai kami seperti yang berikut:\n\n- Pelbagai aktiviti yang menarik bakal menanti anda\n- ⁠Mata *MyCSD* diberikan kepada ahli aktif\n\nTARIKH PENDAFTARAN:\n📆 5 - 25 Oktober 2026\n\n*BAYARAN YURAN RM3 SAHAJA*\n\nhttps://docs.google.com/forms/d/e/1FAIpQLScsfXBKam8LJE368kchHhUd380McylAh9qzqDjb7aAEq4jDJg/viewform?usp=dialog\n\nJangan lepaskan peluang keemasan ini !!!\n\nSebarang pertanyaan, boleh hubungi:\n\n☎️ 017-5987715 ( syasya )\n\n*\"Sinergi Kemahiran, Keseimbangan Kejayaan\"*\n\n-♟️💙🛠️\n\n#IBOSUSM\n#WeLead\n#IntegrationBalanceOfSkills\n#TVETUSM","nPosts":12,"flags":[],"poster":false},{"id":"m-ksusm","title":"Kelab Sejarah USM (KSUSM)","fee":"Renewal RM2 / new RM3","close":"2026-10-25","kind":"member","dateText":"5 – 25 Oct 2026","csd":"\"berpeluang memperoleh mata MyCSD\" (a chance to earn)","who":"All students","forms":[{"label":"Register / renew","url":"https://docs.google.com/forms/d/e/1FAIpQLSePC6B6vxWB-FHzjqNQL3rqICCdA8eZRaA7KnbN-DUD1qkUHQ/viewform"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-09 07:14","sender":"UMisOne","orig":null,"line":7135,"snippet":"PENCARIAN AHLI KELAB SEJARAH USM 2026/2027 KINI DIBUKA!"}],"text":"📢 *PENCARIAN AHLI KELAB SEJARAH USM 2026/2027 KINI DIBUKA!*\nAssalamualaikum, Salam Sejahtera & Salam Kami Memimpin! 💛🖤\nKelab Sejarah Universiti Sains Malaysia (KSUSM) kini membuka Pencarian Ahli bagi Sidang Akademik 2026/2027! 🔥\nPeluang ini terbuka kepada semua pelajar USM yang berminat untuk menyertai aktiviti dan program KSUSM 🫱🏽‍🫲🏽\nBukan itu sahaja, anda juga berpeluang memperoleh mata MyCSD dan membina jaringan baharu bersama warga USM😆\nJangan lepaskan peluang anda untuk menjadi ahli dan cipta sejarah bersama KSUSM! 💛🖤\n❗TARIKH PENDAFTARAN DAN PEMBAHARUAN KEAHLIAN AKAN DIBUKA PADA:\n*5 Oktober sehingga 25 Oktober 2026*\nYuran pengaktifan keahlian : *RM2*\nYuran keahlian baharu: *RM3*\n*DAFTAR SEKARANG!*\nhttps://docs.google.com/forms/d/e/1FAIpQLSePC6B6vxWB-FHzjqNQL3rqICCdA8eZRaA7KnbN-DUD1qkUHQ/viewform\n📞 *Sebarang pertanyaan boleh hubungi:*\nFasyana: 0109282006\nHakimi: 01135677948\n#KSUSM26/27\n#MENEROKA SEJARAH MASA SILAM, MERINTIS SEJARAH MASA DEPAN","nPosts":1,"flags":[],"poster":false},{"id":"m-amlis","title":"AMLIS (Perlis students; others welcome)","fee":"RM5","close":"2026-10-31","kind":"member","dateText":"30 Sep – 31 Oct 2026","csd":"\"Mendapat Mata MyCsd Ahli\"","who":"Students from outside Perlis are welcome","forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLScVbu0cGgLh2f9dJnFq6qKqXX9g0vohZ-fPY3J0Grhqe2llyw/viewform?usp=header"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-09-29 21:28","sender":"UMisOne","orig":null,"line":4041,"snippet":"PENDAFTARAN AHLI AMLIS BAGI SIDANG 26/27! 👀 ] 💙💛"},{"role":"latest","ts":"2026-10-21 08:17","sender":"UMisOne","orig":"20.10.2026 17:42","msg":43956,"snippet":"💛💙 [ PENDAFTARAN AHLI AMLIS BAGI SIDANG 26/27! 👀 ] 💙💛"}],"text":"💛💙 [ PENDAFTARAN AHLI AMLIS BAGI SIDANG 26/27! 👀 ] 💙💛\n \nAssalamualaikum, Salam Sejahtera & Salam Sayang Amlis🫶🏻\n\nKalau korang nampak hebahan ni, jangan scroll dulu… 👀\nSebab kami sebenarnya tengah cari korang. Yang luar Perlis pun dialu-alukan 🥹👉🏻👈🏻\n \nAMLIS sedang membuka pendaftaran ahli bagi Sidang Akademik 2026/2027! ✨\n \nKelebihan menjadi AHLI AMLIS, korang boleh:\n💛Mendapat Mata MyCsd Ahli\n💙Mendapat hebahan awal program Amlis\n💛Berpeluang Menjadi Ajk Program Amlis\n💙Mendapat potongan harga untuk pembelian Tshirt Amlis\n\n💰Yuran hanya RM5\n\n📆Tarikh Pendaftaran : 30 Sept 2026 sehingga 31 Okt 2026\n\n📝 Link Pendaftaran: [https://docs.google.com/forms/d/e/1FAIpQLScVbu0cGgLh2f9dJnFq6qKqXX9g0vohZ-fPY3J0Grhqe2llyw/viewform?usp=header]\n \n📞 Sebarang pertanyaan:\nMun — 010-5022713\nAzwa — 011-33880985\n\n“Kecil di Peta, Anak Peghelih Mendunia.”\n \n#AMLIS2627\n#AMLISUSM","nPosts":3,"flags":[],"poster":false},{"id":"m-belas","title":"B.E.L.A.S USM","fee":"Renewal RM2 / new RM3","close":"2026-10-31","kind":"member","dateText":"21 Aug – 31 Oct 2026","csd":"\"kumpul markah mycsd\"","who":"All USM students","forms":[{"label":"Register","url":"https://forms.gle/cGErgHv7wee6PDmZ8"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-08-21 20:24","sender":"Marcel","orig":"21.08.2026 11:55","line":179,"snippet":"PENDAFTARAN KEAHLIAN B.E.L.A.S USM 2026/2027 🐱"}],"text":"*PENDAFTARAN KEAHLIAN B.E.L.A.S USM 2026/2027 🐱*\n📌 Terbuka kepada semua mahasiswa/i USM\nSukacita dimaklumkan bahawa Sekretariat Believe. Empathy. Love. Affection. Salvation (B.E.L.A.S) USM kini membuka pendaftaran keahlian baru bagi Sesi 2026/2027✨\nB.E.L.A.S bukan hanya sekadar kelab, malah menawarkan pelbagai peluang untuk menyertai pelbagai aktiviti dan program yang menarik🐾🐈\nSertai kami dan anda dapat kumpul markah mycsd\n*Tarikh pembukaan* : 21 Ogos 2026 sehingga 31 Oktober 2026\n*Pembaharuan Ahli* : RM2\n*Ahli baharu* : RM3\nIsi pendaftaran disini: 👉🏻https://forms.gle/cGErgHv7wee6PDmZ8\n❓ Sebarang Pertanyaan:\n- 014-6392691 (Marcel)\n- 018-9443574 (Razi)\n#BELASCareForAnimal\n#BELAS26/27","nPosts":1,"flags":[],"poster":false},{"id":"m-srim","title":"SRIM USM (Sekretariat Rakan Integriti Mahasiswa)","fee":"New RM1 / renewal free","close":null,"kind":"member","dateText":"No closing date stated","csd":"\"MyCSD melalui keahlian serta penyertaan program\"","who":"All USM students","forms":[{"label":"Register","url":"https://forms.gle/oxJC6W8K2TAQRR1L8"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-01 22:34","sender":"Husna","orig":"01.10.2026 19:55","line":4540,"snippet":"PEMBUKAAN KEAHLIAN SRIM USM 26/27! ❤️"},{"role":"latest","ts":"2026-10-25 09:07","sender":"UMisOne","orig":"13.10.2026 08:50","msg":44013,"snippet":"❤️ PEMBUKAAN KEAHLIAN SRIM USM 26/27! ❤️"}],"text":"❤️ PEMBUKAAN KEAHLIAN SRIM USM 26/27! ❤️\n\nSekretariat Rakan Integriti Mahasiswa (SRIM) USM kini membuka pendaftaran keahlian kepada semua pelajar USM bagi sesi 26/27! 🫰🏻\n\n🌟 KELEBIHAN MENJADI AHLI SRIM ✅ Sertai program dan aktiviti menarik anjuran SRIM ✅ MyCSD melalui keahlian serta penyertaan program anjuran SRIM\n\n💰 YURAN KEAHLIAN: 🆕 Ahli Baharu: RM1 sahaja 🔄 Pembaharuan Ahli: PERCUMA!\n\n📌Daftar Sekarang https://forms.gle/oxJC6W8K2TAQRR1L8 \n\n📲 Instagram: @srimusm 🎵 TikTok: @srimusm\n\n❓ Sebarang pertanyaan: 📞 013-6213076 (Husna) 📞 011-12238876 (Julia)\n\n“MEMBINA INTEGRITI, MENCIPTA LEGASI”\n\nSekretariat Rakan Integriti Mahasiswa 26/27 Universiti Sains Malaysia","nPosts":12,"flags":[],"poster":false},{"id":"m-akpk","title":"AKPK (ASAS USM)","fee":"Free","close":null,"kind":"member","dateText":"No closing date stated","csd":"\"Faedah: Mata MyCSD\"","who":"All USM students","forms":[{"label":"Register","url":"https://forms.gle/iG4mfyR8AdguEKpH8"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-14 19:04","sender":"UMisOne","orig":null,"line":8826,"snippet":"PENCARIAN AHLI AKPK SESI 26/27📢"},{"role":"latest","ts":"2026-10-23 11:07","sender":"UMisOne","orig":"14.10.2026 08:04","msg":43995,"snippet":"📢 PENCARIAN AHLI AKPK SESI 26/27📢"}],"text":"📢 PENCARIAN AHLI AKPK SESI 26/27📢\n\nPlatform kewangan untuk pelajar, Belajar bijak urus wang, bina masa depan yang lebih selamat.💰\n\n💡Mengapa Sertai Kami?\n✨ Faedah: Mata MyCSD\n✨Belajar ilmu kewangan yang berguna untuk kehidupan harian\n✨Akses ke program & perkongsian eksklusif\n✨Sertai aktiviti menarik dan kenal rakan-rakan baru\n\n🆓 *Yuran Keahlian: PERCUMA* — tak perlu bayar sesen pun!\n\n🎉*TERBUKA KEPADA SEMUA PELAJAR USM!*🎉\n\nJangan lepaskan peluang ini! \n\n👉🏻*Jom daftar sekarang:*\nhttps://forms.gle/iG4mfyR8AdguEKpH8\n\n📞 Hubungi wakil kami untuk sebarang pertanyaan:\nHeriz (018-3126 976)\nAmny (017-772 3464)\n\nToday. Tomorrow. Together 💙\n\n#AKPK #ASASUSM #BijakKewangan #MasaDepanLebihCerah","nPosts":4,"flags":[],"poster":false},{"id":"m-econ","title":"Kelab Ekonomi USM (Ahli Aktif)","fee":"From RM5","close":null,"kind":"member","dateText":"No closing date stated","csd":"\"Memperoleh mata MyCSD\"","who":"Main campus (Kampus Induk) students","forms":[{"label":"Register","url":"https://forms.gle/N34WTqzN5jBUJYJw6"}],"campus":"induk","eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-07 11:39","sender":"UMisOne","orig":null,"line":6020,"snippet":"PENCARIAN AHLI AKTIF KELAB EKONOMI USM BAGI SESI 2026/2027"}],"text":"📢 PENCARIAN AHLI AKTIF KELAB EKONOMI USM BAGI SESI 2026/2027\nAssalamualaikum w.b.t. dan salam sejahtera! 👋🏻\nKelab Ekonomi USM kini membuka peluang kepada seluruh mahasiswa/i USM Kampus Induk untuk menyertai kami sebagai Ahli Aktif bagi sesi akademik 2026/2027! 🎓\n✨KENAPA SERTAI KELAB EKONOMI USM?\n✅ Memperoleh mata MyCSD\n✅ Berpeluang menyertai program dan aktiviti di luar universiti\n✅ Diberikan diskaun eksklusif untuk ahli sahaja\n✅Diberikan diskaun untuk pembelian T-shirt Kelab Ekonomi\n✅ Yuran keahlian serendah RM5 sahaja!\n📌 Terbuka kepada semua mahasiswa/i USM Kampus Induk.\nJangan lepaskan peluang untuk menjadi sebahagian daripada komuniti Kelab Ekonomi USM! 🤝🏻\nJom sertai kami dan daftar sebagai Ahli Aktif sekarang!\nhttps://forms.gle/N34WTqzN5jBUJYJw6\nIsi Google Form melalui pautan yang disediakan dan sertai keluarga Kelab Ekonomi USM yang penuh semangat, peluang dan pengalaman! 💙\n📞 Sebarang pertanyaan, sila hubungi:\n+60 13-781 5701 Syafitri\n+60 11-5368 1106 Amanda","nPosts":1,"flags":[],"poster":false},{"id":"m-sukass","title":"SUKASS (Sekretariat Sukarelawan USM)","fee":"RM5","close":null,"kind":"member","dateText":"No closing date stated","csd":"\"MyCSD Ahli Aktif\"","who":"All students","forms":[{"label":"Register","url":"https://forms.gle/SW9TYXBG75orXstMA"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-04 14:04","sender":"UMisOne","orig":null,"line":5252,"snippet":"PENCARIAN AHLI AKTIF SEKRETARIAT SUKARELAWAN USM (SUKASS)"}],"text":"PENCARIAN AHLI AKTIF SEKRETARIAT SUKARELAWAN USM (SUKASS)\nKami daripada Sekretariat Sukarelawan USM (SUKASS) mengalu-alukan semua mahasiswa/i USM untuk mendaftar keahlian SUKASS bagi Sidang Akademik 2026/2027!\nKelebihan ahli SUKASS:\n🚨 Menjadi golongan utama yang menerima hebahan pencarian sukarelawan.\n🚨 Mempunyai peluang terlibat sebagai sekretariat bagi projek-projek penganjuran SUKASS.\n🚨 Berpeluang terlibat program Majlis Sukarelawan Universiti Awam Malaysia (MASKUM).\n🚨 MyCSD Ahli Aktif\nPautan pendaftaran:\nhttps://forms.gle/SW9TYXBG75orXstMA\nYuran keahlian: RM 5 sahaja!\nSebarang pertanyaan mohon hubungi;\n📲 Fami : 011-39638297\n📲 Tata : 017-9859213\nAtau layari laman rasmi Instagram kami\nhttps://www.instagram.com/sukarelawanusm?stkn=MTQ5bW5jdnQxYzcxMQ==\n\"WE SERVE OVER THE BOUND\"","nPosts":1,"flags":[],"poster":false},{"id":"m-greenlung","title":"USM Green Lung","fee":"New RM5 / renewal RM3","close":null,"kind":"member","dateText":"No closing date stated. Membership valid for one tenure only","csd":"\"Earn MyCSD points through your involvement\"","who":"Old and new members","forms":[{"label":"Register / renew","url":"https://docs.google.com/forms/d/e/1FAIpQLSe5CR_YUu5XKPIELtUuxukYj2nrWfUWApSyPSuKXK72zRdDjQ/viewform"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-10-01 22:35","sender":"UMisOne","orig":null,"line":4632,"snippet":"USM Green Lung Membership】"}],"text":"【𝙐𝙎𝙈 𝙂𝙧𝙚𝙚𝙣 𝙇𝙪𝙣𝙜 𝙈𝙚𝙢𝙗𝙚𝙧𝙨𝙝𝙞𝙥】\nGreetings from Sekretariat Green Lung USM ! 💚\nReady to be part of something meaningful? We’re excited to announce that membership registration for the Green Lung is officially opened for old and new members! 🌱✨\nWhether you’re a returning member or joining us for the first time, this is your chance to be part of the USM Green Lung community and contribute towards a healthier, tobacco-free future! 🚭\nWhy become a Green Lung member?\n🌟 Enjoy exclusive member-only discounts\n🤝 Get opportunities to join our committee\n🎯 Earn MyCSD points through your involvement\n🌱 Be part of tobacco control advocacy and meaningful activities\n💸 𝗡𝗲𝘄 𝗠𝗲𝗺𝗯𝗲𝗿𝘀𝗵𝗶𝗽: RM5\n🔁 𝗠𝗲𝗺𝗯𝗲𝗿𝘀𝗵𝗶𝗽 𝗥𝗲𝗻𝗲𝘄𝗮𝗹: RM3\n🔗 Register or renew your membership here:\nhttps://docs.google.com/forms/d/e/1FAIpQLSe5CR_YUu5XKPIELtUuxukYj2nrWfUWApSyPSuKXK72zRdDjQ/viewform\n📌 Membership is valid for ONE TENURE only.","nPosts":1,"flags":[],"poster":false},{"id":"m-smi","title":"Sekretariat Mahasiswa Intelek (SMI), ahli","fee":"Not stated","close":null,"kind":"member","dateText":"No closing date stated","csd":"Join 3 SMI programmes to qualify for MYCSD as an active member (conditional)","who":"USM students","forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSeoqdyYowVy7cT7FHDJbc58KNZF1SumgELClgknQj_hp7xsqQ/viewform"}],"eligKind":"unstated","sources":[{"role":"first","ts":"2026-09-25 17:51","sender":"UMisOne","orig":null,"line":2979,"snippet":"PENCARIAN AHLI SERKETARIAT MAHASISWA INTELEK SIDANG AKADEMIK 2026/2027🔊"}],"text":"🔊PENCARIAN AHLI SERKETARIAT MAHASISWA INTELEK SIDANG AKADEMIK 2026/2027🔊\nAssalamualaikum dan salam sejahtera.🙌✨\nTumbuh Bersama Sekretariat Mahasiswa Intelek!\nAdakah anda mahasiswa USM yang berjiwa besar? Ingin membina potensi diri sambil menyumbang bakti kepada masyarakat? Kami di Sekretariat Mahasiswa Intelek (SMI) mencari anda untuk menjadi sebahagian daripada komuniti kami!\nSertai kami untuk:\n✅ Membina kebolehan diri\n✅ Kembali menyumbang kepada masyarakat\n✅ Menerima hebahan progam terawal\n💥Sertai 3 program SMI untuk melayakkan diri mendapatkan MYCSD sebagai ahli aktif💥\nDaftar Sekarang!\nhttps://docs.google.com/forms/d/e/1FAIpQLSeoqdyYowVy7cT7FHDJbc58KNZF1SumgELClgknQj_hp7xsqQ/viewform\nSebarang pertanyaan, sila hubungi:\n📞ALISYA (011-51340128)\n📞HAFIZ (011-7083294)\nJangan tunggu lagi, ruang untuk menyerlahkan potensi anda sedang menanti! 💜\n#WadahPencerdasanMahasiswa\n#SeketariatMahasiswaIntelek\n#UniversitiSainsMalaysia","nPosts":1,"flags":[],"poster":false},{"id":"m-sempana","title":"SEMPANA USM (Martabat Pantun Melayu)","fee":"RM4","close":null,"kind":"member","dateText":"\"Registration open\", no dates","csd":"myCSD not stated in the latest post","who":"All USM students","forms":[{"label":"Register","url":"https://forms.gle/zrJSXo35TzUoPNvaA"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-08-23 15:25","sender":"sara","orig":"23.08.2026 14:26","line":245,"snippet":"PENCARIAN AHLI SEKRETARIAT MARTABAT PANTUN MELAYU (SEMPANA) USM"},{"role":"latest","ts":"2026-10-07 11:43","sender":"UMisOne","orig":null,"line":6586,"snippet":"PENCARIAN AHLI SEKRETARIAT MARTABAT PANTUN MELAYU (SEMPANA) USM"}],"text":"PENCARIAN AHLI SEKRETARIAT MARTABAT PANTUN MELAYU (SEMPANA) USM\n_Kalau hendak serlah hiasan,_\n_Sulamlah guna benang kencana,_\n_Kalau hendak martabat warisan,_\n_Ayuh bersama sertai SEMPANA._\n💛Assalamualaikum & Salam Sejahtera💛\nPendaftaran Ahli SEMPANA USM 26/27 kini dibuka kepada semua mahasiswa/mahasiswi USM!\nPelajar USM yang mendaftar boleh memilih untuk menjadi sebagai :\n🖊️ AHLI BIASA\n🖊️ PEMANTUN\nAdakah anda yang kami cari?\n🌸 Berminat memartabatkan semula seni bahasa Melayu dengan berpantun\n🌸 Berminat mendalami asas berpantun walaupun tanpa pengalaman\n🌸 Berminat menyambung bakat berpantun di sekolah\n🌸 Berminat mewakili USM ke pertandingan pantun IPT peringkat kebangsaan\n🌸Berminat menjadi pengiring & pengurus SEMPANA USM ke pertandingan pantun IPT\nDaftar sekarang di : https://forms.gle/zrJSXo35TzUoPNvaA\nYuran Keahlian : RM4\nPendaftaran keahlian dibuka\nSebarang pertanyaan boleh hubungi :\n011-6224 6581 (Syawwal)\n018-255 3655 (Ainul)\n\"Bak Lentera, Kemilau Sempana\"","nPosts":5,"flags":[],"poster":false},{"id":"m-kusisdari","title":"KUSISDARI (Perak students)","fee":"Activation RM4 / new RM6","close":null,"kind":"member","dateText":"No closing date stated (posted 7 Sep)","csd":"myCSD not stated in the post","who":"Years 1 – 4","forms":[{"label":"Register","url":"https://forms.gle/wLdwQ6BxKyaA6AaN7"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-08-30 21:44","sender":"UMisOne","orig":null,"line":557,"snippet":"PENDAFTARAN AHLI KUSISDARI SIDANG AKADEMIK 2026/2027📢"},{"role":"latest","ts":"2026-09-07 21:26","sender":"UMisOne","orig":null,"line":1363,"snippet":"PENDAFTARAN AHLI KUSISDARI SIDANG AKADEMIK 2026/2027📢"}],"text":"📢PENDAFTARAN AHLI KUSISDARI SIDANG AKADEMIK 2026/2027📢\nAssalamualaikum dan Salam Perak Sejahtera serta Salam Kusisdari 🤍💛🖤\nSukacitanya, Kumpulan Siswa Siswi Darul Ridzuan (KUSISDARI) kini membuka peluang kepada pelajar Tahun 1 hingga Tahun 4 untuk mendaftar keahlian bagi persatuan Kusisdari Sidang Akademik 2026/2027! ✨\n💰 YURAN KEAHLIAN:\n-Yuran pengaktifan keahlian: RM4\n-Yuran keahlian baharu: RM6\n🔗Borang pendaftaran/pengaktifan Ahli Kusisdari Sidang Akademik 2026/2027: https://forms.gle/wLdwQ6BxKyaA6AaN7\nSebarang pertanyaan, boleh hubungi:\nNazirah (011-53946378)\nZhi Ying (010-2949788)\n#KusisdariUSM\n#PerakGemilangWarisanDijulang\n#_TogetherWeRiseForPerak_\n🤍💛🖤","nPosts":3,"flags":[],"poster":false},{"id":"m-ansos","title":"ANSOS Club (Anthropology & Sociology)","fee":"RM2","close":null,"kind":"member","dateText":"No closing date stated","csd":"\"MYCSD points provided\"","who":"Open to everyone","forms":[],"poster":true,"eligKind":"all","sources":[{"role":"first","ts":"2026-10-07 11:40","sender":"UMisOne","orig":null,"line":6142,"snippet":"ANSOS PEEPS!✨WE’RE LOOKING FOR OUR NEXT COMMITTEE MEMBERS! !!️"},{"role":"latest","ts":"2026-10-11 08:07","sender":"UMisOne","orig":null,"line":7795,"snippet":"ANSOS PEEPS! WE’RE LOOKING FOR YOU! 🗣️💙"}],"text":"*ANSOS PEEPS*! WE’RE LOOKING FOR *YOU!* 🗣️💙\nHyee! 👋 Are you someone who’s interested in *culture, society, and people?* 👀✨\nIf yes, you’re definitely in the right place!\nWe’re *ANSOS Club USM* from the School of Social Sciences *(Anthropology & Sociology)*, and we’re now *OPEN for everyone* who’s interested in joining our community! 🫶🏻\nHere’s what you’ll get as an ANSOS Club member:\n✨ Exclusive discounts for selected ANSOS programmes\n✨ Opportunities to join the secretariat & organising committees\n✨ Be part of ANSOS Club events and programmes\n✨ ANSOS Club Annual Dinner 2026/2027\n✨ MYCSD points provided\n✨ Meet new people and make meaningful connections! 🤝🏻\n*ONLY AT RM2* for the membership‼️\nLet's be part of the ANSOS society and let’s create some remarkable experiences together 🎉\n*SCAN THE QR CODE TO JOIN!*\nFor more information:\n📞 Afrina: 011-69432094\n📞 Nabila: 019-6033404\n#ansosclubusm #ANSOS #culturesocietyhuman #anthropology #sociology","nPosts":3,"flags":[]},{"id":"m-gmi","title":"GMI USM (Gerakan Mahasiswa Istimewa)","fee":"RM3","close":null,"kind":"member","dateText":"No closing date stated","csd":"\"Memperoleh MyCSD\"","who":"All students","forms":[],"poster":true,"eligKind":"all","sources":[{"role":"first","ts":"2026-10-07 11:38","sender":"UMisOne","orig":null,"line":5899,"snippet":"HEY, SISWA DAN SISWI USM! 🚨"}],"text":"🚨 *HEY, SISWA DAN SISWI USM!* 🚨\nPernah terfikir nak buat sesuatu yang *bermakna, seronok dan memberi impak kepada orang lain? *👀✨\n*Gerakan Mahasiswa Istimewa (GMI) USM* sedang mencari *AHLI AKTIF* untuk bersama-sama membina komuniti yang lebih inklusif! 💜\n✨ Kenapa sertai GMI?\n🔹 Mengenali komuniti, masyarakat & organisasi luar USM\n🔹 Terlibat dalam program-program *menarik dan bermakna*\n🔹 Menikmati *pengurangan yuran* bagi program-program GMI\n🔹 Memperoleh *MyCSD* melalui penglibatan dan kemahiran yang diperoleh\n🔹 Membina *pengalaman, kenalan dan kenangan* bersama! 💜\n💰 *Yuran keahlian: RM3 sahaja!*\n📲 Imbas QR di dalam poster dan jadilah *sebahagian daripada gerakan kami!*\n☎️Sebarang pertanyaan sila hubungi:\n- Syahrul Izz - +60 11-1101 1706\n- ⁠Aina Nabilah - +60 11‑6158 4009\n*Meneroka Potensi, Membina Harapan*🌱\n#GMIUSM #GerakanMahasiswaIstimewa #USM function dropLocalTicks(ids){

const ITEMS = DATA.items.map(it => Object.assign({}, it, {

function hasEnded(it, now){ return it.kind === 'ended' || (it.e !== null && now > it.e); }
function isLive(it, now){ return it.s !== null && now >= it.s && now <= it.e; }

function countdown(it, now){
  if (it.kind === 'window'){
    if (now < it.s){ const n = dayDiff(it.s, now); return n === 1 ? 'opens tomorrow' : 'opens in '+plural(n,'day'); }
    const n = dayDiff(it.e, now);
    return 'open now · ' + (n === 0 ? 'ends today' : n === 1 ? 'ends tomorrow' : 'ends in '+plural(n,'day'));
  }
  if (now >= it.s) return 'happening now';
  const diff = it.s - now;
  const n = dayDiff(it.s, now);
  if (n === 0){
    const mins = Math.max(1, Math.floor(diff/60000));
    const hh = Math.floor(mins/60), mm = mins % 60;
    return 'in ' + (hh ? hh+'h ' : '') + mm + 'm';
  }
  if (diff < 7*864e5){
    const d = Math.floor(diff/864e5), hh = Math.floor((diff % 864e5)/36e5);
    return 'in ' + d + 'd ' + hh + 'h';
  }
  return 'in ' + plural(n,'day');
}
function deadlineTag(dl, now){
  if (dl === null) return null;
  if (now > dl) return {text:'closed', cls:''};
  const n = dayDiff(dl, now);
  if (n === 0) return {text:'closes today', cls:'soon'};
  if (n === 1) return {text:'closes tomorrow', cls:'soon'};
  if (n <= 7) return {text:'closes in '+n+' days', cls:'soon'};
  return {text:'closes '+dm(dl), cls:''};
}
function statusTag(it, now){
  if (it.dateConfirmed === false) return {text:'date not confirmed', cls:'dashed'};
  const d = deadlineTag(it.dl, now);
  if (d) return d;
  if (isLive(it, now)) return {text:'on now', cls:'go'};
  if (it.kind === 'window') return {text:'deadline: end of window', cls:''};
  return {text:'no deadline stated', cls:''};
}
function eligTag(it){
  const c = settings.campus;

}

    (!S.org || it.org === S.org));
}

/* ---------- registered ticks: this browser when signed out, the account when signed in ---------- */
async function refreshTicks(saveError){
  const run = ++refreshRun;
  const stale = () => run !== refreshRun;
  let nextError = saveError || '';

  if (account){
    if (!window.MYCSD_EVENT_REGISTRATIONS){
      if (stale()) return;
      ticks = {};
      tickError = nextError || 'Could not reach tick storage. Reload the page.';
      render();
      return;
    }

    const api = window.MYCSD_EVENT_REGISTRATIONS;
    const local = readLocalTicks();
    const known = [];
    const unknown = [];
    Object.keys(local).forEach(id => (ITEM_IDS.has(id) ? known : unknown).push(id));

    if (unknown.length){
      console.warn('Dropped saved tick IDs that are not in this page\'s event data: ' + unknown.join(', '));
      dropLocalTicks(unknown);
    }

    let uploadFailed = false;
    if (known.length){
      try {
        await api.addRegistered(known);
        dropLocalTicks(known);
      } catch (err) {
        uploadFailed = true;
        console.error(err);
      }
    }

    let loaded;
    try {
      loaded = ticksFromSet(await api.loadRegistered());
    } catch (err) {
      if (stale()) return;
      console.error(err);
      ticks = uploadFailed ? readLocalTicks() : {};
      tickError = 'Could not load the ticks saved to your account. Check your connection, then reload.';
      render();
      return;
    }
    if (stale()) return;

    ticks = loaded;
    if (uploadFailed){
      Object.keys(readLocalTicks()).forEach(id => { ticks[id] = 1; });
      if (!nextError) nextError = 'Some ticks are still only in this browser because they could not be uploaded. They will try again on the next reload.';
    }
  } else {
    ticks = readLocalTicks();
  }

  if (stale()) return;
  tickError = nextError;
  render();
}

function applyTick(it, checked){
  refreshRun++;
  tickError = '';
  if (checked) ticks[it.id] = 1; else delete ticks[it.id];
  if (account) dropLocalTicks([it.id]);
  render();
  let write;
  if (account){
    write = window.MYCSD_EVENT_REGISTRATIONS
      ? window.MYCSD_EVENT_REGISTRATIONS.setRegistered(it.id, checked)
      : Promise.reject(new Error('The registration API did not load.'));
  } else {
    write = Promise.resolve().then(() => {
      if (!saveLocalTicks()) throw new Error('This browser is blocking storage.');
    });
  }
  write.catch(err => {
    console.error(err);
    refreshTicks(account
      ? 'Could not save that tick to your account. Check your connection and try again.'
      : 'Could not save that tick in this browser. Check your browser settings.');
  });
}

async function clearAllTicks(){
  refreshRun++;
  const ids = Object.keys(ticks);
  if (!ids.length || clearing) return;
  const question = account
    ? 'Remove all registered ticks from your account?'
    : 'Remove all registered ticks from this browser?';
  if (!confirm(question)) return;

  clearing = true;
  tickError = '';
  ticks = {};
  if (account) clearLocalTicks();
  render();

  if (account){
    let clearError = '';
    try {
      await window.MYCSD_EVENT_REGISTRATIONS.removeRegistered(ids);
    } catch (err) {
      console.error(err);
      clearError = 'Could not remove every tick from your account. Check your connection and try again.';
    }
    clearing = false;
    await refreshTicks(clearError);
    return;
  }

  if (!saveLocalTicks()) tickError = 'Could not clear ticks because this browser blocks saving.';
  clearing = false;
  render();
}
