kplace? 💼 Join us for *“Hired for Your Voice”*, an insightful session designed to help students understand the importance of communication, confidence, and effective speaking skills in today's professional world.\n\n🌟 Featuring *Nor Amierul Hafizie bin Nor Hasim*, a USM Debater, as our Speaker of the Day! Discover how strong communication skills can enhance your employability and prepare you for future career opportunities.\n\n📌 *EVENT DETAILS*\n📅 Date: 11 November 2026 (Wednesday)\n⏰ Time: 8:00 PM – 10:00 PM\n💻 Venue: Webex (Online)\n\n💰 *REGISTRATION FEES*\n- 👤 Ahli (Member): RM1\n- 👥 Bukan Ahli (Non-Member): RM2\n\n\n🔗Link here: https://docs.google.com/forms/d/e/1FAIpQLSdDItde5Yj3aivT4-X1feMN-rwhbOTGDE9pqmiEo3iVSHShwQ/viewform\n\n📞 *For further enquiries, please contact:*\nYing Yin: +60 12-5607909 tel:12-5607909\n\n✨ Register now and let your voice make a difference!","nPosts":2,"org":"KDPA (inferred from the contact, Ying Yin)","orgHow":"hashtag"},{"id":"freespeech","title":"Shut Your ### Mouth!! Why Freedom of Speech Needs the Speech That We Hate","cat":"talk","start":"2026-11-18T20:00+08:00","end":"2026-11-18T22:00+08:00","where":"Webex (online)","mode":"online","fee":"RM1 members / RM2 non-members","points":"MyCSD PROVIDED","desc":"Talk on freedom of speech and censorship.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLScPKjSKJVjOhFOabOURcfuDJ2T_vztsM7jYKlQkOyidQdidXg/viewform"}],"flags":[{"t":"missing","text":"Organiser not named. Speaker details are not in the export (the post has them in an image or a cut line)."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:16","sender":"UMisOne","orig":null,"msg":44410,"snippet":"🔥 SHUT YOUR ### MOUTH!! Why Freedom of Speech Needs the Speech That We Hate"}],"text":"🔥 SHUT YOUR ### MOUTH!! Why Freedom of Speech Needs the Speech That We Hate\n\nDo we really believe in freedom of speech if we only support opinions we agree with? 🤔\n\nJoin us for an engaging session exploring freedom of speech, censorship, and why even speech we disagree with deserves to be heard! 🗣️\n\n🎤 SPEAKER OF THE DAY\nMuhammad Faiez Danieall bin Mohamad Farid\n\n🏆 Speaker's Qualification:\nSIBOL Champion – Kamalig Novice Asian Parliamentary Debate (KNAP4), Philippines.\n\n📅 Date: 18 November 2026 (Wednesday)\n⏰ Time: 8:00 PM – 10:00 PM\n📍 Venue: Webex (Online)\n\n💰 Registration Fee:\n• Members: RM1\n• Non-Members: RM2\n\n📢 MyCSD PROVIDED 📢 \n\n📝 Register Here:\nhttps://docs.google.com/forms/d/e/1FAIpQLScPKjSKJVjOhFOabOURcfuDJ2T_vztsM7jYKlQkOyidQdidXg/viewform\n\n📞 For further information:\n Ying Yin – +60 12-5607909 tel:12-5607909\n\nYou can also scan the QR code on the poster to register!\n\nDon't miss out on this opportunity to challenge your perspectives, question ideas, and explore the true meaning of freedom of speech! ✊","nPosts":1,"org":"KDPA (inferred from the fee format)","orgHow":"hashtag"},{"id":"realscam","title":"Real or Scam? Online Talk","cat":"talk","start":"2026-12-04T20:00+08:00","end":"2026-12-04T22:00+08:00","where":"Webex (online)","mode":"online","fee":"Member RM1 / non-member RM2","points":null,"desc":"Talk by Prof. Madya Ts. Dr. Mohd Najwadi bin Yusoff on spotting scams.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/ZRftAMTCexrzLVGUA"}],"flags":[{"t":"missing","text":"The post never mentions myCSD, and the organiser is not named."}],"notes":["The post mentions a referral code (\"11\")."],"sources":[{"role":"first","ts":"2026-11-17 08:15","sender":"UMisOne","orig":null,"msg":44405,"snippet":"🚨 *REAL OR SCAM? – ONLINE TALK 🔍*"},{"role":"latest","ts":"2026-11-19 13:36","sender":"UMisOne","orig":null,"msg":44467,"snippet":"🚨 *REAL OR SCAM? – ONLINE TALK 🔍*"}],"text":"🚨 *REAL OR SCAM? – ONLINE TALK 🔍*\n\nEver received a suspicious call or message and wondered, “Is this real or just another scam?” 👀\n\nJoin us for “REAL OR SCAM?”, an insightful online talk designed to raise awareness about online scams, fraudulent calls, and the importance of staying safe in today’s digital world.\n\n🎤 Featuring Prof. Madya Ts. Dr. Mohd Najwadi bin Yusoff as our invited speaker\n\n📌 EVENT DETAILS\n\n📅 Date: 4 December 2026 (Friday)\n\n⏰ Time: 8:00 PM – 10:00 PM\n\n💻 Platform: Online (WEBEX)\n\n💰 REGISTRATION FEE\n\n👤 Member: RM1\n\n👥 Non-Member: RM2\n\n🔗Link Here : \nhttps://forms.gle/ZRftAMTCexrzLVGUA\n\n*REFERRAL CODE* : 11\n🚨 Think before you click. Verify before you trust!\n\n📞 For further enquiries, please contact:\nHana: +60 17-298 2149\n\n📲 Register now and be part of REAL OR SCAM?","nPosts":3},{"id":"strength","title":"Celebrating Strength, Inspiring Change","cat":"talk","start":"2026-11-16T19:45+08:00","end":"2026-11-16T21:30+08:00","where":"Cisco Webex","mode":"online","fee":"RM1.00","points":"National MyCSD Provided!","desc":"Session built around people's stories of strength and change.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/vPgyGPfyzuTuhHLe7"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-08 19:44","sender":"UMisOne","orig":null,"msg":44275,"snippet":"[ ✨ CELEBRATING STRENGTH, INSPIRING CHANGE!🎤🌟 ] "},{"role":"latest","ts":"2026-11-13 20:16","sender":"UMisOne","orig":null,"msg":44381,"snippet":"[ ✨ CELEBRATING STRENGTH, INSPIRING CHANGE!🎤🌟 ] "}],"text":"[ ✨ CELEBRATING STRENGTH, INSPIRING CHANGE!🎤🌟 ] \n\nEvery talent has a story, and every story has the power to inspire. Join us for an exciting online talk as we explore the beauty of talent, the courage to express ourselves, and the strength to inspire positive change! 💫\n\nWhether you're passionate about performing, discovering hidden talents, or simply looking for a little inspiration, this session is for you!\n\n📅 Date: 16th November 2026 (Monday)  \n⏰ Time: 7:45 PM – 9:30 PM  \n💻 Platform: Cisco Webex  \n💰 Fee: RM1.00  \n🏅 National MyCSD Provided!\n\n🔗 REGISTER HERE :\nhttps://forms.gle/vPgyGPfyzuTuhHLe7\n\n🎟️ Don't miss out! Scan the QR code on the poster to register and be part of this inspiring session.\n\nLet your talent shine, your confidence grow, and your story inspire! ✨\n\n#TalentShow\n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":4,"org":"SSI USM (from hashtag)","orgHow":"hashtag"},{"id":"transfusion","title":"Transfusion Reactions: Recognising, Managing and Preventing","cat":"talk","start":"2026-11-27T19:00+08:00","end":"2026-11-27T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":"National MyCSD Provided!","desc":"Talk on transfusion reactions (part of MedHealth 8.0).","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/YFkU2rvmX9DthDeY9"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-08 19:44","sender":"UMisOne","orig":null,"msg":44274,"snippet":"〘Transfusion Reactions – Recognising, Managing and Preventing 🩸〙"},{"role":"latest","ts":"2026-11-13 20:16","sender":"UMisOne","orig":null,"msg":44382,"snippet":"〘Transfusion Reactions – Recognising, Managing and Preventing 🩸〙"}],"text":"〘Transfusion Reactions – Recognising, Managing and Preventing 🩸〙\n\n🩸 WHEN A LIFE-SAVING TRANSFUSION TAKES A WRONG TURN, WHAT HAPPENS NEXT? \n\nBlood transfusions play a crucial role in saving lives, but they are not without risks. Understanding transfusion reactions is essential in ensuring patient safety and preventing potentially serious complications. 🩺\n\nJoin us for our Online Talk 3, where we explore how transfusion reactions occur, how to recognise their warning signs, and the appropriate approaches to managing and preventing them.\n\n📅 Date: 27th November 2026 (Friday)\n⏰ Time: 7.00 PM – 10.00 PM\n💻 Platform: Cisco Webex\n💰 Registration Fee: RM1\n\n🏅 National MyCSD Provided! \n\n🧷 REGISTER HERE: \nhttps://forms.gle/YFkU2rvmX9DthDeY9\n\nDon't miss this opportunity to expand your knowledge and strengthen your understanding of transfusion safety. Every bit of knowledge counts when a patient's life is at stake! ❤️\n\nSee you there! 🫶🏻\n\n#MedHealth8.0\n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":2,"org":"SSI USM (from hashtag)","orgHow":"hashtag"},{"id":"beyondgender","title":"Episode 1: Beyond Gender, Redefining Women's Empowerment","cat":"talk","start":"2026-11-15T20:00+08:00","end":"2026-11-15T22:00+08:00","where":"Webex (online)","mode":"online","fee":"RM1","points":"MyCSD points provided!","desc":"Talk on what women's empowerment means.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/UYNrrALVtagqxAmb9"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-04 08:12","sender":"UMisOne","orig":null,"msg":44202,"snippet":"〘 💭 EPISODE 1: BEYOND GENDER — REDEFINING WOMEN’S EMPOWERMENT✨ 〙"},{"role":"latest","ts":"2026-11-13 20:16","sender":"UMisOne","orig":null,"msg":44383,"snippet":"〘 💭 EPISODE 1: BEYOND GENDER — REDEFINING WOMEN’S EMPOWERMENT✨ 〙"}],"text":"〘 💭 EPISODE 1: BEYOND GENDER — REDEFINING WOMEN’S EMPOWERMENT✨ 〙\n\nWhat does women’s empowerment truly mean? Is it just about success, or is it about breaking stereotypes, challenging barriers, and creating equal opportunities for everyone? 👀\n\nWe explore how gender expectations shape our choices and opportunities, and discover how we can build a society where women are respected, heard, and empowered to thrive. ❤️‍🔥\n\n🎤 WHO’S LEADING THE CONVERSATION? 👀 \n\nMeet Kiraanjeet Subramaniam,  MPP Kebajikan dan Kesihatan! Get ready for fresh perspectives and a thought-provoking discussion that challenges how we see women’s empowerment. 🔥\n\n📅 Date: 15 November 2026 (Sunday)\n⏰ Time: 8.00 PM – 10.00 PM\n💻 Platform: via Webex\n💰 Fee: RM1\n🎓 MyCSD points provided!\n\n🔗 Register now:  https://forms.gle/UYNrrALVtagqxAmb9\n\n*For any enquiries:* \n📞Thureshnia A/P Selvam (Project Director)\nhttps://wa.me/601133773684\n\n📞Pavanasutha Srilaxsmi (Secretary)\nhttps://wa.me/601161417956\n\n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":4,"org":"SSI USM (from hashtag)","orgHow":"hashtag"},{"id":"voiceless","title":"Paws & Promises: Voices for the Voiceless","cat":"talk","start":"2026-11-25T20:00+08:00","end":"2026-11-25T22:00+08:00","where":"Cisco Webex (online)","mode":"online","fee":"RM1","points":"MYCSD Points Provided","desc":"Talk by Mr. Navwinderan (President of Pawtarian) on the challenges faced by strays.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/QsbBPPPv9BFB4b5K9"}],"flags":[],"notes":["The post also says to scan the QR code."],"sources":[{"role":"first","ts":"2026-11-13 19:55","sender":"UMisOne","orig":null,"msg":44342,"snippet":"🐾🗣️〘 Paws & Promises : Voices for the Voiceless 🐶〙🗣️🐾"},{"role":"latest","ts":"2026-11-19 13:35","sender":"UMisOne","orig":null,"msg":44458,"snippet":"🐾🗣️〘 Paws & Promises : Voices for the Voiceless 🐶〙🗣️🐾"}],"text":"🐾🗣️〘 Paws & Promises : Voices for the Voiceless 🐶〙🗣️🐾\n\nWant to understand the challenges faced by strays and learn the core principles of animal welfare? 🐾💕 Join us for Voices for the Voiceless, an insightful online talk dedicated to spreading awareness for our furry friends!\n\nWe are honored to have a special sharing session by Mr. Navwinderan, President of Pawtarian, who will guide us in understanding how we can better advocate for animal welfare.\n\n🐾 Talk Details 🐾\n📅 Date : 25th November 2026 \n⏰ Time : 8 PM – 10 PM\n💻 Platform : Cisco Webex (Online)\n🗣️ Speaker : Mr. Navwinderan (President of Pawtarian)\n💰 Participation Fee : RM1\n🎓 MYCSD Points Provided\n🔗 https://forms.gle/QsbBPPPv9BFB4b5K9\n\n🐕 Scan the QR code on the poster to register and secure your spot!\n\nFor more information, kindly contact :\n👤 Paveethra (Vice Project Director) : 019-7622951 tel:019-7622951\n👤 Uvanie (HOD of Participant Management) : 010-2542916 tel:010-2542916\n\n#Paws&Promises \n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":3,"org":"SSI USM (from hashtag)","orgHow":"hashtag"},{"id":"baktiw3","title":"Baktisiswa Webinar 3: Dear Self, Take a Breath","cat":"talk","start":"2026-11-24T20:00+08:00","end":"2026-11-24T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":"MYCSD provided!","desc":"Mental wellbeing session with Puan Fauziah Binti Abdullah (USM psychology officer).","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/xcYF47a291GSGTsi6"}],"flags":[],"notes":["The post also says to scan the QR code."],"sources":[{"role":"first","ts":"2026-11-13 19:59","sender":"UMisOne","orig":null,"msg":44350,"snippet":"[WEBINAR 3 BAKTISISWA: DEAR SELF, TAKE A BREATH: UNDERSTANDING YOUR MENTAL HEALTH] 🌿"},{"role":"latest","ts":"2026-11-19 13:39","sender":"UMisOne","orig":null,"msg":44492,"snippet":"[WEBINAR 3 BAKTISISWA: DEAR SELF, TAKE A BREATH: UNDERSTANDING YOUR MENTAL HEALTH] 🌿"}],"text":"[WEBINAR 3 BAKTISISWA: DEAR SELF, TAKE A BREATH: UNDERSTANDING YOUR MENTAL HEALTH] 🌿\n\nLife can get overwhelming with deadlines, assignments and daily responsibilities. Sometimes, we forget to pause and take care of ourselves. 🤍\n\nJoin us for an insightful sharing session on mental wellbeing, stress management and self-care!\n\n🗓 24 November 2026 (Tuesday) \n⏰ 8:00 PM – 10:00 PM\n📍 Online (Cisco Webex) \n💰 RM1 only! \n✨ MYCSD provided!\n\nWe are delighted to welcome Puan Fauziah Binti Abdullah, Pegawai Psikologi Kanan BHEPA USM, as our speaker.\n\nReady to take a breather? Register now by scanning the QR code or clicking the link below!\n🔗https://forms.gle/xcYF47a291GSGTsi6\n\nFor inquiries: \n📞 Raihana: 016-2004540 tel:016-2004540 \n📞 Aeidil: 017-9026297 tel:017-9026297\n\nTake a pause, care for your mind and join us! See you there! 🧠✨\n\n#Webinar3Baktisiswa #PersatuanSainsFarmasiUSM","nPosts":4,"org":"Persatuan Sains Farmasi USM (from hashtag)","orgHow":"hashtag"},{"id":"raid","title":"Webinar 3: The Stories Behind the Raid (Inside Pharmaceutical Enforcement)","cat":"talk","start":"2026-11-19T20:00+08:00","end":"2026-11-19T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM2","points":"National MyCSD provided","desc":"Webinar on pharmaceutical enforcement. Open to everyone.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"\"Open to everyone!\""},"forms":[{"label":"Register","url":"https://forms.gle/opG6PAUcKKm1iPpz7"}],"flags":[{"t":"correction","text":"The first post (10 Nov) said \"MyCSD will be provided\". Posts from 17 Nov say \"National Level MyCSD\", which is used here."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-10 15:10","sender":"UMisOne","orig":null,"msg":44331,"snippet":"[Webinar 3 – “The Stories Behind the Raid: Inside Pharmaceutical Enforcement”] 🚨💊🔍"}],"text":"[Webinar 3 – “The Stories Behind the Raid: Inside Pharmaceutical Enforcement”] 🚨💊🔍\n\nEver wondered what happens behind a pharmaceutical enforcement raid? 🚔 Join us for an insightful webinar with Ms Teh Xizhou (Pharmacist, Investigation & Prosecution Section) as she shares behind-the-scenes experiences, challenges, and insights into pharmaceutical enforcement and its role in protecting public health! ⚖️💊\n\n📅 *Date:* 19 November 2026 (Thursday)\n⏰ *Time:* 8:00 PM – 10:00 PM\n💻 *Platform:* Cisco Webex\n💰 *Registration Fee:* RM2 only!\n\n🔗 *Register Now:* https://forms.gle/opG6PAUcKKm1iPpz7\n\n📞 *Inquiries:* Yan Ni (016-374 3761) | Magdalene (011-1601 6554)\n\n🎉 MyCSD will be provided!\n\n📢 Open to everyone! Don’t miss this opportunity to explore the world of pharmaceutical enforcement beyond the classroom. Secure your spot today! 🚨✨\n\n#USMLawatanAkademik2627 #Webinar3 #PharmaceuticalEnforcement #BehindTheRaid #MedicationSafety #PublicHealth #Pharmacy","nPosts":1,"org":"USM Lawatan Akademik 26/27 (from hashtag)","orgHow":"hashtag"},{"id":"viruses","title":"Webinar 4: Know Your Enemy: World of Viruses","cat":"talk","start":"2026-12-01T20:00+08:00","end":"2026-12-01T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM2","points":"MyCSD will be provided!","desc":"Webinar with Assoc. Prof. Dr. Sabariah Noor Harun on viruses.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/8eZsdRDnRev3piHm7"}],"flags":[{"t":"note","text":"The post names no organiser. It follows the Pharmnight webinar series (Webinar 3 was Sleep Is Your Superpower)."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-13 19:56","sender":"UMisOne","orig":null,"msg":44346,"snippet":"🦠Webinar 4 – Know Your Enemy: World of Viruses 🧬"}],"text":"🦠Webinar 4 – Know Your Enemy: World of Viruses 🧬\n\n🧑🏻‍🔬Viruses may be invisible to the naked eye, but their impact on our health can be enormous! Have you ever wondered how these tiny infectious agents invade our bodies, cause diseases, and challenge our immune system? 🦠\n\nJoin us for an insightful webinar as we explore the fascinating World of Viruses, uncovering what makes them our enemies and understanding their impact on human health! Get ready to expand your knowledge and discover more about the microscopic threats around us. 🔬\n\nEvent details\n📅 Date: 1 December 2026 (Tuesday)\n⏰ Time: 8.00 PM - 10.00 PM\n💻 Platform: Cisco Webex\n🎟️ Registration fee: RM 2\n👩🏻‍🏫 Speaker: Assoc. Prof. Dr. Sabariah Noor Harun\n\n🌟MyCSD will be provided!🌟\n\n🔗Registration link: https://forms.gle/8eZsdRDnRev3piHm7\n\nKnow your enemy, protect yourself! 🦠🛡️\n\nAny inquiries\n📞Ilyas (019-769 7487)\n📞Syahir (018-910 2640)","nPosts":1,"org":"Pharmnight 26/27 (from the webinar series)","orgHow":"hashtag"},{"id":"hopew4","title":"HOPE Webinar 4: Scroll Less, Sleep More","cat":"talk","start":"2026-12-05T20:00+08:00","end":"2026-12-05T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":null,"desc":"Webinar by Puan Anis Natasha Binti Zulkifli (USM counselling unit) on screen time and sleep.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLScueFRQH6obfA0cE75lXyLMCI0DNi5d-YKoA3D9X1D_KlrmOA/viewform"}],"flags":[{"t":"missing","text":"The post does not mention myCSD (the earlier HOPE webinars did)."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:24","sender":"UMisOne","orig":null,"msg":44428,"snippet":"🌙📱 HOPE 26/27 WEBINAR 4: SCROLL LESS, SLEEP MORE: EASY STEPS TO TAME SCREEN TIME AND SLEEP DEEPER 💤✨"},{"role":"latest","ts":"2026-11-19 13:36","sender":"UMisOne","orig":null,"msg":44464,"snippet":"🌙📱 HOPE 26/27 WEBINAR 4: SCROLL LESS, SLEEP MORE: EASY STEPS TO TAME SCREEN TIME AND SLEEP DEEPER 💤✨"}],"text":"🌙📱 HOPE 26/27 WEBINAR 4: SCROLL LESS, SLEEP MORE: EASY STEPS TO TAME SCREEN TIME AND SLEEP DEEPER 💤✨\n\nDo you often find yourself scrolling endlessly on your phone before bedtime? 📱 Join us for an insightful webinar where we explore practical ways to manage screen time, build healthier digital habits, and improve your sleep quality.\n\n🎤 Speaker: Puan Anis Natasha Binti Zulkifli, Pegawai Psikologi, Unit Kaunseling USM\n\n📅 Date: 5 Disember 2026 (Saturday)\n⏰ Time: 8.00 p.m. – 10.00 p.m.\n💻 Platform: Cisco Webex\n💵 Registration Fee: RM1\n\n🔗 Register Now: https://docs.google.com/forms/d/e/1FAIpQLScueFRQH6obfA0cE75lXyLMCI0DNi5d-YKoA3D9X1D_KlrmOA/viewform \n\n📞 Any Inquiries:\nCalista Chee Jing Yu: 018-313 9834\nSia Kai Xian: 016-727 4633\n\nDon’t miss out! Join us to take the first step towards healthier screen habits and better sleep. 🌙\n\n#HOPE2627\n#HealthOutreachProgramme\n#ScrollLessSleepMore\n#HealthySleepHabits\n#USMPharmacy\n#PSF","nPosts":2,"org":"HOPE 26/27","orgHow":"stated"},{"id":"pccw2","title":"PCC Webinar 2: Decentralized Health (Blockchain, Smart Contracts and Medical Integrity)","cat":"talk","start":"2026-11-23T20:00+08:00","end":"2026-11-23T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":null,"desc":"Webinar by Mr. Jason Low.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/M3Ck9cQSuMkjDWrW7"}],"flags":[{"t":"missing","text":"The post does not mention myCSD."}],"notes":["The post also says to scan the QR code."],"sources":[{"role":"first","ts":"2026-11-10 15:07","sender":"UMisOne","orig":null,"msg":44307,"snippet":"📢PCC WEBINAR 2 - Decentralized Health: Foundations of Blockchain, Smart Contracts and Medical Integrity🔗💊"}],"text":"📢PCC WEBINAR 2 - Decentralized Health: Foundations of Blockchain, Smart Contracts and Medical Integrity🔗💊\n\nEver wondered how blockchain technology can transform the future of healthcare and pharmacy?🏥🔐\n\nFrom patient records to pharmaceutical supply chains, discover how digital technology can support greater transparency, data integrity and trust in the healthcare system! 🔗🧪\n\n🎙️ Speaker: Mr. Jason Low \n📅 Date: 23 November 2026 (Monday)\n🕗 Time: 8:00 p.m. - 10:00 p.m.\n💻 Platform: Cisco Webex\n💰 Registration Fee: RM1\n\n📌 Register now at: https://forms.gle/M3Ck9cQSuMkjDWrW7\nor\n📲 Scan the QR code on the poster to register!\n\nDon't miss this opportunity to expand your knowledge of emerging digital technologies and explore how blockchain can shape a more secure, transparent and trustworthy future for healthcare and pharmacy!🚀💊\n\nFor inquiries:\n📞 Lee Ping Sean: +6017 865 7161 \n📞 Daryl Lim: +6010 398 9422 \n\nFor updates and announcements, follow👉 @pcc2627 https://t.me/pcc2627.usm on Instagram!🔥\n#PCC2627\n#BlockchainInHealthcare\n#DigitalHealth","nPosts":1,"org":"PCC 26/27 (from hashtag)","orgHow":"hashtag"},{"id":"aiaction","title":"AI in Action: Practical Applications of AI in Everyday Life and Engineering","cat":"talk","start":"2026-11-27T20:00+08:00","end":"2026-11-27T22:00+08:00","where":"Cisco Webex Meeting","mode":"online","fee":"RM2","points":"MyCSD is provided!","desc":"Talk by Muhammad Nasir bin Amin (AI practitioner and educator).","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/zPVwaJvrhka7qkqm8"}],"flags":[{"t":"missing","text":"The organiser is not named."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-08 19:43","sender":"UMisOne","orig":null,"msg":44270,"snippet":"📢 AI IN ACTION: EXPLORING PRACTICAL APPLICATIONS OF ARTIFICIAL INTELLIGENCE IN EVERYDAY LIFE AND ENGINEERING"},{"role":"latest","ts":"2026-11-19 13:34","sender":"UMisOne","orig":null,"msg":44453,"snippet":"📢 AI IN ACTION: EXPLORING PRACTICAL APPLICATIONS OF ARTIFICIAL INTELLIGENCE IN EVERYDAY LIFE AND ENGINEERING"}],"text":"📢 AI IN ACTION: EXPLORING PRACTICAL APPLICATIONS OF ARTIFICIAL INTELLIGENCE IN EVERYDAY LIFE AND ENGINEERING\n\nCurious about AI and its real-world applications? 🤔\n\nJoin us to explore how AI works and its potential to shape our future!\n\n🗣 Speaker: Muhammad Nasir bin Amin\n(Education Entrepreneur, Digital Content Creator & AI Practitioner with over 20 years of professional experience)\n\n📅 Date: 27 November 2026\n⏰ Time: 8:00 PM – 10:00 PM\n📍 Platform: Cisco Webex Meeting\n💵 Registration Fee: RM 2\n🌟 Benefits: MyCSD is provided!\n\n🔗 Registration Form:\nhttps://forms.gle/zPVwaJvrhka7qkqm8\n\nfor any enquiries: \n011-12452487 tel:011-12452487 (Darwish)\n011-14075579 tel:011-14075579 (Syifa)","nPosts":4},{"id":"coffeetalk","title":"Coffee Talk 2026: From Earth, To Innovation","cat":"talk","start":"2026-11-20T14:30+08:00","end":"2026-11-20T16:30+08:00","where":"Webex (online)","mode":"online","fee":"Free","points":"MYCSD points provided!","desc":"Talk on innovation and a more sustainable future.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/kBiEd92YcA2xC7Hj6"}],"flags":[{"t":"missing","text":"The organiser is not named."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:29","sender":"UMisOne","orig":null,"msg":44448,"snippet":"🌍✨*COFFEE TALK 2026*✨🌱"}],"text":"🌍✨*COFFEE TALK 2026*✨🌱\n\n*FROM EARTH, TO INNOVATION: BUILDING THE FUTURE*\n\nAssalamualaikum dan salam sejahtera! 💚\n\nAdakah anda bersedia untuk meneroka dunia inovasi dan mencipta masa depan yang lebih baik?\n\nJom sertai kami dalam *COFFEE TALK* yang membawa tema *\"From Earth, To Innovation: Building the Future\"*🌱✨\n\nProgram ini bertujuan untuk membuka peluang kepada para peserta meneroka idea kreatif, mengembangkan pengetahuan serta memahami bagaimana inovasi mampu membentuk masa depan yang lebih lestari.\n\n📌 *MAKLUMAT PROGRAM*\n\n📅 Tarikh: 20 NOVEMBER 2026\n⏰ Masa: 2.30 PM - 4.30 PM\n📍 Tempat: WEBEX\n💰 Yuran penyertaan: PERCUMA\n\n🎁  MYCSD points provided!\n\n📲 *DAFTAR SEKARANG!*\nhttps://forms.gle/kBiEd92YcA2xC7Hj6\n\n💡 Jangan lepaskan peluang untuk menjadi sebahagian daripada generasi yang membawa perubahan melalui inovasi!\n\n📲 *SEBARANG PERTANYAAN BOLEH HUBUNGI:*\n019-673 7379 - OOI YI ZYNN\n017-207 8203 - ALEXSON","nPosts":1},{"id":"physicscoffee","title":"Physics Coffee Talk: Can AI Discover Things About the Universe That Humans Can't?","cat":"talk","start":"2026-11-24T20:30+08:00","end":"2026-11-24T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":"MYCSD points provided!","desc":"Talk by Dr. John Soo Yue Han (School of Physics).","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/MX1AiMMBjzseJWtN7"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:25","sender":"UMisOne","orig":null,"msg":44431,"snippet":"☕ PHYSICS COFFEE TALK | CAN AI DISCOVER THINGS ABOUT THE UNIVERSE THAT HUMANS CAN'T?🌌"}],"text":"☕ PHYSICS COFFEE TALK | CAN AI DISCOVER THINGS ABOUT THE UNIVERSE THAT HUMANS CAN'T?🌌\n\nCan artificial intelligence uncover the mysteries of the universe beyond the limits of human understanding? 🤔✨\n\nJoin us for an insightful Physics Coffee Talk with Dr. John Soo Yue Han, Senior Lecturer from the School of Physics, as we explore the possibilities of AI in uncovering discoveries that may go beyond human capabilities. 🧠🔭\n\nWhether you're a physics enthusiast, an AI enthusiast, or simply curious about the mysteries of the universe, this is a conversation you won't want to miss!\n\n📌 PROGRAMME DETAILS\n\n📅 Date: 24 November 2026 (Tuesday)\n⏰ Time: 8.30 PM – 10.00 PM\n💻 Platform: Cisco Webex\n💰 Fee: RM1\n🎓 MYCSD points provided!\n\n🔗 https://forms.gle/MX1AiMMBjzseJWtN7\n\nFor further enquiries, feel free to contact:\n📞 Anisah: 012-391 2421\n📞 Yusuff: 011-1780 4034\n\nLet's grab a cup of knowledge and explore the universe, one question at a time! ☕🌌\n\n#PSFUSM\n#FamilyPhysics2627\n#PhysicsCoffeeTalk","nPosts":1,"org":"PSF USM (from earlier Physics Coffee Talks)","orgHow":"hashtag"},{"id":"langscience","title":"The Language of Science: Online Talk","cat":"talk","start":"2026-11-25T20:00+08:00","end":"2026-11-25T22:00+08:00","where":"Webex","mode":"online","fee":"RM1","points":"MyCSD points will be provided!","desc":"Talk by Dr. Sivakumar.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLScrOYPtyom0D-SAN6xah6PHYazcOZdF7XoJeVpAEtcxgfnItQ/viewform"}],"flags":[{"t":"missing","text":"The organiser is not named."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-19 13:35","sender":"UMisOne","orig":null,"msg":44454,"snippet":"📚🔬[The Language of Science – Online Talk]🔬📚"}],"text":"📚🔬[The Language of Science – Online Talk]🔬📚\n\n🎙️ AN EXCLUSIVE ONLINE TALK IS COMING YOUR WAY!\n\nEver wondered how language and science come together? 🌟\n\nJoin us for an insightful online talk, The Language of Science, featuring our distinguished speaker, Dr. Sivakumar!\n\nExpand your knowledge, gain new perspectives and discover the fascinating connection between language and science. Don't miss this opportunity to learn something new! 🧠✨\n\n📅 Date: 25 November 2026 (Wednesday)\n⏰ Time: 8.00 PM – 10.00 PM\n💻 Platform: Webex\n💰 Registration Fee: RM1 only\n\n🎓 MyCSD points will be provided! ✨\n\nDon't miss out on this exciting opportunity! Register now! 👀\n\n📲 Scan the QR code on the poster to register!\nhttps://docs.google.com/forms/d/e/1FAIpQLScrOYPtyom0D-SAN6xah6PHYazcOZdF7XoJeVpAEtcxgfnItQ/viewform\n\n#Yatra\n#TheLanguageOfScience\n#OnlineTalk\n#USM\n#MyCSD\n#BHEPAUSM\n#APEXUSM","nPosts":1},{"id":"sensability","title":"Navigating Your Finances through Sens-Ability","cat":"talk","start":"2026-11-24T20:00+08:00","end":"2026-11-24T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1 members / RM2 non-members","points":"MyCSD Provided","desc":"Talk by Charaka Vimukthhi on financial and investment literacy.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/T8Z2zdktygJh79rC7"}],"flags":[{"t":"note","text":"The organiser is not named. One contact (Lim Kah Hao) also appears on BYIC USM posts."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:25","sender":"UMisOne","orig":null,"msg":44435,"snippet":"Are you ready to take control of your financial future? 💼"}],"text":"Are you ready to take control of your financial future? 💼\n\nWe are thrilled to invite you to our upcoming talk, *\"Navigating Your Finances: Exploring Financial and Investment Literacy through Sens-Ability.\"* \n\nWhether you are a student just starting to budget your allowance, a young professional looking to grow your savings, or simply someone curious about how the financial markets work, this session is designed for you.\n\nWe are honored to have *Charaka Vimukthhi* as our distinguished speaker to break down complex financial concepts into practical, easy-to-understand strategies. \n\n🗓️ Date: 24th November 2026 (Tue)\n⏰ Time: 8:00 PM – 10:00 PM\n💻 Platform: Cisco Webex\n🎟️ Fees: RM1 for Members\n                 RM2 for Non-Members \n🔗 Register Here: https://forms.gle/T8Z2zdktygJh79rC7\n📌 MyCSD Provided\ ded!*\n\n📌 *REGISTER NOW!*\nhttps://forms.gle/P289KRA2fD1MAYQ77\n\n📞 For any inquiries, please contact:\nIntisar: +60 16‐637 7844","nPosts":1},{"id":"rakanmuda","title":"Rakan Muda: Bicara Anugerah Remaja Perdana 9.0","cat":"talk","start":"2026-11-22T20:00+08:00","end":"2026-11-22T23:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1 SRMUSM members / RM2 non-members","points":"MYCSD PERINGKAT NEGERI DISEDIAKAN","desc":"Sharing on the Anugerah Remaja Perdana Rakan Muda award, theme \"Belia Diperkasa, Masa Depan Terbina\".","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/HYAubC2VwpH6eChp7"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-19 13:39","sender":"UMisOne","orig":null,"msg":44489,"snippet":"*|SEKRETARIAT RAKAN MUDA USM 26/27|*"}],"text":"*|SEKRETARIAT RAKAN MUDA USM 26/27|*\n\nAssalamualaikum dan Salam Sejahtera 💙🤍\n\nSekretariat Rakan Muda Universiti Sains Malaysia (SRMUSM) dengan sukacitanya akan menganjurkan *Program Rakan Muda: Bicara Anugerah Remaja Perdana 9.0* yang bertemakan “Belia Diperkasa, Masa Depan Terbina”🌟\n\nButiran program adalah seperti berikut:\n\n🗓 *Tarikh/ Hari: 22 November 2026 (Ahad)*\n🏛 *Platform: _Cisco WeBex_*\n🕘 *Masa: 8:00 PM – 11:00 PM*\n\n🪩 Ingin membina keyakinan diri, mengasah kemahiran kepimpinan dan meningkatkan potensi sebagai mahasiswa/i?\n\n🪩 Ingin mengetahui lebih lanjut tentang *Anugerah Remaja Perdana Rakan Muda* serta peluang untuk menjadi sebahagian daripada program pembangunan belia ini?\n\n🌟 Ayuh sertai *Rakan Muda: Bicara Anugerah Remaja Perdana Rakan Muda 9.0* dan rebut peluang untuk mendengar perkongsian inspirasi daripada panel berpengalaman yang akan berkongsi perjalanan, pengalaman serta pencapaian mereka dalam ARPRM! ✨\n\nJangan lepaskan peluang keemasan ini! Daftar sekarang melalui pautan berikut:\n\n🔗 https://forms.gle/HYAubC2VwpH6eChp7\n\n💵 Yuran Penyertaan:\nRM1.00 (Ahli SRMUSM)\nRM2.00 (Bukan Ahli SRMUSM)\n\n!!️ MYCSD PERINGKAT NEGERI DISEDIAKAN !!️\n\n☎ Sebarang pertanyaan berkaitan program boleh hubungi:\n\n📱 011-2441 1813 (Syazarin)\n📱 010-424 8762 (Adam)\n\nSekian, terima kasih 💙🤍\n\n#TogetherWelnspireCreatingImpactAsOne\n#SRMUSM26/27\n#YakinBoleh!","nPosts":1,"org":"Sekretariat Rakan Muda USM (SRMUSM)","orgHow":"stated"},{"id":"mindmatters2","title":"Mind Matters: Memahami Stres, Membina Kesejahteraan","cat":"talk","start":"2026-11-16T20:00+08:00","end":"2026-11-16T22:00+08:00","where":"Microsoft Teams","mode":"online","fee":"RM1.00","points":"MyCSD Disediakan","desc":"Online talk on understanding stress.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSfFQafU1YYSIyZENhvADc3AeKZEp_JbtODC04tfGenVQPynfQ/viewform"}],"flags":[],"notes":["Not the same event as the PPIK \"Mind Matters\" talk on 14 Nov."],"sources":[{"role":"first","ts":"2026-11-08 19:45","sender":"UMisOne","orig":null,"msg":44282,"snippet":"🧠 *[MIND MATTERS: MEMAHAMI STRES, MEMBINA KESEJAHTERAAN]* "},{"role":"latest","ts":"2026-11-10 15:08","sender":"UMisOne","orig":null,"msg":44313,"snippet":"🧠 [MIND MATTERS: MEMAHAMI STRES, MEMBINA KESEJAHTERAAN]"}],"text":"🧠 [MIND MATTERS: MEMAHAMI STRES, MEMBINA KESEJAHTERAAN]\n\nAssalamualaikum, Salam Sejahtera dan Salam #Pahang1st 🤍🖤\n\nPernah rasa tertekan dengan tuntutan kehidupan, pelajaran atau cabaran seharian? Pernah tertanya-tanya bagaimana untuk menguruskan stres dengan baik?\n\nJom sertai *Online Talk “Mind Matters: Memahami Stres, Membina Kesejahteraan”* bersama penceramah jemputan khas kita, *Puan Faridah* 🌟\n\n\n *Butiran Program:* \n\n 📅 *Tarikh* : 16 NOVEMBER 2026 (ISNIN)\n⏰ *Masa* : 8.00 PM – 10.00 PM\n💻 *Platform* : Microsoft Team\n\n💸 *Yuran: RM 1.00 sahaja!* \n\n🏅 *MyCSD Disediakan !!️* \n\n *Pendaftaran* :\nhttps://docs.google.com/forms/d/e/1FAIpQLSfFQafU1YYSIyZENhvADc3AeKZEp_JbtODC04tfGenVQPynfQ/viewform\n\n📌 Sebarang pertanyaan, sila hubungi:\n📞 DAENG: 011-23084704 tel:011-23084704\n📞 IZZ: 010-4337828 tel:010-4337828\n\n\"Take care of your mind, and your mind will take care of you.\" 🧠💙\n\n\"KITA PERDAMA, RUMPUN PAHANG\"\n\n#KitaPERDAMA #Pahang1st\n#MindMatters #KesihatanMental #KesejahteraanDiri","nPosts":2,"org":"PERDAMA (from hashtag)","orgHow":"hashtag"},{"id":"psc-gender","title":"Pharmacy Sports Carnival 26/27: Sports & Gender Stereotypes (Break the Bias)","cat":"talk","start":"2026-11-25T20:00+08:00","end":"2026-11-25T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM 1","points":null,"desc":"Webinar on gender stereotypes in sport.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/bTsPYNwgNiumnwNd9"}],"flags":[{"t":"missing","text":"The post does not mention myCSD."}],"notes":["The post also says to scan the QR code."],"sources":[{"role":"first","ts":"2026-11-06 10:55","sender":"UMisOne","orig":null,"msg":44258,"snippet":"🎪🐻 Pharmacy Sports Carnival 26/27: Precision In The Lab, Passion In The Arena 🐻🎪"},{"role":"latest","ts":"2026-11-19 13:36","sender":"UMisOne","orig":null,"msg":44471,"snippet":"🎪🐻 Pharmacy Sports Carnival 26/27: Precision In The Lab, Passion In The Arena 🐻🎪"}],"text":"🎪🐻 Pharmacy Sports Carnival 26/27: Precision In The Lab, Passion In The Arena 🐻🎪\nSports & Gender Stereotypes- How Sport Broadcasting Reinforces Gender Stereotypes 🏸🏀\nEver wondered why male and female athletes are portrayed differently in sports media? 🤔 From the way athletes are described to the stories that receive the most attention, sport broadcasting can shape how we perceive gender in sports.🤯\n🎙️ Join us as we explore the influence of sports media, uncover gender stereotypes in broadcasting, and challenge the way athletes are represented on screen! 🏅👩🏻‍🫯‍👩🏼\nReady to see sports broadcasting from a different perspective? 😎🔥\n\n📅 Date: 25 November 2026 \n⏰ Time: 8:00 PM - 10:00 PM \n💻 Platform: Cisco Webex \n💰 Registration Fee: RM 1\n\nClick the registration link or scan the QR code in the poster! \n👉🏻 https://forms.gle/bTsPYNwgNiumnwNd9 👈🏻\n\nAny inquiries, may contact: \n📞014-5029889 tel:014-5029889 (Amirah Batrisyia) \n📞017-8240528 tel:017-8240528 (Nathanie)\n\n#GenderStereotype \n#BreakTheBias \n#PharmacySportsCarnival2627","nPosts":4,"org":"Pharmacy Sports Carnival 26/27","orgHow":"stated"},{"id":"imeche-welcome","title":"IMechE Welcoming Night 26/27","cat":"activity","start":"2026-11-11T15:00+08:00","end":"2026-11-11T17:00+08:00","where":"Mechanical School, MEK 2","mode":"in-person","fee":"Free","points":"MyCSD Provided","desc":"Meet new friends and learn what IMechE is about.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/nF48aRimYQK2RMmA9"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-08 19:45","sender":"UMisOne","orig":null,"msg":44280,"snippet":"🎉 26/27 IMechE Welcoming Night 🎉"}],"text":"🎉 26/27 IMechE Welcoming Night 🎉\n\nHey USM Engineering students! 👨‍🔧\nWho says a Welcoming Night has to happen after dark? We’re breaking tradition and bringing you an exciting afternoon! 🔥\n\nJoin us to meet new friends, discover what IMechE (Institution of Mechanical Engineers) is all about, and stand a chance to win amazing prizes! 🤯🎁\n\n📅 Date: 11 Nov 2026 (Wed)\n🕗 Time: 3:00 PM – 5:00 PM\n📍 Venue: Mechanical School, MEK 2\n\n✨ Free Entry for All and MyCSD Provided! ✨\n\nDon’t miss out! register now and kickstart your journey with IMechE using the link below\n🔗 https://forms.gle/nF48aRimYQK2RMmA9\n\n👉 Follow us for updates:\nFacebook: IMechE USM Chapter\nInstagram: @imecheusm https://t.me/imecheusm","nPosts":1,"org":"IMechE USM","orgHow":"stated"},{"id":"imeche-nsw","title":"IMechE NSW Industrial Visit","cat":"activity","start":"2026-12-09T13:30+08:00","end":"2026-12-09T16:30+08:00","where":"NSW Automation Sdn. Bhd.","mode":"in-person","fee":null,"points":"MYCSD will be provided","desc":"Industrial visit for engineering students.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/5dQmhTAu7JgLGGzL7"}],"flags":[{"t":"missing","text":"Fee not stated. The register-by date (12 Nov 2026) has passed."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-08 19:45","sender":"UMisOne","orig":null,"msg":44281,"snippet":"🏭 26/27 IMechE NSW Industrial Visit ⚙️"}],"text":"🏭 26/27 IMechE NSW Industrial Visit ⚙️\n\nHey USM Engineering students! 👨‍🔧\nReady to explore the world of industrial automation? 🚀\n\nJoin us for an exciting industrial visit to NSW Automation Sdn. Bhd. and gain valuable insights into real-world engineering applications!\n\n📅 Date: 9 December 2026 (Wednesday)\n🕜 Time: 1:30 PM – 4:30 PM\n📍 Venue: NSW Automation Sdn. Bhd.\n📌 MYCSD will be provided\n\n⏳ Registration Deadline: 12 November 2026\n\n🔗 Register Now:\nhttps://forms.gle/5dQmhTAu7JgLGGzL7\n\nDon't miss this opportunity! See you there! 🔥\n\n👉 Follow us for updates:\nFacebook: IMechE USM Chapter\nInstagram: @imecheusm https://t.me/imecheusm","nPosts":1,"org":"IMechE USM","orgHow":"stated","deadline":{"date":"2026-11-12","text":"12 Nov 2026"}},{"id":"zerobazaar","title":"Zero Burden Bazaar 2026","cat":"activity","start":"2026-11-14T09:00+08:00","end":"2026-11-14T12:00+08:00","where":"Dewan Utama Pelajar B (DUP B), USM","mode":"in-person","fee":null,"points":"MyCSD points provided!","desc":"Bazaar for pre-loved items. First 50 visitors get a free vegetarian lunch set (bring your own container). Lucky draw for 5 winners.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[],"flags":[{"t":"correction","text":"First post said 8:30 AM – 2:00 PM. A 10 Nov announcement revised it to 9:00 AM – 12:00 PM, which is used here."},{"t":"missing","text":"No fee or registration link is mentioned."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-06 10:55","sender":"UMisOne","orig":null,"msg":44257,"snippet":"🌏[ZERO BURDEN BAZAAR 2026]💙"},{"role":"latest","ts":"2026-11-10 15:09","sender":"UMisOne","orig":null,"msg":44323,"snippet":"🌏[ZERO BURDEN BAZAAR 2026]💙"}],"text":"🌏[ZERO BURDEN BAZAAR 2026]💙\n\nReady to shop sustainably? 🛍️✨ Join us at the Zero Burden Bazaar for an eco-friendly bazaar where pre-loved items get a second life and small actions make a big difference! 🌱\n\n📅 Date: 14 November 2026 (Saturday)\n⏰ Time: 8:30 AM – 2:00 PM\n📍 Venue: Dewan Utama Pelajar B, USM\n\n🌟MyCSD points provided!\n\nBring your friends along, explore the bazaar, and be part of the movement towards a greener future. Every small step counts! 💚🌏\n\nSee you there! 👀\n\n#ZeroBurdenBazaar #USMGreenAmbassadors \n#TzuChi #SustainableLiving #EcoFriendly #GoGreen #USM\n#EPEHub\n#Sustainability","nPosts":3,"org":"USM Green Ambassadors (from hashtag)","orgHow":"hashtag"},{"id":"ecocraft","title":"Eco-Craft & Sustainability Workshop Series","cat":"activity","start":"2026-11-14T08:30+08:00","end":"2026-11-14T14:00+08:00","where":"Dewan Utama Pelajar B (DUP B), USM","mode":"in-person","fee":null,"points":"MyCSD Provided & token of appreciation","desc":"Three workshops: eco-soap making (proceeds to charity), fragrant herb pouches, and plant-based food prep.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[],"flags":[{"t":"missing","text":"No fee or registration link is mentioned. Slots are limited per session."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-08 19:46","sender":"UMisOne","orig":null,"msg":44296,"snippet":"🌿 [ECO-CRAFT & SUSTAINABILITY WORKSHOP SERIES]"},{"role":"latest","ts":"2026-11-13 20:01","sender":"UMisOne","orig":null,"msg":44366,"snippet":"🌿 [ECO-CRAFT & SUSTAINABILITY WORKSHOP SERIES]"}],"text":"🌿 [ECO-CRAFT & SUSTAINABILITY WORKSHOP SERIES]\n\nDid you know that everyday waste can be turned into something practical and eco-friendly?\n\nJoin us for an interactive hands-on series of sustainability workshops designed to teach you how to upcycle household materials and create your own eco-products! Guided by experienced trainers, you’ll gain practical skills in eco-friendly crafting and responsible waste management.\n\n🎨 Workshop Options\n1️⃣ ECOSOAP MAKING\n(All proceeds will be donated to charity! ❤️)\n Learn how lightly used vegetable oil can be safely transformed into household cleaning soap. Workshop includes guidance on safe handling and soap preparation.\n\n2️⃣ FRAGRANT POUCH / BAG HERB\nCraft your own aromatic, natural herb pouches to freshen up your wardrobe and living space.\n\n3️⃣ VEGGIELICIOUS\nDiscover fun, healthy, and eco-conscious food prep skills focused on plant-based food.\n\n📅 Event Details\nDate: Saturday, 14 November 2026\nTime: 8:30 am – 2:00 pm\nVenue: Dewan Utama Pelajar B, Universiti Sains Malaysia (DUP B)\n\n MyCSD Provided & token of appreciation will be given! 🎓🎁\n\n👥 Limited slots available per session!\n\nPlease complete the registration form carefully. Scan the QR codes above to select your preferred workshop. Successful registration and further details will be communicated via WhatsApp.\n\nLet us turn waste into something useful, one step at a time! ♻️✨\n\n#EPEHub #SustainabilityUSM #FromWasteToWash","nPosts":3,"org":"USM Green Ambassadors (from hashtag)","orgHow":"hashtag"},{"id":"tzuchi2","title":"Tzu Chi Monthly Recycling Day (November)","cat":"activity","start":"2026-11-22T09:00+08:00","end":"2026-11-22T12:00+08:00","where":"HAMNA, Desa Permai Indah","mode":"in-person","fee":null,"points":"Earn MyCSD points","desc":"Monthly recycling morning; learn how to sort recyclables.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[],"flags":[{"t":"missing","text":"No fee or link in this repost. The October post said transport is provided and to register via the poster QR or a Google Form."}],"notes":["The October session's form was https://forms.gle/z8G6HNBZjeTLPjJQA. This repost does not repeat it."],"sources":[{"role":"first","ts":"2026-11-19 13:36","sender":"UMisOne","orig":null, barang Pertanyaan:\n📞 PP: +60 11-1984 9213 (Mad)\n📞 SU: +60 11-3622 0276 (Alya)\n\nTempat adalah terhad!! ⚠️ Cepat daftar sebelum slot penuh! 💪✨\n\n“Jom Healing Bersama KRU” 🏕️\n\n#KRUtanpaBatasan 💜🦅\n#HealingSampaiHilang","nPosts":3,"org":"Kelab Rekreasi Unisains (KRU) USM","orgHow":"stated"},{"id":"glowzumba","title":"Glow Zumba 26/27","cat":"activity","start":"2026-12-09T20:00+08:00","end":"2026-12-09T22:30+08:00","where":"Dewan PUMA","mode":"in-person","fee":"Students RM4 / staff & non-USM RM5","points":"MYCSD points will be provided to all participants","desc":"Zumba night with refreshments.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register (students)","url":"https://docs.google.com/forms/d/e/1FAIpQLSdqTArsa1e2gNMBG4xAAwTDMMXbVUtbs__p_PwZVqiglBiEMw/viewform?usp=publish-editor"},{"label":"Register (staff & non-USM)","url":"https://docs.google.com/forms/d/e/1FAIpQLSemyWgahf0CsloI_9Mh0CmMsuSNvuxITTqTk_hYGGtyYAlnBw/viewform?usp=header"}],"flags":[{"t":"missing","text":"The organiser is not named."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-19 13:35","sender":"UMisOne","orig":null,"msg":44457,"snippet":"🔥 *MYCSD POINTS WILL BE PROVIDED TO ALL PARTICIPANTS* 🔥"}],"text":"🔥 *MYCSD POINTS WILL BE PROVIDED TO ALL PARTICIPANTS* 🔥\n\n💜✨ *GLOW ZUMBA 26/27* 💜✨\n\n\n🌟 Lights on. Music up. Let the good vibes take over! 🎶💃\n\nREADY TO DANCE YOUR HEART OUT? 🔥🕺\n\n📅 *Date* : 9 December 2026 (Wednesday)  \n⏰ *Time* : 8:00 PM – 10:30 PM  \n📍 *Venue* :  Dewan PUMA  \n🎟️ *Participation Fee:*\n🎓 Students: RM4  \n👩‍🏫 Staff & Non USM: RM5  \n\n🌈 *WHAT'S IN STORE FOR YOU?🌈* \n\n🔥 Dance your worries away with an energetic Zumba session!  \n \n🎁 Enjoy refreshments provided throughout the event!  \n✨ Earn MyCSD points for your participation!  \n💜 Have fun, meet new people and create unforgettable memories!\n \n\n\n📲 *REGISTRATION IS NOW OPEN!!️* \n\n👥 Separate registration QR codes are available for:\n🎓 *Students* :\nhttps://docs.google.com/forms/d/e/1FAIpQLSdqTArsa1e2gNMBG4xAAwTDMMXbVUtbs__p_PwZVqiglBiEMw/viewform?usp=publish-editor\n\n👩‍🏫 *Staff & Non USM* :\nhttps://docs.google.com/forms/d/e/1FAIpQLSemyWgahf0CsloI_9Mh0CmMsuSNvuxITTqTk_hYGGtyYAlnBw/viewform?usp=header\n\nSEE YOU ON THE DANCE FLOOR! 🔥🎶","nPosts":1},{"id":"excel","title":"Excel Workshop 2026","cat":"activity","start":"2026-12-04T20:30+08:00","end":"2026-12-04T23:00+08:00","where":"Microsoft Teams","mode":"online","fee":"Maths students RM1 / non-Maths USM RM2 / non-USM RM2","points":"FREE MyCSD points for participating students","desc":"Workshop by Nur Husna Binti Ismail.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"Fees are listed for Maths, non-Maths USM and non-USM students"},"forms":[{"label":"Register","url":"https://forms.gle/6SopQnyNB1nSTqgd7"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-19 13:35","sender":"UMisOne","orig":null,"msg":44459,"snippet":"📊✨EXCEL WORKSHOP 2026✨📊"},{"role":"latest","ts":"2026-11-19 13:38","sender":"UMisOne","orig":null,"msg":44485,"snippet":"📊✨ *EXCEL WORKSHOP 2026* ✨📊"}],"text":"📊✨ *EXCEL WORKSHOP 2026* ✨📊\n\nAssalamualaikum and greetings everyone!\n\n💻 *Ready to enhance your Microsoft Excel skills?*\n\nWhether you are a beginner or looking to improve your existing skills, this workshop is a great opportunity to expand your knowledge, explore useful Excel features and develop practical skills that can benefit your academic journey and future career!\n\n🎁 *WHAT'S MORE?*\n✨ FREE MyCSD points are provided for participating students!\n\n📌 *EVENT DETAILS*\n📅 Date: 4 December 2026 (Friday)\n🕣 Time: 8.30 PM – 11.00 PM\n🎙 Speaker: Nur Husna Binti Ismail\n💻 Platform: Microsoft Teams\n\n💰 *REGISTRATION FEES*\n🔹 Mathematical Science Students: RM1\n🔹 Non-Mathematical Science Students (USM): RM2\n🔹 Non-USM Students: RM2\n\n📝 *REGISTER NOW!*\n🔗 https://forms.gle/6SopQnyNB1nSTqgd7\n\nDon't miss this opportunity to learn something new and earn FREE MyCSD points at the same time! \n\nWe look forward to seeing you there! 🎉🎉\n\n📞For further enquiries, please contact :\nBrighton :011-10708061 tel:011-10708061\nNadia : 011-16625054 tel:011-16625054\n\n#ExcelWorkshop2026","nPosts":2,"org":"MathSoc (inferred from the fee wording)","orgHow":"hashtag"},{"id":"usmcec","title":"USMCEC Technical Presentation Workshop","cat":"activity","start":"2026-12-02T14:30+08:00","end":"2026-12-02T17:00+08:00","where":"Cisco Webex (online)","mode":"online","fee":"RM1","points":"MYCSD provided for all USM students!","desc":"Workshop on presenting technical content.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/tJV3ri4qjg2ECp6o6"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-19 13:37","sender":"UMisOne","orig":null,"msg":44478,"snippet":"|USMCEC Technical Presentation Workshop📊|"}],"text":"|USMCEC Technical Presentation Workshop📊|\n\nReady to elevate your presentation skills?💡\nDelivering complex information doesn’t have to be overwhelming. Join us at the USMCEC Technical Presentation Workshop and learn how to transform complicated data into precise, logical, and highly effective presentations!🌟\n\nThis workshop features an expert judge of the Technical Case Study & Presentation Competition, Dr. Fadzil Noor Gonawan, and past national-level competition winners Mr. Looi Zhi Yang and Ms. Leong Thong Yan 🤩! They’ll be spilling their top secrets, preparation tips, and past experiences to help you deliver precise, logical, and effective presentations!🗣️🗣️\n\nEvent Details:\n📅 Date: 2 December 2026\n⏰ Time: 2:30 PM to 5:00 PM\n📍 Platform: Online (Cisco Webex)\n💸 Fee: RM 1\n🔗 Registration link: https://forms.gle/tJV3ri4qjg2ECp6o6\n🌟 MYCSD provided for all USM students!\n\nDon’t miss this chance to learn from the best. Secure your spot today! 🚀 \n\nFor inquiries, contact:\n📞 Wei Jun: 011-18819209 tel:011-18819209\n📞 Shu Ee: 016-5518643 tel:016-5518643","nPosts":1,"org":"USMCEC","orgHow":"stated"},{"id":"tivoyage","title":"TI Voyage Interaction Day","cat":"activity","start":"2026-12-19T08:00+08:00","end":"2026-12-19T12:00+08:00","where":"Dewan Utama Desasiswa (DUD M08)","mode":"in-person","fee":"RM5","points":"MyCSD Provided","desc":"Games and activities to meet TI students and TISOC. Limited to the first 100 participants. Breakfast and lunch provided.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[],"flags":[{"t":"missing","text":"No registration link or QR code is mentioned."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-19 13:37","sender":"UMisOne","orig":null,"msg":44479,"snippet":"🚀 READY FOR AN UNFORGETTABLE ADVENTURE? JOIN TI VOYAGE INTERACTION DAY! 🚀"}],"text":"🚀 READY FOR AN UNFORGETTABLE ADVENTURE? JOIN TI VOYAGE INTERACTION DAY! 🚀\n\nGet ready for an exciting morning filled with fun games, interactive activities and exciting challenges! 🎉 It's the perfect opportunity to meet new people, build friendships and get to know TISOC better!\n\nWHY JOIN US?\n✨ Get to know TISOC\n✨ Connect with fellow TI students\n✨ Explore opportunities to join TISOC\n✨ Enjoy fun and interactive activities!\n\nPROGRAMME DETAILS\n🗓️ 19 December 2026 (Saturday)\n📍 Dewan Utama Desasiswa (DUD M08)\n⏰ 8.00 a.m. – 12.00 p.m.\n\n📢 LIMITED TO THE FIRST 100 PARTICIPANTS ONLY!\n\n🍽️ Breakfast & Lunch Provided\n🎖️ MyCSD Provided\n⚡ Fun Games & Activities Await!\n\nREGISTRATION FEE\n💸 RM5 ONLY!\n\nRegister now and secure your spot! ☺️\n\nANY INQUIRIES? CONTACT:\n📞 +60 12-779 2881 (Haikal)\n📞 +60 14-292 432 (Amyrah)\n\n#WhereTechReigns\n#WeAreTechnologists\n#TIUSM","nPosts":1,"org":"TISOC (from hashtag)","orgHow":"hashtag"},{"id":"clothes","title":"Give Your Clothes a Second Life (Houseboat 2.0 clothes drive)","cat":"activity","start":"2026-12-02T20:00+08:00","end":"2026-12-03T22:00+08:00","where":"Kafe Aman (K09) & Kafe Tekun (M09)","mode":"in-person","fee":null,"points":"MYCSD POINTS PROVIDED (for USM Induk students only)","desc":"Collection of pre-loved clothes for the Orang Asli community.","kind":"event","myCsd":true,"elig":{"kind":"limited","note":"myCSD for USM Induk students only"},"forms":[],"flags":[{"t":"missing","text":"No fee or link mentioned. It is a donation drive. Times are read as 8:00 – 10:00 PM on each of the two days."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:13","sender":"UMisOne","orig":null,"msg":44399,"snippet":"👚 GIVE YOUR CLOTHES A SECOND LIFE! ✨"}],"text":"👚 GIVE YOUR CLOTHES A SECOND LIFE! ✨\n\nGot clothes you no longer wear? Don’t let them collect dust in your wardrobe! 📦\n\nPass them on and spread some love to the Orang Asli community through Houseboat 2.0. Every little donation counts! 🫶\n\n🎓 MYCSD POINTS PROVIDED (For USM induk students only)\n\n📅 2–3 DECEMBER 2026\n⏰ 8:00 PM – 10:00 PM\n📍 KAFE AMAN (K09) & KAFE TEKUN (M09)\n\nClean out your closet, share the good vibes and make someone’s day! 💗\n\n📞 For enquiries : Aisy ( +6017-5407268 tel:+6017-5407268 )\n\n#PrelovedClothes #SekretariatPEACE #Houseboat2.0","nPosts":1,"org":"Sekretariat PEACE (from hashtag)","orgHow":"hashtag","campus":"induk"},{"id":"united","title":"MedHealth 8.0: United by Care, Driven by Hope (blood donation & health screening day)","cat":"activity","start":"2026-12-12T09:00+08:00","end":"2026-12-12T17:00+08:00","where":"DUP A & DUP B, USM","mode":"in-person","fee":null,"points":"MyCSD PROVIDED!!!","desc":"Blood donation (target 200 bags), health screening, cancer screening and a clinical booth.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/vWyent3UT1SfRQnx9"}],"flags":[{"t":"missing","text":"Fee not stated."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-13 20:00","sender":"UMisOne","orig":null,"msg":44358,"snippet":"〘🩸 UNITED BY CARE, DRIVEN BY HOPE! ❤️〙 "},{"role":"latest","ts":"2026-11-13 20:16","sender":"UMisOne","orig":null,"msg":44385,"snippet":"〘🩸 UNITED BY CARE, DRIVEN BY HOPE! ❤️〙 "}],"text":"〘🩸 UNITED BY CARE, DRIVEN BY HOPE! ❤️〙 \n\nA little act of kindness can make a life-changing difference. Join us at MEDHEALTH 8.0 for a day dedicated to health, wellness and the power of giving back to our community! 🩺✨\n\nFrom saving lives through blood donation to taking charge of your health, there's something meaningful for everyone!\n\nHere's what awaits you:\n🩸 Blood Donation (Target: 200 Bags)\n🩺 Health Screening\n🎗️ Cancer Screening\n🧴 Clinical Booth (Free Bath Bombs & Lotion!)\n\n📅 Date: 12 December 2026 (Saturday)\n⏰ Time: 9:00 AM – 5:00 PM\n📍 Venue: DUP A & DUP B, USM \n\n📲 REGISTER HERE:  https://forms.gle/vWyent3UT1SfRQnx9\n\n🏅 MyCSD PROVIDED!!! \n\n📞 Enquiries :\nThanesh (Project Director of MedHealth 8.0) \nhttps://wa.me/01998244232 \n\nViveneshwary (Secretary of MedHealth 8.0) \nhttps://wa.me/0124870796 \n\none community, one mission, countless lives to make a difference. \n\n#MedHealth8.0\n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":2,"org":"SSI USM (from hashtag)","orgHow":"hashtag"},{"id":"dewatara","title":"Panggung Dewatara: Tiada Tajuk","cat":"activity","start":"2026-12-19T20:00+08:00","end":"2026-12-19T23:30+08:00","where":"Dewan Serbaguna (DSG)","mode":"in-person","fee":null,"points":"MYCSD PROVIDED!","desc":"Stage performance by Adikarma Kejuruteraan.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[],"flags":[{"t":"missing","text":"No fee or link. Registration is by the poster QR code."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-10 15:10","sender":"UMisOne","orig":null,"msg":44330,"snippet":"🎭 SEBUAH PANGGUNG, SEBUAH CERITA."}],"text":"🎭 SEBUAH PANGGUNG, SEBUAH CERITA.\n\nSetiap kisah punya cerita, setiap babak punya makna. Namun, bagaimana pula dengan sebuah kisah yang hadir tanpa tajuk?\n\nAdikarma Kejuruteraan mempersembahkan *PANGGUNG DEWATARA: Tiada Tajuk.* \n\nSaksikan sebuah persembahan yang bakal membawa penonton menyelami cerita, emosi dan realiti di sebalik set  as the diyas! 🪔💛","nPosts":4},{"id":"questlight","title":"The Quest of Light: World Trivia Challenge","cat":"competition","start":"2026-11-07T00:00+08:00","end":"2026-11-21T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"USM students RM1 / public RM2 (see note)","points":"MYCSD PROVIDED for USM participants","desc":"Online world trivia quiz (Deepavali series).","kind":"window","myCsd":true,"elig":{"kind":"all","note":"USM students and the public; MyCSD only for USM participants"},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSfLyLbl09cZ_Nhkjvb0FUL2bx7expCIK8VW7l8sFDnXVyK6Tw/viewform"}],"flags":[{"t":"conflict","text":"The 14 Nov post says USM RM2 / public RM3. The 17 and 19 Nov posts say USM RM1 / public RM2. The later figures are shown, but the chat does not say the earlier ones were withdrawn."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-14 12:17","sender":"UMisOne","orig":null,"msg":44392,"snippet":"🪔🦚✨ [ THE QUEST OF LIGHT: WORLD TRIVIA CHALLENGE ] ✨🎆"},{"role":"latest","ts":"2026-11-17 08:29","sender":"UMisOne","orig":null,"msg":44449,"snippet":"🪔🦚✨ [ THE QUEST OF LIGHT: WORLD TRIVIA CHALLENGE ] ✨🎆"}],"text":"🪔🦚✨ [ THE QUEST OF LIGHT: WORLD TRIVIA CHALLENGE ] ✨🎆\n\nReady to take a journey around the world? 🌍✈️ Get ready to explore some of the world's most iconic landmarks, magnificent architectural wonders and breathtaking historical sites! From ancient monuments and towering structures to world-famous attractions, how well can you recognise these landmarks and identify the countries they belong to? 🏛️🗼🕌\n\nWhether you're a travel enthusiast, geography lover or simply curious about the world, this is your chance to test your knowledge, discover fascinating places and challenge your friends! 🧠🏆 Race against the clock, climb the leaderboard and prove that you know your way around the globe! 🌎✨\n\n🌟 EVENT DETAILS\n\n📅 Date: 7–21 NOV 2026\n\n💻 Platform: ONLINE QUIZ\n\n💵 Registration Fee:\n🧑‍🎓 USM STUDENT – RM 2\n🌍 PUBLIC – RM 3\n\n✨ MYCSD PROVIDED for USM participants!\n\n🪔 This Deepavali, let your knowledge shine as brightly as a thousand diyas! Every question is a new spark, and every discovery makes the celebration more meaningful! 🪔💥🎇\n\n🔗 REGISTER NOW: https://docs.google.com/forms/d/e/1FAIpQLSfLyLbl09cZ_Nhkjvb0FUL2bx7expCIK8VW7l8sFDnXVyK6Tw/viewform\n\n🦚 May the colours of tradition, the sparkle of celebration and the light of knowledge brighten your Deepavali! 🎆✨\n\n#TheQuestOfLight\n#WorldTriviaChallenge\n#Deepz2026","nPosts":2,"org":"EICC (from hashtag #Deepz2026)","orgHow":"hashtag"},{"id":"checkpoint","title":"Checkpoint: Knowledge Is Your Fastest Lap (cancer awareness quiz)","cat":"competition","start":"2026-11-13T00:00+08:00","end":"2026-12-13T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM1","points":"MyCSD Provided!","desc":"Online quiz. Prizes worth RM200.","kind":"window","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://tinyurl.com/2u8j45xf"}],"flags":[{"t":"note","text":"The register link is a tinyurl.com short link, not a Google Form. Check where it lands before paying."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-14 12:17","sender":"UMisOne","orig":null,"msg":44394,"snippet":"🏁 CHECKPOINT: Knowledge Is Your Fastest Lap 🧠"}],"text":"🏁 CHECKPOINT: Knowledge Is Your Fastest Lap 🧠\n\nEvery answer is a step towards greater awareness 🎗️✨\n\nKnowledge is power, and awareness is where change begins ❤️. Join us for an exciting online quiz to test your knowledge about cancer awareness, important facts, and prevention. Every question is an opportunity to learn, understand, and spread awareness 🤝\n\n🏁 Ready to take on the challenge? Race through the questions, learn something new, and be part of a meaningful journey towards a more informed and caring community! ❤️\n\n✧・゚Learn. Challenge. Spread HOPE・゚✧\n\n📅 *Date:* 13 November – 13 December 2026\n💻 *Platform:* Google Form\n💵 * CO Recruitment* for Term *2026/2027* !\nWhether you're into organising events, creating content, handling technical tasks, or making sure everything runs smoothly — there's a place for you 💙\n📌 *Departments Available*\n• Activity\n• Media & Publicity\n• Technical & Physical\n• Protocol\n• Info\n🗓️ Application Period: *28 September* – *19 October 2026*\n🎤 Interview Period: *21 – 23 October 2026*\n📞 For any inquiries:\n- Ong Ching Hii (016-871 8706)\n- Lim Kah Hao (017-723 0503)\nScan the QR code now and join the BYIC family!","nPosts":1,"flags":[]},{"id":"r-econ","title":"USM Economics Club: Exco Phase 2","org":"USM Economics Club","deadline":"2026-10-21","kind":"recruit","dateText":"Recruitment 1 – 21 Oct 2026; interviews 24 & 25 Oct 2026 (in person, venue TBA)","csd":"Selected EXCO members receive MyCSD (stated)","who":"\"Calling all USM students\"","note":"No fee. Positions: Protocol & Public Relations, Technical & Physical, Entrepreneurship & Sponsorship, Multimedia, Information & Inspiration. Interview venue is \"TBA\" in the post.","forms":[{"label":"Apply","url":"https://forms.gle/6KykMm3qZ7LyrfTP8"}],"eligKind":"all","sources":[{"role":"first","ts":"2026-10-05 16:45","sender":"UMisOne","orig":null,"line":5532,"snippet":"EXCO RECRUITMENT USM ECONOMICS CLUB ACADEMIC SESSION 2026/2027 PHASE 2🔎"}],"text":"🔎 EXCO RECRUITMENT USM ECONOMICS CLUB ACADEMIC SESSION 2026/2027 PHASE 2🔎\n✨ Calling all USM students! ✨\nLooking for a chance to step out of your comfort zone, build your leadership skills, and gain hands-on experience in managing projects? This could be your opportunity! 👀\n📌 POSITIONS OFFERED\n- Exco Protocol & Public Relations\n- Exco Technical & Physical\n- Exco Entrepreneurship & Sponsorship\n- Exco Multimedia\n- Exco Information & Inspiration\n🌟 WHY JOIN US?\n✔️ Join the club as an EXCO members without any fees\n✔️ Selected EXCO members will receive MyCSD\n✔️ Develop valuable leadership & teamwork skills\n✔️ Build a great network & bond with the Economics
