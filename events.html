<!doctype html>
<html lang="en">
<head>

<title>myCSD events</title>
<style>
:root{
  --bg:#1F1D1A; --text:#E8E1D3; --muted:#8E8677; --rule:#3A362F; --amber:#E0A94A;
  --panel:#26231F; --warn:#E0A94A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
a{color:var(--amber)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)}

/* header */
header{border-bottom:1px solid var(--rule)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:12px;flex-wrap:wrap}
.brand{font:600 15px var(--mono);letter-spacing:.2px;margin:0}
.brand .mark{color:var(--amber)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;font:13px var(--mono);color:var(--muted);cursor:pointer}
nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--amber)}
nav button:hover{color:var(--text)}
.account{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.account .who{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account .err{color:var(--warn);max-width:260px}

main{padding-top:14px;padding-bottom:28px;min-height:60vh}
.hidden{display:none!important}

/* summary + controls */
.summary{font:12px/1.5 var(--mono);color:var(--muted);margin:0 0 10px}
.summary b{color:var(--text);font-weight:500}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.search{flex:1 1 200px;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;font:13px var(--mono)}
.search::placeholder{color:var(--muted)}
.btn{background:none;border:1px solid var(--rule);border-radius:3px;padding:6px 10px;font:12px var(--mono);color:var(--muted);cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{color:var(--amber);border-color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font:12px var(--mono);color:var(--muted);cursor:pointer}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.chip .n{opacity:.75}
.fpanel{border:1px solid var(--rule);border-radius:3px;background:var(--panel);padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px 18px;font:12px var(--mono)}
.fpanel label{display:flex;align-items:center;gap:6px;color:var(--text)}
.fpanel select{background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:3px 6px;font:12px var(--mono);max-width:260px}
input[type=checkbox]{accent-color:var(--amber);width:15px;height:15px;margin:0}

/* date strip */
.strip{margin:0 0 14px;border:1px solid var(--rule);border-radius:3px}
.strip-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--rule);font:12px var(--mono);color:var(--muted)}
.strip-head button{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 8px;font:13px var(--mono)}
.strip-head button:hover:not(:disabled){color:var(--amber)}
.strip-head button:disabled{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{height:66px;display:grid;grid-template-rows:18px 26px 16px;justify-items:center;align-items:center;background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;padding:6px 0 0;color:var(--text)}
.day:last-child{border-right:0}
.day .dn{font:11px var(--mono);color:var(--muted);text-transform:lowercase}
.day .num{font:600 17px var(--mono);line-height:26px}
.day .star{font:13px var(--mono);color:var(--amber);line-height:16px;height:16px}
.day:hover{background:var(--panel)}
.day.today{background:var(--text);color:var(--bg)}
.day.today .dn{color:#5d574b}
.day.today .star{color:#8a5d10}
.day.sel{outline:2px solid var(--amber);outline-offset:-2px}

/* lists */
h2.sec{font:12px var(--mono);color:var(--muted);text-transform:lowercase;letter-spacing:.4px;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule);font-weight:400}
h2.sec .sub{color:var(--muted);opacity:.8}
ul.rows{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:72px 1fr auto;gap:2px 14px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:start}
.date{font:12px/1.4 var(--mono);color:var(--muted)}
.date .d1{color:var(--text);font-size:13px;display:block}
.main .title{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:500 15px/1.35 var(--sans);color:var(--text)}
.main .title:hover{color:var(--amber)}
.meta{font:12px/1.5 var(--mono);color:var(--muted);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font:11px/1.3 var(--mono);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.go{color:var(--amber);border-color:var(--amber)}
.tag.soon{color:var(--text);border-color:var(--amber)}
.tag.dashed{border-style:dashed}
.tag.chk{color:var(--amber)}
.side{text-align:right;font:12px/1.5 var(--mono);color:var(--muted);min-width:118px}
.side .cd{color:var(--amber);font-size:13px;display:block}
.side .pts{display:block}
.side>a{font:12px var(--mono);white-space:nowrap;display:block;margin-top:1px}
.side .poster{display:block}
.reg{display:inline-flex;align-items:center;gap:5px;margin-top:6px;cursor:pointer}
li.row.done .title{color:var(--muted)}
li.row.ended .title{color:var(--muted);font-weight:400}
.empty{padding:22px 0;color:var(--muted);font:13px var(--mono)}
details.fold{margin-top:20px;border-top:1px solid var(--rule)}
details.fold summary{cursor:pointer;font:12px var(--mono);color:var(--muted);padding:10px 0;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"+ ";color:var(--amber)}
details.fold[open] summary::before{content:"- "}
.note{font:12px/1.55 var(--mono);color:var(--muted);margin:8px 0}

/* settings */
.set{max-width:640px}
.set h3{font:13px var(--mono);color:var(--amber);margin:22px 0 6px;font-weight:400}
.set label.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.set input[type=radio]{accent-color:var(--amber);margin-top:4px}
.set p{margin:4px 0;color:var(--muted);font-size:13px}
.set ul{margin:6px 0 6px 18px;padding:0;color:var(--muted);font-size:13px}
.set li{margin:3px 0}

/* popup */
.ov{position:fixed;inset:0;background:rgba(10,9,8,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:10}
.pop{background:var(--bg);border:1px solid var(--rule);border-radius:4px;max-width:640px;width:100%;padding:16px 18px 18px;position:relative}
.pop h3{margin:0 28px 4px 0;font:600 17px/1.3 var(--sans)}
.pop .x{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font:18px var(--mono);cursor:pointer;padding:4px 8px}
.pop .x:hover{color:var(--amber)}
.pop dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:12px 0}
.pop dt{font:12px var(--mono);color:var(--muted)}
.pop dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.pop h4{font:12px var(--mono);color:var(--muted);margin:16px 0 6px;font-weight:400;text-transform:lowercase;border-bottom:1px solid var(--rule);padding-bottom:3px}
.pop .flag{font-size:13px;border-left:2px solid var(--amber);padding:2px 0 2px 9px;margin:6px 0;color:var(--text)}
.pop .flag.missing{border-left-color:var(--muted);color:var(--muted)}
.orig{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--mono);color:#c9c2b3;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:10px;max-height:260px;overflow:auto;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn.go{color:var(--bg);background:var(--amber);border-color:var(--amber);text-decoration:none;display:inline-block;font-weight:600}
.btn.go:hover{color:var(--bg);filter:brightness(1.08)}
.btn.out{text-decoration:none;color:var(--amber);border-color:var(--amber);display:inline-block}
.srcs{font:12px/1.5 var(--mono);color:var(--muted);margin:0;padding-left:16px}
.srcs li{margin:3px 0}

footer{border-top:1px solid var(--rule)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:22px;font:12px/1.5 var(--mono);color:var(--muted)}
footer .mark{color:var(--amber)}

@media (max-width:560px){
  body{font-size:14.5px}
  li.row{grid-template-columns:58px 1fr;gap:4px 12px}
  li.row .side{grid-column:2;text-align:left;min-width:0;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
  .side .cd,.side .pts,.side .poster{display:inline}
  .side>a{display:inline-block}
  .pop dl{grid-template-columns:1fr;gap:2px}
  .pop dd{margin-bottom:8px}
  .day{height:62px}
}
@media (prefers-reduced-motion:no-preference){ .chip,.btn,.day{transition:background-color .12s,color .12s,border-color .12s} }

ver—D-Day is finally here! Our \"Leprosy Awareness Talk\"  is happening TONIGHT, and this is your final chance to secure a spot!👀\n\nJoin Dr. Por Heong Hong (Senior Lecturer, School of Social Science, USM) for an eye-opening hour to explore medical facts and history, and work together to break myths and social stigma surrounding leprosy.\n\n📌【Event Details】\n📆 Date: 30 October 2026 (Friday)\n⏰ Time: 9:00 PM – 10:00 PM\n🖥️ Platform: Cisco Webex (Online)\n\n💵 Registration Fee: RM 1 only\n✅ MyCSD application provided for USM students\nScan the QR code on the poster or click the link below to register now before it's too late! See you at 9 PM!\n🔗 Register here now: https://forms.gle/oAkk9xtdmJuHSmyB7\n\n☎️ For any enquiries, please contact:\nChong Wai Feng +6011-3907 8440\n    Jocelyn Kirk     +6011-5336 0905\n\n#CommunityServiceClub\n#USMTionghuaLanguageSociety\n#UniversitiSainsMalaysia\n#Self-Nurturing,CaringForTheSociety","nPosts":4,"notes":[]},{"id":"colourrun","title":"USM Colour Run: Break the Frame","cat":"activity","start":"2026-10-31T07:00+08:00","end":"2026-10-31T11:30+08:00","where":"Padang Kawad, USM","mode":"in-person","fee":"RM20 Student A / RM37 Student B / RM57 Universal","points":"MYCSD listed in all three packages","desc":"5 km colour run. Student A (RM20): breakfast, colour powder, bag, wristband, e-cert. Student B (RM37): adds a T-shirt. Universal (RM57, open to all): adds a medal.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"Universal package (RM57) is \"Open to all!\"; Student A and B packages are for students"},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSdDixHLL7UghaueiwYb-r8xNLtuMCa7bDG1LZO4TIdT90Lpqw/viewform"}],"flags":[{"t":"conflict","text":"An earlier post (4 Oct) had a cut-off link. The full link from the 14 Oct post is used here."}],"sources":[{"role":"first","ts":"2026-10-04 14:01","sender":"UMisOne","orig":null,"line":4788,"snippet":"USM COLOUR RUN: BREAK THE FRAME"},{"role":"latest","ts":"2 CC 26/27 (from Instagram handle)","orgHow":"hashtag","forms":[{"label":"Register","url":"https://forms.gle/NgqqduoDQGyNiQjt6"}],"sources":[{"role":"first","ts":"2026-10-14 19:06","sender":"UMisOne","orig":null,"line":9132,"snippet":"Lungs on the Line: The Reality of Asthma, Haze, and Smoking】🌬️🫁"}],"text":"🫁🌬️【Lungs on the Line: The Reality of Asthma, Haze, and Smoking】🌬️🫁\nThink you know your respiratory health?🤔💨\nIt’s time to put your knowledge to the test with Lungs on the Line!🔥\nJoin us for an engaging educational quiz exploring the realities of asthma, haze, smoking, and overall respiratory health. Test your knowledge and discover how different factors affect respiratory health!✨\nEvent Details:\n📆 Date: 12 October 2026 - 25 October 2026\n💻 Platform: Online (Google Form)\n💰 Registration Fee: RM1\n🎁MyCSD & E-cert will be provided for all participants! We’re also giving away cash prizes for the top 3 winners! The first 20 participants who score full marks (excluding the top 3 winners) will receive a special gift!🎉\n🏆Cash Prizes:\n🥇1st Place: RM15\n🥈2nd Place: RM10\n🥉3rd Place: RM5\n🔗Registration Link:\nhttps://forms.gle/NgqqduoDQGyNiQjt6\nFor any inquiries, feel free to contact:\n📞Lee Ping Sean (017-8657161)\n📞Daryl Lim (010-3989422)\nStay tuned and follow us on Instagram @pcc2627.usm for the latest updates!","nPosts":1,"flags":[],"notes":[]},{"id":"lightup","title":"Light Up Your Knowledge: Online Quiz","cat":"competition","start":"2026-09-01T00:00+08:00","end":"2026-10-25T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM1","points":"MYCSD POINTS ARE PROVIDED","desc":"Online quiz on Deepavali and Christmas traditions by Sekretariat Sukarelawan India (SSI) USM. Funds raised go towards supporting children in homes.","kind":"window","myCsd":true,"elig":{"kind":"unstated","note":""},"org":"Sekretariat Sukarelawan India (SSI) USM","orgHow":"stated","forms":[{"label":"Register","url":"https://forms.gle/GE53g6hLqfd3QoQY7"}],"sources":[{"role":" ttps://forms.gle/ooBgzyvE9qtYqVcg7"}],"flags":[{"t":"conflict","text":"Two different register links were posted 12 seconds apart on 16 Oct and the chat does not say which is correct. The 21 Oct repost carries only link 1 (the docs.google.com one), but that does not settle it. Not resolved."}],"sources":[{"role":"first","ts":"2026-10-16 11:25","sender":"UMisOne","orig":null,"line":9232,"snippet":"PUBLIC HEALTH CAMPAIGN 26/27: QUIZ CHALLENGE 1 “FROM A TO Z: YOUR GUIDE TO VITAMINS & EVERYDAY WELLNESS!” 🌟"},{"role":"latest","ts":"2026-10-30 07:51","sender":"UMisOne","orig":null,"msg":44112,"snippet":"[𝐏𝐮𝐛𝐥𝐢𝐜 𝐇𝐞𝐚𝐥𝐭𝐡 𝐂𝐚𝐦𝐩𝐚𝐢𝐠𝐧 26/27: 𝐐𝐮𝐢𝐳 𝐂𝐡𝐚𝐥𝐥𝐞𝐧𝐠𝐞 1: 𝐅𝐫𝐨𝐦 𝐀 𝐭𝐨 𝐙: 𝐘𝐨𝐮𝐫 𝐆𝐮𝐢𝐝𝐞 𝐭𝐨 𝐕𝐢𝐭𝐚𝐦𝐢𝐧𝐬 & 𝐄𝐯𝐞𝐫𝐲𝐝𝐚𝐲 𝐖𝐞𝐥𝐥"}],"text":"[𝐏𝐮𝐛𝐥𝐢𝐜 𝐇𝐞𝐚𝐥𝐭𝐡 𝐂𝐚𝐦𝐩𝐚𝐢𝐠𝐧 26/27: 𝐐𝐮𝐢𝐳 𝐂𝐡𝐚𝐥𝐥𝐞𝐧𝐠𝐞 1: 𝐅𝐫𝐨𝐦 𝐀 𝐭𝐨 𝐙: 𝐘𝐨𝐮𝐫 𝐆𝐮𝐢𝐝𝐞 𝐭𝐨 𝐕𝐢𝐭𝐚𝐦𝐢𝐧𝐬 & 𝐄𝐯𝐞𝐫𝐲𝐝𝐚𝐲 𝐖𝐞𝐥𝐥𝐧𝐞𝐬𝐬]\n\n2 Days to Go: Almost Time to Test Your Knowledge! ⚡\n\n💡 Daily Vitamin Smart Facts: 𝑻𝒉𝒆 𝑩-𝐂𝐨𝐦𝐩𝐥𝐞𝐱 𝐓𝐞𝐚𝐦 🔋\n\nDid you know that Vitamin B isn't just one single nutrient? It's a powerhouse group of 8 distinct vitamins! Together, they work like an orchestrated team to convert your daily food into energy, support brain function, and keep cell metabolism running smoothly. 🧠⚡\n\nHere are the details of the quiz:\n🗓️ Date: 15 October - 29 October 2026\n💻 Platform: Google Form\n💰 Registration Fee: RM2\n🌟 𝗠𝗬𝗖𝗦𝗗 𝗣𝗥𝗢𝗩𝗜𝗗𝗘𝗗 𝗧𝗢 𝗔𝗟𝗟 𝗣𝗔𝗥𝗧𝗜𝗖𝗜𝗣𝗔𝗡𝗧𝗦! 🌟\n\nLink registration: https://docs.google.com/forms/d/e/1FAIpQLSdNSjgrx4mUKFGUGhcuSc-ADPCWJQQzcDVJLqlov9CwSGoIAA/viewform\n\n💵 Prize waiting for you!\n🥇 1st Place: RM15\n🥈 2nd Place: RM10\n🥉 3rd Place: RM5\n\nFor any enquiries, feel free to contact us! 📞\n☎️ Goh Mei Fen (016-526 9052)\n☎️ Ooi Ju Yee (016-931 1838)\n\nFollow us for updates:\n📸 Instagram: @usm.phc27","nPosts":5,"notes":[]},{"id":"photo","title":"JM 12.0 & COP 6.0: Photography Competition","cat":"competition","start":"2026-10-01T00:00+08:00","end":"2026-11-12T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM2","points":"MyCSD Provided!","desc":"Photography competition, theme \"Small Moments, Big Meaning: Small Acts of Helping, Caring and Kindness\".","kind":"window","myCsd":true,"elig":{"kind":"unstated","note":""},"org":"SSI USM (from hashtag)","orgHow":"hashtag","forms":[{"label":"Register","url":"https://forms.gle/3XuZeLhQgJmDx4UT9"}],"flags":[{"t":"inferred","text":"The post gives \"1 October – 12 November\" with no year. 2026 is assumed."}],"sources":[{"role":"first","ts":"2026-09-29 21:22","sender":"UMisOne","orig":null,"line":3683,"snippet":"JM 12.0 & COP 6.0: Photography Competition 📸 〛"},{"role":"latest","ts":"2026-10-27 07:41","sender":"UMisOne","orig":null,"msg":44034,"snippet":"〚 JM 12.0 & COP 6.0:  𝐏𝐡𝐨𝐭𝐨𝐠𝐫𝐚𝐩𝐡𝐲 𝐂𝐨𝐦𝐩𝐞𝐭𝐢𝐭𝐢𝐨𝐧 📸 〛"}],"text":"〚 JM 12.0 & COP 6.0:  𝐏𝐡𝐨𝐭𝐨𝐠𝐫𝐚𝐩𝐡𝐲 𝐂𝐨𝐦𝐩𝐞𝐭𝐢𝐭𝐢𝐨𝐧 📸 〛\n\n👁️ See beyond the ordinary. Capture the extraordinary.\nEvery frame has a story. Every moment holds a meaning. ✨\n\n🎯 THEME:\n*“Small Moments, Big Meaning — Small Acts of Helping, Caring and Kindness” 🤍*\n\n🏆 Think. Capture. Inspire.\n\n📅 *Competition Period:* 1 October – 12 November\n💵 *Registration Fee:* RM2 \n\n✨ *MyCSD Provided!* \n\n🔗 *Register Now:* https://forms.gle/3XuZeLhQgJmDx4UT9\n\n*FOR MORE INQUIRIES*\nAvinash (Project Director) : 011-31781353\nKrishna (Vice Project Director) : 017-5049230\n\n#JMCOP2026\n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":3,"notes":[]},{"id":"medhealth","title":"MedHealth 8.0: Blood Awareness and Health Quiz","cat":"competition","start":"2026-09-30T00:00+08:00","end":"2026-11-30T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM1","points":"MyCSD Points Provided!","desc":"Online quiz on blood donation and health awareness (Phase 2 of MedHealth 8.0). Anyone can take part.","kind":"window","myCsd":true,"elig":{"kind":"all","note":"\"everyone is welcome to take part\""},"org":"SSI USM (from hashtag)","orgHow":"hashtag","forms":[{"label":"Register","url":"https://forms.gle/2ojsRSN5QkUxMCwf7"}],"flags":[{"t":"inferred","text":"The post gives \"30 September – 30 November\" with no year. 2026 is assumed."}],"sources":[{"role":"first","ts":"2026-10-01 22:29","sender":"UMisOne","orig":null,"line":4261,"snippet":"MedHealth 8.0: Blood Awareness and Health Quiz! 🧠🩸 〙"}],"text":"〘🩸🧠 𝐌𝐞𝐝𝐇𝐞𝐚𝐥𝐭𝐡 𝟖.𝟎: 𝐁𝐥𝐨𝐨𝐝 𝐀𝐰𝐚𝐫𝐞𝐧𝐞𝐬𝐬 𝐚𝐧𝐝 𝐇𝐞𝐚𝐥𝐭𝐡 𝐐𝐮𝐢𝐳! 🧠🩸 〙\nReady to put your health knowledge to the test? 👀✨\nAs we continue with 𝐏𝐡𝐚𝐬𝐞 𝟐 of MedHealth 8.0, it’s time to challenge yourself with our 𝐌𝐞𝐝𝐇𝐞𝐚𝐥𝐭𝐡 𝟖.𝟎: 𝐁𝐥𝐨𝐨𝐝 𝐀𝐰𝐚𝐫𝐞𝐧𝐞𝐬𝐬 𝐚𝐧𝐝 𝐇𝐞𝐚𝐥𝐭𝐡 𝐐𝐮𝐢𝐳! 🩸🩺\nThink you know your blood and health facts? 🤔💭 Put your knowledge to the test with fun and informative questions covering blood donation, health awareness and more! 💡✨\nWhether you’re a healthcare student or simply curious to learn something new, everyone is welcome to take part! 🙌\n📅 𝟑𝟎 𝐒𝐞𝐩𝐭𝐞𝐦𝐛𝐞𝐫 - 𝟑𝟎 𝐍𝐨𝐯𝐞𝐦𝐛𝐞𝐫\n⏰ 𝐀𝐧𝐲𝐭𝐢𝐦𝐞 𝐰𝐢𝐭𝐡𝐢𝐧 𝐭𝐡𝐞 𝐠𝐢𝐯𝐞𝐧 𝐩𝐞𝐫𝐢𝐨𝐝\n📍 𝐏𝐥𝐚𝐭𝐟𝐨𝐫𝐦: 𝐆𝐨𝐨𝐠𝐥𝐞 𝐅𝐨𝐫𝐦\n💰 𝐏𝐚𝐫𝐭𝐢𝐜𝐢𝐩𝐚𝐭𝐢𝐨𝐧 𝐅𝐞𝐞: 𝐑𝐌𝟏\n🔗 𝐑𝐞𝐚𝐝𝐲 𝐭𝐨 𝐏𝐮𝐭 𝐘𝐨𝐮𝐫 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 𝐭𝐨 𝐭𝐡𝐞 𝐓𝐞𝐬𝐭?\nhttps://forms.gle/2ojsRSN5QkUxMCwf7\n✨ 𝐌𝐲𝐂𝐒𝐃 𝐏𝐨𝐢𝐧𝐭𝐬 𝐏𝐫𝐨𝐯𝐢𝐝𝐞𝐝! ✨\nEvery question is a chance to learn something new, spread health awareness and become more informed about the importance of blood and our health. 🩸❤️\n✨ 𝐋𝐞𝐚𝐫𝐧. 𝐂𝐡𝐚𝐥𝐥𝐞𝐧𝐠𝐞. 𝐌𝐚𝐤𝐞 𝐚 𝐃𝐢𝐟𝐟𝐞𝐫𝐞𝐧𝐜𝐞. ✨\n#MedHealth8.0\n#SSIMovingForward\n#MunSellada\n#CompassionInAction\n#SSIUSM","nPosts":1,"notes":[]},{"id":"hoperun","title":"HOPE 26/27 Virtual Run: Miles of Compassion","cat":"competition","start":"2026-10-12T00:00+08:00","end":"2026-10-30T23:59:59+08:00","where":"Online (Google Form)","mode":"online","fee":"RM2 per person","points":"MyCSD provided for all participants","desc":"5 km virtual run (run, jog or walk). The top 3 fastest average pace are awarded. Dates are for registration; the run submission period is separate.","kind":"window","myCsd":true,"elig":{"kind":"unstated","note":""},"org":"HOPE 26/27","orgHow":"stated","forms":[{"label":"Register","url":"https://forms.gle/cPMdekKdhLiSLk4D8"}],"notes":["Registration: 12 – 30 Oct 2026.","Submit your run: 25 Oct – 8 Nov 2026."],"met i (E-Sports):* Jom cabar kawan-kawan anda dalam perlawanan Stumble Guys game!\nDatang beramai-ramai! bawa kawan-kawan dan keluarga! Sambil berseronok, kita boleh tingkatkan juga kesedaran tentang kesihatan mental! Jumpa di sana! 🌟\nLINK PENDAFTARAN:\nhttps://forms.gle/pFcssNBL27QsZuu16\n✨ With You, For You ✨\n#WMHC2026","nPosts":2,"flags":[],"notes":[]},{"id":"firstaid","title":"Online Quiz: First Aid & Trail Safety (Safety or Blunder?)","cat":"competition","start":"2026-10-21T00:00+08:00","end":"2026-10-28T23:59:59+08:00","where":"Google Form (online)","mode":"online","fee":"RM2","points":null,"desc":"Online quiz. Prizes: 1st RM15, 2nd RM10, 3rd RM5.","kind":"window","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/3Dox8g4vboYkjwbg7"}],"sources":[{"role":"first","ts":"2026-10-14 19:04","sender":"batrisyia","orig":"14.10.2026 07:59","line":8928,"snippet":"ONLINE QUIZ - FIRST AID & TRAIL SAFETY: SAFETY OR BLUNDER? 🏕"},{"role":"latest","ts":"2026-10-21 08:14","sender":"UMisOne","orig":"20.10.2026 11:27","msg":43946,"snippet":"🚨 LAST DAY TO GET READY! 🚨"}],"text":"🚨 LAST DAY TO GET READY! 🚨\n\nOkay… no more “I’ll do it later.” 😭\nIf you’ve ever thought,\n“I should probably know what to do in an emergency…”\nThis is your sign to actually test yourself.\nOne quiz. First aid. Trail safety. And maybe a little panic when you realise you’re not as sure as you thought. 🩹😂\nSAFETY OR BLUNDER?\nSee you tomorrow.\n\nSign up here & give it a shot:\n🔗https://forms.gle/3Dox8g4vboYkjwbg7\n\n📅 21–28 October 2026\n💻 Online via Google Form · RM2\n🏆 RM15 / RM10 / RM5 up for grabs\n\n📩 Got the question?\nIrvin — 014-895 4642\nNurul Aimi — 011-3551 3992\n📸 @pscxusm26\n\n#FirstAid #TrailSafety #SafetyOrBlunder #OnlineQuiz #USM #PSCXUSM26 #HikingSafety #OutdoorSafety #FirstAidQuiz #TrailSafetyQuiz #CashPrize #Quiz2026 #USMEvents","nPosts":2,"flags":[],"notes":[]},{"id":"dementia","title":"HOPE Webinar 2: Beyond Forgetfulness (Dementia and Brain Care in Seniors)","cat":"talk","start":"2026-10-31T20:00+08:00","end":"2026-10-31T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM2","points":null,"desc":"Webinar by Assoc. Prof. Dr. Lee Chong Yew on dementia, brain health and healthy ageing.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/7inf5Jnh3WGNfaEG8"}],"sources":[{"role":"first","ts":"2026-10-14 22:10","sender":"UMisOne","orig":null,"line":9188,"snippet":"WEBINAR 2 : BEYOND FORGETFULNESS : UNDERSTANDING DEMENTIA AND BRAIN CARE IN SENIORS 🧠🧓"},{"role":"latest","ts":"2026-10-22 14:38","sender":"UMisOne","orig":"22.10.2026 14:33","msg":43983,"snippet":"🧠🧓 𝐖𝐄𝐁𝐈𝐍𝐀𝐑 𝟐 : 𝐁𝐄𝐘𝐎𝐍𝐃 𝐅𝐎𝐑𝐆𝐄𝐓𝐅𝐔𝐋𝐍𝐄𝐒𝐒 : 𝐔𝐍𝐃𝐄𝐑𝐒𝐓𝐀𝐍𝐃𝐈𝐍𝐆 𝐃𝐄𝐌𝐄𝐍𝐓𝐈𝐀 𝐀𝐍𝐃 𝐁𝐑𝐀𝐈𝐍 𝐂𝐀𝐑𝐄 𝐈𝐍 𝐒𝐄𝐍𝐈𝐎𝐑𝐒 🧠🧓"}],"text":"🧠🧓 𝐖𝐄𝐁𝐈𝐍𝐀𝐑 𝟐 : 𝐁𝐄𝐘𝐎𝐍𝐃 𝐅𝐎𝐑𝐆𝐄𝐓𝐅𝐔𝐋𝐍𝐄𝐒𝐒 : 𝐔𝐍𝐃𝐄𝐑𝐒𝐓𝐀𝐍𝐃𝐈𝐍𝐆 𝐃𝐄𝐌𝐄𝐍𝐓𝐈𝐀 𝐀𝐍𝐃 𝐁𝐑𝐀𝐈𝐍 𝐂𝐀𝐑𝐄 𝐈𝐍 𝐒𝐄𝐍𝐈𝐎𝐑𝐒 🧠🧓\n\nIs forgetfulness always a normal part of ageing? 🤔\n\nJoin us for an insightful session on 𝐝𝐞𝐦𝐞𝐧𝐭𝐢𝐚, 𝐛𝐫𝐚𝐢𝐧 𝐡𝐞𝐚𝐥𝐭𝐡, and 𝐡𝐞𝐚𝐥𝐭𝐡𝐲 𝐚𝐠𝐞𝐢𝐧𝐠. Learn more about recognising changes in memory and how we can support better brain health among seniors. 🧠✨\n\n🎤 𝐒𝐩𝐞𝐚𝐤𝐞𝐫 : Assoc. Prof. Dr. Lee Chong Yew\n\n📅 𝐃𝐚𝐭𝐞 : 31 October 2026 (Saturday) \n⏰ 𝐓𝐢𝐦𝐞 : 8.00 p.m. - 10.00 p.m. \n💻 𝐏𝐥𝐚𝐭𝐟𝐨𝐫𝐦 : Cisco Webex \n💵 𝐑𝐞𝐠𝐢𝐬𝐭𝐫𝐚𝐭𝐢𝐨𝐧 𝐅𝐞𝐞 : RM 2\n\n🔗 𝐑𝐞𝐠𝐢𝐬𝐭𝐞𝐫 𝐍𝐨𝐰 : https://forms.gle/7inf5Jnh3WGNfaEG8\n\n📞 Any Inquiries: \nYING HUAN : +6011-10732603 \nFATIMAH: +6011-10950017\n\nDon’t miss out! Join us and discover how understanding 𝐝𝐞𝐦𝐞𝐧𝐭𝐢𝐚 and caring for our 𝐛𝐫𝐚𝐢𝐧 𝐡𝐞𝐚𝐥𝐭𝐡 can support healthier ageing 💚\n\nThank you!\n\n#HOPE2627\n#HealthOutreachProgramme\n#DementiaAwareness\n#BrainHealth\n#USMPharmacy\n#PusatPengajianSainsFarmasi","nPosts":2,"flags":[],"notes":[]},{"id":"canva","title":"Beyond the Template: Designing Better Content with Canva & AI","cat":"talk","start":"2026-11-03T20:00+08:00","end":"2026-11-03T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM2","points":"MYCSD PROVIDED","desc":"Hands- mics! Join us to discover how to navigate your degree journey while balancing academics, personal growth, involvement, and well-being. ✨\n📅 Date: 13 October 2026\n⏰ Time: 8.00 PM – 10.00 PM\n💻 Platform: Cisco Webex\n💰 Fee: RM1 only\n🏅 MyCSD provided!\nDon’t miss this opportunity to gain valuable insights from Adlin Munirah, Majlis Perwakilan Pelajar Pusat Pengajian Sains Farmasi 25/26. 💚\n🔗 Register now:\nhttps://forms.gle/7LaSQZZSMkViVadZ9\n📲 Follow our IG at @baktisiswapsf_usm for more updates!\n💬 Inquiries:\n📞 Ain Syafiqah (014-5656135)\n📞 Lisa Aleeya (019-4063336)\nSee you there! 🌿✨","nPosts":10,"forms":[],"flags":[],"notes":[],"elig":{"kind":"unstated","note":""}},{"id":"e-insideout","title":"INSIDE OUT: What's Really Going On Inside? (WMHD 3.0 talk series)","cat":"talk","dateText":"14 Oct 2026","end":"2026-10-14T23:59+08:00","kind":"ended","myCsd":true,"sources":[{"role":"first","ts":"2026-09-29 21:26","sender":"UMisOne","orig":null,"line":3963,"snippet":"INSIDE OUT: WHAT’S REALLY GOING ON INSIDE?"},{"role":"latest","ts":"2026-10-11 08:07","sender":"UMisOne","orig":null,"line":7751,"snippet":"HAAAA KORANG OKAY TAKTU? 🛌💻"}],"text":"HAAAA KORANG OKAY TAKTU? 🛌💻\nDuduk santai di bilik pun boleh tambah ilmu! Jom luangkan masa menyertai 4 siri Online Talk istimewa bulan ini. Hanya dari hujung jari, anda bakal peroleh input berharga untuk penjagaan diri dan minda! 🚀\nPilih topik pilihan anda atau join jeee semua:\n✅ INSIDE OUT: What's Really Going on Inside (14 Okt 2026) – Ruang selamat untuk bincang isu kesihatan mental dan kesejahteraan diri bersama pakar kaunselor & psikiatri.\n✅ INNERVERSE: Beyond What We See (21 Okt 2026) – Kupasan menarik tentang psikospiritual dan kesedaran gaya hidup sihat.\n✅ WHO AM I? When Desire and Reality Collide (28 Okt 2026) – Rungkai persoalan mencari jati diri apabila keinginan dan realiti bertembung.\n✅ JUST ONE MORE: Until When? (4 Nov 2026) – Bincang dan belajar langkah berkesan untuk mengatasi masalah ketagihan.\n📌 MAKLUMAT PROGRAM:\n💻 Platform: Webex Meeting\n⏰ Masa: 8.30 PM – 10.30 PM untuk\n…","nPosts":3,"forms":[],"flags":[],"notes":[],"elig":{"kind":"unstated","note":""}},{"id":"e-blood101","title":"Blood Donation 101 (MedHealth 8.0, Phase 1)","cat":"talk","dateText":"14 Oct 2026","end":"2026-10-14T23:59+08:00","kind":"ended","myCsd":true,"sources":[{"role":"first","ts":"2026-09-20 09:25","sender":"UMisOne","orig":null,"line":2445,"snippet":"BLOOD DONATION 101: Everything You Need to Know! ✨🩸〙"},{"role":"latest","ts":"2026-10-14 19:03","sender":"UMisOne","orig":null,"line":8668,"snippet":"BLOOD DONATION 101: Everything You Need to Know! ✨🩸〙"}],"text":"〘🩸✨ 𝐁𝐋𝐎𝐎𝐃 𝐃𝐎𝐍𝐀𝐓𝐈𝐎𝐍 𝟏𝟎𝟏: 𝐄𝐯𝐞𝐫𝐲𝐭𝐡𝐢𝐧𝐠 𝐘𝐨𝐮 𝐍𝐞𝐞𝐝 𝐭𝐨 𝐊𝐧𝐨𝐰! ✨🩸〙\nEver wondered what really happens when you donate blood? 👀🩸Thinking about becoming a donor but have a few questions or doubts? 🤔\nJoin us for an insightful online session where you can 𝐥𝐞𝐚𝐫𝐧 𝐦𝐨𝐫𝐞 𝐚𝐛𝐨𝐮𝐭 𝐛𝐥𝐨𝐨𝐝 𝐝𝐨𝐧𝐚𝐭𝐢𝐨𝐧, 𝐮𝐧𝐝𝐞𝐫𝐬𝐭𝐚𝐧𝐝 𝐭𝐡𝐞 𝐩𝐫𝐨𝐜𝐞𝐬𝐬, 𝐜𝐥𝐞𝐚𝐫 𝐮𝐩 𝐜𝐨𝐦𝐦𝐨𝐧 𝐝𝐨𝐮𝐛𝐭𝐬, 𝐚𝐧𝐝 𝐝𝐢𝐬𝐜𝐨𝐯𝐞𝐫 𝐡𝐨𝐰 𝐲𝐨𝐮𝐫 𝐜𝐨𝐧𝐭𝐫𝐢𝐛𝐮𝐭𝐢𝐨𝐧 𝐜𝐚𝐧 𝐡𝐞𝐥𝐩 𝐬𝐚𝐯𝐞 𝐥𝐢𝐯𝐞𝐬. 🩺❤️\nWhether you’re a first-time donor, a regular donor, or simply curious to learn more, this session is for you! ✨\n📅 *Date:* 14 October 2026\n⏰ *Time :* 8.00 PM – 10.00 PM\n💻 *Platform:* Cisco Webex\n💰 *Fee:* RM1\n🔗 *Register Here :* https://tinyurl.com/2vpe6263\n𝐌𝐲𝐂𝐒𝐃 𝐏𝐨𝐢𝐧𝐭𝐬 𝐏𝐫𝐨𝐯𝐢𝐝𝐞𝐝! ✨\nEvery blood donation can make a difference, and every informed donor brings us one step closer to a healthier community. ❤️‍🩹\n👉 Stay tuned and don’t miss Phase 1 of MedHealth 8.0!\n#MedHealth8.0\n#SSIMovingForward\n#MunSellada\n#CompassionIn\n…","nPosts":4,"forms":[],"flags":[],"notes":[],"elig":{"kind":"unstated","note":""}},{"id":"e-poor","title":"Why I'm Poor Today and How It's the Fault of the Brits","cat":"talk","dateText":"14 Oct 2026","end":"2026-10-14T23:59+08:00","kind":"ended","myCsd":true,"sources":[{"role":"first","ts":"2026-10-11 08:04","sender":"UMisOne","orig":null,"line":7460,"snippet":"WHY I'M POOR TODAY AND HOW IT'S THE FAULT OF THE BRITS 🇬🇧💰"},{"role":"latest aran, USM Kejuruteraan\n🎟️ Kemasukan: PERCUMA!\n\nJangan lepaskan peluang untuk memeriahkan malam ini bersama rakan-rakan sambil memberikan sokongan kepada bakat-bakat seni kita!\n\nSave the date and see you there! 👋✨\n\n#MiniShowcase2026\n#FEELTHECULTURELIVETHEHEART 🔥\n#ADIKARMA","nPosts":1},{"id":"factfiction","title":"Fact or Fiction: Science Edition","cat":"competition","start":"2026-11-03T00:00+08:00","end":"2026-11-05T23:59:59+08:00","where":"Google Form (online)","mode":"online","fee":"RM2","points":"MyCSD points provided!","desc":"Online science quiz. 1st place wins RM10.","kind":"window","myCsd":true,"org":"EICC (from hashtag)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/FEPaYm8vvrQizQjs7"}],"notes":["Register first. The quiz link is sent to the WhatsApp group."],"flags":[],"sources":[{"role":"first","ts":"2026-10-28 17:45","sender":"UMisOne","orig":null,"msg":44092,"snippet":"🔬✨ FACT OR FICTION: SCIENCE EDITION 🧪💡"}],"text":"🔬✨ FACT OR FICTION: SCIENCE EDITION 🧪💡\n\nThink you know science better than your peers? 👀🧠 It's time to put your knowledge to the test! Join our Online Quiz: Fact or Fiction - Science Edition through Google form and challenge yourself with intriguing questions that will make you question what’s real and what’s not! ⚛️🧬\n\n💻 Platform: Google Form\n📅 Date: 3 November – 5 November 2026\n💰 Registration Fee: RM2 only\n🏆 Prize: Win 1st place and grab RM10!\n🎖️ MyCSD points provided!\n\n✨ Separate facts from fiction, challenge your mind, and uncover the truth! Think you have what it takes? 🤔 \n\n📢*Register first!*\n\nQuiz link will be sent to the WhatsApp group📲\n\n🏷️ Google form link: https://forms.gle/FEPaYm8vvrQizQjs7\n\n#EICCUSM \n#EICC2627","nPosts":1},{"id":"pharmgames","title":"Pharmfair x WUS101: Mini Games","cat":"activity","start":"2026-11-02T09:00+08:00","end":"2026-11-03T17:00+08:00","where":"Foyer DTSP, USM","mode":"in-person","fee":"RM1","points":"MyCSD PROVIDED!","desc":"Pharmacy mini-games: spot pharmacy mistakes, guess medicines and play prescription detective.","kind":"event","myCsd":true,"org":"JATI (from hashtag)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[],"notes":["Runs 9 am to 5 pm on each of the two days."],"flags":[{"t":"inferred","text":"The post gives the time as \"9.0p AM – 5.00 PM\". The start is read as 9:00 AM."},{"t":"missing","text":"No registration link or QR code is mentioned."}],"sources":[{"role":"first","ts":"2026-11-02 12:20","sender":"UMisOne","orig":null,"msg":44158,"snippet":"[𝐏𝐡𝐚𝐫𝐦𝐟𝐚𝐢𝐫 𝐱 𝐖𝐔𝐒𝟏𝟎𝟏: 𝐌𝐢𝐧𝐢 𝐆𝐚𝐦𝐞𝐬] 🔍💊"}],"text":"[𝐏𝐡𝐚𝐫𝐦𝐟𝐚𝐢𝐫 𝐱 𝐖𝐔𝐒𝟏𝟎𝟏: 𝐌𝐢𝐧𝐢 𝐆𝐚𝐦𝐞𝐬] 🔍💊\n\nThink you have what it takes to crack the case? 🕵️‍♀️✨\nGet ready to put your pharmacy knowledge and detective skills to the test! 🧪🩺 JATI Pharmfair x WUS101 brings you an exciting series of mini-games where you can challenge yourself, sharpen your observation skills, and have fun along the way! 🎯🎉\n\nFrom spotting pharmacy mistakes to guessing medicines and becoming a prescription detective, there’s a mystery waiting for you to solve! 💊🔎\n\n🗓️ Date: 2–3 November 2026\n⏰ Time: 9.0p AM – 5.00 PM\n📍 Venue: Foyer DTSP, USM\n🎟️ Fee: RM1\n\n🌟𝐌𝐲𝐂𝐒𝐃 𝐏𝐑𝐎𝐕𝐈𝐃𝐄𝐃!\n\n\nGather your friends, put on your detective hat, and see if you can solve all the pharmacy mysteries! 🕵️‍♂️🧩 Don’t miss out on the fun — come and join us! 🎊\n\n❓Any questions? Feel free to contact us:\n📞 Zarith Sofea: 010-2896440\n📞 Syafiq Fikri: 011-15362467\n\nDo follow us to stay updated! ✨\n📍 Facebook: JATI USM\n 📍 Instagram: @jatiusm\n\n#JATIUSM\n #JATIPharmfair\n #PharmfairXWUS101","nPosts":1},{"id":"healthscreen","title":"Health Screening: Pharmfair x WUS101","cat":"activity","start":"2026-11-02T09:00+08:00","end":"2026-11-03T17:00+08:00","where":"Foyer DTSP, USM","mode":"in-person","fee":"RM1 (free with any product purchase)","points":null,"desc":"Blood pressure and BMI checks at the JATI booth.","kind":"event","myCsd":false,"org":"JATI USM (from hashtag)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[],"notes":["Runs 9 am to 5 pm on each of the two days."],"flags":[],"sources":[{"role":"first","ts":"2026-11-02 12:20","sender":"UMisOne","orig":null,"msg":44159,"snippet":"🩺 𝐇𝐄𝐀𝐋𝐓𝐇 𝐒𝐂𝐑𝐄𝐄𝐍𝐈𝐍𝐆 — 𝐏𝐇𝐀𝐑𝐌𝐅𝐀𝐈𝐑 × 𝐖𝐔𝐒𝟏𝟎𝟏 🩺"}],"text":"🩺 𝐇𝐄𝐀𝐋𝐓𝐇 𝐒𝐂𝐑𝐄𝐄𝐍𝐈𝐍𝐆 — 𝐏𝐇𝐀𝐑𝐌𝐅𝐀𝐈𝐑 × 𝐖𝐔𝐒𝟏𝟎𝟏 🩺\n\n✨ 𝐘𝐨𝐮𝐫 𝐇𝐞𝐚𝐥𝐭𝐡, 𝐘𝐨𝐮𝐫 𝐏𝐫𝐢𝐨𝐫𝐢𝐭𝐲! ✨\n\nHey everyone! 👋🏻\nTake a moment to check on your health with JATI USM! 💚 Join us for a simple and affordable health screening to keep track of your well-being.\n\n🩺 𝐇𝐄𝐀𝐋𝐓𝐇 𝐒𝐂𝐑𝐄𝐄𝐍𝐈𝐍𝐆 𝐒𝐄𝐑𝐕𝐈𝐂𝐄𝐒\n• Blood Pressure Measurement\n• BMI Measurement\n\n💰 Screening Fee: RM1\n🎁 FREE with any product purchase!\n\n📍 𝐕𝐞𝐧𝐮𝐞: Foyer, DTSP, USM\n📅 𝐃𝐚𝐭𝐞: 2–3 November 2026\n⏰ 𝐓𝐢𝐦𝐞: 9.00 AM – 5.00 PM\n\nDrop by our booth, check your health, and take a step towards a healthier you! 🫶🏻✨\n\n❓ 𝐀𝐧𝐲 𝐪𝐮𝐞𝐬𝐭𝐢𝐨𝐧𝐬?\nFeel free to contact us:\n📞 Zarith Sofea: 010-2896440\n📞 Syafiq Fikri: 011-15362467\n\nFollow us for more updates! ✨\n📍 Facebook: JATI USM\n📍 Instagram: @jatiusm\n\n#JATI2627\n#JATISALES\n#PharmfairXWUS101\n#USMPharmacy#","nPosts":1},{"id":"ashrae","title":"ASHRAE USM Student Branch Welcoming Night","cat":"activity","start":"2026-11-11T20:00+08:00","end":"2026-11-11T22:00+08:00","where":"School of Mechanical Engineering, MEK 2","mode":"in-person","fee":"Free","points":"MYCSD PROVIDED!","desc":"Welcoming night with ice-breaking games, team challenges, conversations with engineering students and gifts.","kind":"event","myCsd":true,"org":"ASHRAE USM Student Branch","orgHow":"stated","elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/kBxH3VRDLdR6n4WN9"}],"notes":[],"flags":[],"sources":[{"role":"first","ts":"2026-10-27 07:42","sender":"UMisOne","orig":null,"msg":44038,"snippet":"【ASHRAE USM STUDENT BRANCH WELCOMING NIGHT】"},{"role":"latest","ts":"2026-11-02 12:16","sender":"UMisOne","orig":null,"msg":44135,"snippet":"【ASHRAE USM STUDENT BRANCH WELCOMING NIGHT】"}],"text":"【ASHRAE USM STUDENT BRANCH WELCOMING NIGHT】\n\n🚀 A new semester means fresh opportunities!\n\nThe ASHRAE USM Student Branch is officially hosting our Welcoming Night, and you’re invited! 🤩\nThis is the perfect  chance for you to connect, relax, and meet our amazing community. Whether you’re eager to join or just curious to see what we do, this is the perfect opportunity to socialize with peers, build lasting connections, and jumpstart your university journey! ✨\n\nWhat’s in it for you?\n💫 Fun ice-breaking games\n🕹️ Interactive challenges & team activities\n🤝 Great conversations with passionate, like-minded engineering students\n🎁 Attractive gifts await you! 👀✨\n\nDetails :\n📅 Date: 12 November 2026 (Thursday) \n🕗 Time: 8:00 PM - 10:00 PM\n📍 Venue: School of Mechanical Engineering, MEK 2\n💵 Fee: Free of charge (FOC)!\n🎓 MYCSD PROVIDED!\n\n🔗 Registration Link: \nhttps://forms.gle/kBxH3VRDLdR6n4WN9\n\n‼️Follow us for latest updates : https://instagram.com/ashraeusm","nPosts":4},{"id":"physics2","title":"Physics Coffee Talk: From Physics to Profession","cat":"talk","start":"2026-11-11T20:00+08:00","end":"2026-11-11T22:00+08:00","where":"Cisco Webex (online)","mode":"online","fee":"RM1","points":"MYCSD DISEDIAKAN!!","desc":"Talk by Dr. Nik Noor Haryatul Eleena binti Nik Mahmud on careers after a Physics degree.","kind":"event","myCsd":true,"org":"PSF USM (from hashtag)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSekDkWaAIjkXI8vAZbiUCh_RaHVqHsG56_3ohrxSmUTClfJzg/viewform"}],"notes":["The post also says to scan the QR code on the poster."],"flags":[],"sources":[{"role":"first","ts":"2026-10-29 09:09","sender":"UMisOne","orig":null,"msg":44105,"snippet":"🚨📢 POV: You chose Physics because you love understanding the universe but nobody told you there’s a "}],"text":"🚨📢 POV: You chose Physics because you love understanding the universe but nobody told you there’s a whole universe of career possibilities waiting for you! 😭🚀\n\nFrom surviving equations to surviving the working world, what’s next after a Physics degree? 👀💼 Will you be the next engineer, researcher, or something totally unexpected? 🤔✨\n\n☕ PHYSICS COFFEE TALK: FROM PHYSICS TO PROFESSION\n\n🎤 Featuring Dr. Nik Noor Haryatul Eleena binti Nik Mahmud\n\nMYCSD DISEDIAKAN!!🌞🌞\n\n📅 11 November 2026 (Wednesday)\n⏰ 8:00 PM – 10:00 PM\n💻 Cisco Webex (Online)\n💸 Registration Fee: ONLY RM1!\n🔗 Registration Link :https://docs.google.com/forms/d/e/1FAIpQLSekDkWaAIjkXI8vAZbiUCh_RaHVqHsG56_3ohrxSmUTClfJzg/viewform\n\n☕ Grab your virtual coffee, bring your curiosity, and let’s talk about life beyond the lecture hall! Who says Physics is all about formulas? 😉📚\n\n🚀 YOUR DEGREE IS JUST THE BEGINNING! Don’t miss out, scan the QR code on the poster and register now!\n\n#PSFUSM #PhysicsCoffeeTalk #FromPhysicsToProfession #USM #PhysicsStudents","nPosts":1},{"id":"ilmiah4","title":"Ilmiah Talk 4.0: The Psychology of Overthinking","cat":"talk","start":"2026-11-11T20:30+08:00","end":"2026-11-11T22:00+08:00","where":"Webex (online)","mode":"online","fee":"RM2","points":"MYCSD PROVIDED!","desc":"Talk by Puan Fauziah Binti Abdullah (USM Psychology Officer) on why we cannot stop overthinking. Mystery prizes.","kind":"event","myCsd":true,"org":"ChemSoc (from hashtag)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[{"label":"Register (shorturl.at short link)","url":"https://shorturl.at/glVAD","warn":true}],"notes":["The post also says to scan the QR code."],"flags":[{"t":"note","text":"The register link is a shorturl.at short link, not a Google Form. Check where it lands before paying."}],"sources":[{"role":"first","ts":"2026-11-02 12:19","sender":"UMisOne","orig":null,"msg":44152,"snippet":"🧠✨ ILMIAH TALK 4.0 IS HERE! ✨"},{"role":"latest","ts":"2026-11-02 12:24","sender":"UMisOne","orig":null,"msg":44176,"snippet":"🧠✨ *ILMIAH TALK 4.0 IS HERE!* ✨"}],"text":"🧠✨ *ILMIAH TALK 4.0 IS HERE!* ✨\n\n💭 *HEY, OVERTHINKERS! THIS ONE'S FOR YOU!* 👀\n\nDo you replay conversations in your head, worry about the future, or wonder why your brain never switches off? 🤯\n\nJoin us as we explore *The Psychology of Overthinking: Why Can't We Stop Thinking?* 💙\n\n🎤 Speaker: Puan Fauziah Binti Abdullah, USM Psychology Officer\n📅 Date: 11 November 2026 (Wednesday)\n⏰ Time: 8:30 PM – 10:00 PM\n💻 Platform: Online via Webex\n💰 Registration Fee: RM2 ONLY!\n🌟 *MYCSD PROVIDED!*\n\n🏆 *MYSTERY PRIZES AWAITING!*\n\n📲 REGISTER NOW!\nScan the QR code OR click the link below👇:\nhttps://shorturl.at/glVAD\n\nTag your fellow overthinkers and join us! 🧠💙\n\nFor any inquiries:\n📲 Amirah (014-397 8243)\n📲 Aziq (012-603 1209)\n\n#IlmiahTalk4.0\n#chemsoc26/27\n#greatbondawesomechemistry","nPosts":2},{"id":"cgpa","title":"You Are More Than Your CGPA","cat":"talk","start":"2026-11-11T20:15+08:00","end":"2026-11-11T22:15+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":"MyCSD Disediakan","desc":"Online talk by Puan Anis Natasha (USM counsellor) on handling pressure and not tying your worth to your CGPA.","kind":"event","myCsd":true,"org":"PERDAMA (from the closing line of the post)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/bh4XFLEMi9sk1JGt6"}],"notes":[],"flags":[],"sources":[{"role":"first","ts":"2026-11-02 12:17","sender":"UMisOne","orig":null,"msg":44140,"snippet":"🗣️ [YOU ARE MORE THAN YOUR CGPA] 🎤✨"},{"role":"latest","ts":"2026-11-02 12:22","sender":"UMisOne","orig":null,"msg":44167,"snippet":"🗣️ [YOU ARE MORE THAN YOUR CGPA] 🎤✨"}],"text":"🗣️ [YOU ARE MORE THAN YOUR CGPA] 🎤✨\n\nAssalamualaikum, Salam Sejahtera dan Salam #Pahang1st 🖤🤍\n\nPernah rasa tertekan atau letakkan nilai diri semata-mata pada angka CGPA?                                                                                                                                                            \n\nJom sertai Online Talk “You Are More Than Your CGPA” bersama penceramah jemputan khas kita, Puan Anis Natasha (KAUNSELOR USM) 🌟\n\nProgram ini akan mendedahkan rahsia serta motivasi untuk membantu anda melepaskan tekanan dan membina diri yang lebih positif sama ada dalam dunia kampus ataupun masa hadapan! 💬\n\nButiran Program:\n📅 Tarikh: 11 NOVEMBER 2026 (RABU)\n⏰ Masa: 8.15 PM – 10.15 PM\n💻 Platform: Cisco Webex\n💸 Yuran: RM 1.00 sahaja!\n\n🏅 MyCSD Disediakan ‼️🎓\n\nPendaftaran:\nhttps://forms.gle/bh4XFLEMi9sk1JGt6\n\n📌 Sebarang pertanyaan, sila hubungi:\n📞 SYAF : 013-9567849\n📞 ISYRAF : 019-7390428\n\n\"Be More, Fear Less!\" 🖤\n\n\"KITA PERDAMA, RUMPUN PAHANG\"\n\n#KitaPERDAMA #Pahang1st\n#YouAreMoreThanYourCGPA","nPosts":2},{"id":"mindmatters","title":"Santai Bicara Mental Health: Mind Matters","cat":"talk","start":"2026-11-14T20:30+08:00","end":"2026-11-14T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1 members / RM2 non-members","points":"MYCSD Provided!","desc":"Talk by Puan Fauziah Binti Abdullah (USM Psychology Officer) on coping with study stress in a healthy way.","kind":"event","myCsd":true,"org":"PPIK (from the post)","orgHow":"stated","elig":{"kind":"limited","note":"\"eksklusif untuk warga PPIK\" (exclusive to PPIK). PPIK is never spelled out in the post."},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSeORQkE6RjDR0D23uAnHaksuVOS2nZRtSwfox9qXvqr3SbF6w/viewform?usp=dialog"}],"notes":[],"flags":[],"sources":[{"role":"first","ts":"2026-10-28 17:45","sender":"UMisOne","orig":null,"msg":44094,"snippet":"Assalamualaikum, Salam Sejahtera dan Salam Sayang PPIK 💜🤍"},{"role":"latest","ts":"2026-11-02 12:18","sender":"UMisOne","orig":null,"msg":44143,"snippet":"Assalamualaikum, Salam Sejahtera dan Salam Sayang PPIK 💜🤍"}],"text":"Assalamualaikum, Salam Sejahtera dan Salam Sayang PPIK 💜🤍\n\n\"Universiti memang mencabar, tapi you don't have to go through it alone.\" 🫂💜🤍\n\nPenat dengan quiz, essay, dan reading list yang tak habis-habis? Let’s take a deep breath. Jom sertai SANTAI BICARA MEN gating relationships with aging parents, understanding their needs and building stronger connections across generations.✨\n\n📅 𝗗𝗮𝘁𝗲 : 14 November 2026 (Saturday)\n⏰ 𝗧𝗶𝗺𝗲 : 8.00 p.m. - 10.00 p.m.\n💻 𝗣𝗹𝗮𝘁𝗳𝗼𝗿𝗺 : Cisco Webex\n💵 𝐑𝐞𝐠𝐢𝐬𝐭𝐫𝐚𝐭𝐢𝐨𝐧 𝐅𝐞𝐞 : RM 1\n🌟 𝐌𝐲𝐂𝐒𝐃 𝐩𝐫𝐨𝐯𝐢𝐝𝐞𝐝\n\n🔗 𝗥𝗲𝗴𝗶𝘀𝘁𝗲𝗿 𝗻𝗼𝘄 : https://forms.gle/6mRJNZUGjxBWpZe59\n\n📞 𝗔𝗻𝘆 𝗲𝗻𝗾𝘂𝗶𝗿𝗶𝗲𝘀 : \nChan Kah Lok : +6017-8873671\nSinn Yen Ni : +6010-2488219\n\nLet’s learn to appreciate, understand and cherish the people who have been there since the beginning.🫶\n\n#HOPE2627\n#HealthOutreachProgramme\n#GrowingUpWhileTheyAge\n#AgingParents","nPosts":2},{"id":"firstlap","title":"First Lap: The Race Starts With Knowledge","cat":"talk","start":"2026-11-10T20:00+08:00","end":"2026-11-10T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"RM1","points":"MyCSD Provided!","desc":"Online session on childhood cancer awareness and supporting affected children and families.","kind":"event","myCsd":true,"org":"SSI USM (from hashtag)","orgHow":"hashtag","elig":{"kind":"unstated","note":""},"forms":[{"label":"Register (tinyurl.com short link)","url":"https://tinyurl.com/yszdhvb7","warn":true}],"notes":[],"flags":[{"t":"note","text":"The register link is a tinyurl.com short link, not a Google Form. Check where it lands before paying."}],"sources":[{"role":"first","ts":"2026-11-02 12:23","sender":"UMisOne","orig":null,"msg":44173,"snippet":"〚 🏁 𝐅𝐈𝐑𝐒𝐓 𝐋𝐀𝐏: 𝐓𝐡𝐞 𝐑𝐚𝐜𝐞 𝐒𝐭𝐚𝐫𝐭𝐬 𝐖𝐢𝐭𝐡 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 🧠〛"}],"text":"〚 🏁 𝐅𝐈𝐑𝐒𝐓 𝐋𝐀𝐏: 𝐓𝐡𝐞 𝐑𝐚𝐜𝐞 𝐒𝐭𝐚𝐫𝐭𝐬 𝐖𝐢𝐭𝐡 𝐊𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 🧠〛\n\n𝐄𝐯𝐞𝐫𝐲 𝐬𝐭𝐞𝐩 𝐨𝐟 𝐤𝐧𝐨𝐰𝐥𝐞𝐝𝐠𝐞 𝐛𝐫𝐢𝐧𝐠𝐬 𝐮𝐬 𝐜𝐥𝐨𝐬𝐞𝐫 𝐭𝐨 𝐜𝐡𝐚𝐧𝐠𝐞 🪄\n\nEvery meaningful journey begins with awareness, understanding, and a heart that cares ❤️. Through knowledge, we can learn more about childhood cancer, raise awareness, and build a community that stands together to support children and families affected by cancer🎗️🤝\n\n🏁 This first lap is more than just a beginning. It is a step towards greater awareness, deeper compassion, and a future filled with hope.\n\n🎯 𝐓𝐇𝐄𝐌𝐄:\n“First Lap: The Ra adership journeys, experiences, and challenges.\n\nDiscover your potential, embrace leadership, and learn how young people can become catalysts for meaningful change. Remember, age and background are never barriers to making a difference! 💫\n\n📅 Date: 2 November 2026 \n⏰ Time: 8.30 PM – 10.30 PM (Malaysia Time) \n💻 Platform: Webex (Online) \n💰Registration Fee: RM2 \n🏆 MYCSD: National Level\n\nLink for Registration : \nhttps://forms.glecvfMDmJGshjcWR9p7 https://forms.glecvfmdmjgshjcwr9p7\n\nFor any enquiries, please contact: ☎️ Khairina: 013-534 2845 \n☎️ Maisarah: 012-546 0347\n\n🌟 Be part of the change. Register now and rise together with us!\n\n#SheLeadsWeRise \n#IKMARUSM \n#IKMARLEAD \n#MajuJohor #PemacuProgramBerinovasi #PencetusMahasiswaBerkemajuan","nPosts":1,"org":"IKMAR USM (from hashtag)","orgHow":"hashtag"},{"id":"checkmate","title":"Checkmate Your Schedule: Mastering Chess & Studies","cat":"talk","start":"2026-11-02T20:30+08:00","end":"2026-11-02T22:00+08:00","where":"Webex (online)","mode":"online","fee":"RM2 per person","points":"MyCSD points provided for USM students","desc":"Online session on balancing chess and studies. Open to people outside USM too.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"\"USM students and all our wonderful people outside the USM community\""},"forms":[{"label":"Register","url":"https://forms.gle/3FYTQdX9MeNGvqEw7"}],"flags":[{"t":"note","text":"The post also says to scan the QR code on the poster."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-03 09:33","sender":"UMisOne","orig":null,"msg":44184,"snippet":"♟️ CHECKMATE YOUR SCHEDULE: MASTERING CHESS & STUDIES ♟️"}],"text":"♟️ CHECKMATE YOUR SCHEDULE: MASTERING CHESS & STUDIES ♟️\n\nIT’S HAPPENING TODAY ❤‍🔥\n\nHey USM students and All our wonderful people outside the USM community! 👋🔥\n\nEver wondered how to balance your academic or work life while sharpening your chess skills? Join us for an exciting session featuring Dr Nithiyanatham as we explore how to master both the chessboard and our studies! 🧠📚\n\n📅 Date: 2 November 2026 (Monday)\n⏰ Time: 8.30 PM – 10.00 PM\n💻 Platform: Online (Webex)\n💰 Registration Fee: RM2 per person\n\n✨ MyCSD points provided for USM students!\n\nDon't miss this opportunity to learn, grow, and checkmate your challenges both on and off the board! ♟️\n\n📲 Register now by scanning the QR code on the poster!\n\nLink: https://forms.gle/3FYTQdX9MeNGvqEw7\n\nFor enquiries, contact Esther at 010-963 7936.\n\nLet's make every move count! ♟️🔥\n\n#USMKKTSS #USM #ChessAndStudies #MasterYourMind #MyCSD","nPosts":1,"org":"USM KKTSS (from hashtag)","orgHow":"hashtag"},{"id":"moneymoves","title":"Money Moves 2026: Know Your Money, Grow Your Career","cat":"activity","start":"2026-11-06T13:30+08:00","end":"2026-11-06T17:10+08:00","where":"DK U, USM","mode":"in-person","fee":null,"points":null,"desc":"Afternoon on financial literacy and career opportunities, with lucky prizes.","kind":"event","myCsd":false,"elig":{"kind":"unstated","note":""},"forms":[],"flags":[{"t":"missing","text":"No fee, link or QR code is mentioned, and the post never mentions myCSD."}],"notes":[],"sources":[{"role":"first","ts":"2026-11-05 14:42","sender":"UMisOne","orig":null,"msg":44240,"snippet":"🚀 *MONEY MOVES 2026: KNOW YOUR MONEY, GROW YOUR CAREER!*"}],"text":"🚀 *MONEY MOVES 2026: KNOW YOUR MONEY, GROW YOUR CAREER!*\n\nYour future is shaped by the financial decisions you make and the career opportunities you pursue.\n\nReady to take the next step?\n\nJoin us at *MONEY MOVES 2026* to explore the importance of financial literacy, discover career opportunities and gain valuable insights to prepare yourself for life beyond university.\n\n💰 *Learn to make smarter financial decisions.*\n🎯 *Discover opportunities for career growth.*\n\n📅 6 November 2026\n⏰ 1:30 PM – 5:10 PM\n📍 DK U, USM\n\n🎁 Exciting lucky prizes await!\n\nYour next move starts here. See you there!\n\n#MoneyMoves2026 \n#FinancialLiteracy\n#MPPUSM","nPosts":1,"org":"MPP USM (from hashtag)","orgHow":"hashtag"},{"id":"careertalk4","title":"Career Talk 4.0 (careers beyond a mathematics degree)","cat":"talk","start":"2026-11-25T20:00+08:00","end":"2026-11-25T22:30+08:00","where":"Microsoft Teams","mode":"online","fee":"Maths students FREE / non-Maths USM RM1 / non-USM RM2","points":"MyCSD Points Provided!","desc":"Talk by Muhamad Izwan Bin Nasri on careers open to mathematics students.","kind":"event","myCsd":true,"elig":{"kind":"all","note":"Fees are listed for Maths students, non-Maths USM students and non-USM students"},"forms":[{"label":"Register","url":"https://docs.google.com/forms/d/e/1FAIpQLSfoc8uDqH3ywTDdboa4iC7f5whPCuLXWzdBAPNmjGX0A_e5Rw/viewform"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-03 09:32","sender":"UMisOne","orig":null,"msg":44183,"snippet":"📣 CAREER TALK 4.0 📣"},{"role":"latest","ts":"2026-11-08 19:43","sender":"UMisOne","orig":null,"msg":44272,"snippet":"📣 CAREER TALK 4.0 📣"}],"text":"📣 CAREER TALK 4.0 📣\n\nEver wondered how mathematics can open doors to a wide range of career opportunities beyond the classroom? What actually comes after graduation? Go beyond the lecture hall as a USM Mathematics & Economics alumnus breaks down the transition to industry, early hurdles, and corporate reality.\n\nJoin us for Career Talk 4.0: \"Beyond the Numbers: Unlocking Corporate Career Opportunities\" to explore how mathematical knowledge, analytical skills and problem-solving abilities can create opportunities in the corporate industry! 💼📈\n\n🔎 Event Details:\n🗓 Date: 25 November 2026 (Wednesday)\n🕗 Time: 8.00 PM – 10.30 PM\n🎙 Speaker: Muhamad Izwan Bin Nasri\n💻 Platform: Microsoft Teams\n\n🎟 Registration Fees:\n🔹 Mathematical Science     \n      Students: FREE\n🔹 Non-Mathematical Science\n      Students (USM): RM1\n🔹 Non-USM Students: RM2\n\n🏅 MyCSD Points Provided!\n\n🔗 REGISTER NOW:\nhttps://docs.google.com/forms/d/e/1FAIpQLSfoc8uDqH3ywTDdboa4iC7f5whPCuLXWzdBAPNmjGX0A_e5Rw/viewform\n\nTake this opportunity to broaden your career perspectives, gain valuable insights from industry experience and discover the various possibilities that a degree in Mathematics can offer! 🌟\n\n📞 For further enquiries, please contact:\nKah Yee - 013-798 6358 \nKaavieyaah - 011-3967 0212\n\n#USM \n#WEAREMATH@USM\n#MATHSOC","nPosts":3,"org":"Math Society (MathSoc, from hashtag)","orgHow":"hashtag"},{"id":"mathcanva","title":"Unleash Your Creativity with Canva (MathSoc)","cat":"talk","start":"2026-11-28T20:00+08:00","end":"2026-11-28T22:30+08:00","where":"Microsoft Teams","mode":"online","fee":"RM1 Math School students / RM2 non-Math School students","points":"MYCSD Provided","desc":"Canva workshop with speaker Encik Pravin Raj Muralitharan.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/TcFGFtqvzM4r5f3P6"}],"flags":[],"notes":["Not the same event as \"Beyond the Template\" (Canva & AI), which was on 3 Nov."],"sources":[{"role":"first","ts":"2026-11-04 08:12","sender":"UMisOne","orig":null,"msg":44200,"snippet":"🎨 UNLEASH YOUR CREATIVITY WITH CANVA✨"},{"role":"latest","ts":"2026-11-19 13:35","sender":"UMisOne","orig":null,"msg":44460,"snippet":"🎨 UNLEASH YOUR CREATIVITY WITH CANVA✨"}],"text":"🎨 UNLEASH YOUR CREATIVITY WITH CANVA✨\n\n🤔 Ever wanted to create eye catching designs but don’t know where to start?💡\n\nIt’s time to turn your creative ideas into reality! Whether you’re a beginner or looking to level up your design skills, this is the perfect opportunity to explore the world of Canva 🤩\n\nJoin our Canva Workshop 26/27 and discover how to create stunning posters, presentations, social media content, and more with ease!\n\n🗓️ Date: 28 November 2026\n ⏰ Time: 8.00 PM - 10.30 PM\n 🎤 Speaker: Encik Pravin Raj Muralitharan \n📍 Platform/Venue: Microsoft Teams\n\n💰 Registration Fee:\n•RM1 FOR MATH SCHOOL STUDENTS\n•RM2 FOR NON-MATH SCHOOL STUDENTS \n⚡MYCSD Provided !!️\n\n🎟️ Ready to bring your ideas to life? Don’t miss out on this creative opportunity! Register now! 👇 \nhttps://forms.gle/TcFGFtqvzM4r5f3P6\n\n📞 Got Questions? Reach Out to Us:\nNadia : 013-4598530 tel:013-4598530\nTasha : 011-28643235 tel:011-28643235\n\n#USM #WEAREMATH@USM #MATHSOC #CanvaWorkshop #CreativeDesign","nPosts":6,"org":"Math Society (MathSoc, from hashtag)","orgHow":"hashtag"},{"id":"moneymatters","title":"Money Matters: Skills for Financial Well-Being","cat":"talk","start":"2026-11-28T20:30+08:00","end":"2026-11-28T22:30+08:00","where":"Microsoft Teams","mode":"online","fee":null,"points":"MYCSD PROVIDED!","desc":"Talk by Prof. Madya Dr. Haslindar Ibrahim (School of Management, USM) on managing money.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/xtLksnc7x2NekuSs5"}],"flags":[{"t":"missing","text":"Fee not stated in the post."}],"notes":["The post also says to scan the QR code."],"sources":[{"role":"first","ts":"2026-11-13 19:56","sender":"UMisOne","orig":null,"msg":44344,"snippet":"💸✨ MONEY MATTERS: SKILLS FOR FINANCIAL WELL-BEING! ✨💰"},{"role":"latest","ts":"2026-11-19 13:38","sender":"UMisOne","orig":null,"msg":44484,"snippet":"💸✨ MONEY MATTERS: SKILLS FOR FINANCIAL WELL-BEING! ✨💰"}],"text":"💸✨ MONEY MATTERS: SKILLS FOR FINANCIAL WELL-BEING! ✨💰\n\n🤔 ARE YOU IN CONTROL OF YOUR MONEY, OR IS YOUR MONEY CONTROLLING YOU? 👀\n\nAlways wondering where your money goes? Struggling to save, manage your expenses, or make smart financial decisions? 💳💸\n\nIt’s time to take charge of your finances! Join us as we explore Money Matters: Skills for Financial Well-Being and discover practical ways to build healthier financial habits and achieve financial stability! 💚\n\n🎤 Invited Speaker: Prof. Madya Dr. Haslindar Ibrahim (School of Management), USM\n\n📅 Date: 28 November 2026 (Saturday)\n⏰ Time: 8:30 PM – 10:30 PM\n💻 Platform: Microsoft Teams\n\n🌟 MYCSD PROVIDED!\n\n📲 DON’T MISS OUT! REGISTER NOW!\n\nScan the QR code OR click the Google Form link below 👇\n🧷 https://forms.gle/xtLksnc7x2NekuSs5\n\nTag your friends and let’s learn to make every ringgit count! 💸💚\n\nFor any inquiries:\n📲 Jasmine (010-9535 121)\n📲 Humairah (013-248 6168)\n\n“Sinergi Kemahiran, Keseimbangan Kejayaan”\n\n- ♟️💙🛠\n\n#IBOSUSM\n#WeLead \n#IntegrationBalanceOfSkills\n#TVETUSM","nPosts":5,"org":"IBOS USM (from hashtag)","orgHow":"hashtag"},{"id":"alumni","title":"Alumni Talk: Lessons Beyond Lecture Hall","cat":"talk","start":"2026-11-23T20:00+08:00","end":"2026-11-23T22:00+08:00","where":"Cisco Webex","mode":"online","fee":"USM students RM2 / non-USM RM3","points":"National MyCSD will be provided!","desc":"Talk by Mr. Bol Ram (PhD student, USM).","kind":"event","myCsd":true,"elig":{"kind":"all","note":"Fees are listed for USM and non-USM students"},"forms":[{"label":"Register","url":"https://forms.gle/VcHJcHrVCH5mzD4XA"}],"flags":[],"notes":[],"sources":[{"role":"first","ts":"2026-11-17 08:22","sender":"UMisOne","orig":null,"msg":44415,"snippet":"🎓✨ ALUMNI TALK – LESSONS BEYOND LECTURE HALL ✨🎓"}],"text":"🎓✨ ALUMNI TALK – LESSONS BEYOND LECTURE HALL ✨🎓\n🎓 Your university journey is more than just lectures, assignments, and examinations!\n💭 Have you ever wondered what life looks like after graduation? How do you turn academic knowledge into real-world success? What challenges and opportunities await you beyond the university gates? 🚀\n🌟 Join us for an inspiring Alumni Talk: Lessons Beyond Lecture Hall, where we explore valuable experiences, career journeys, personal growth, and the lessons that textbooks don't teach!\n\n💡 What can you gain from this session?\n🚀 Insights into life beyond university\n💼 Real-world experiences and career development\n🎯 Valuable advice on overcoming challenges and achieving goals\n🌱 Inspiration for personal and professional growth\n\n📢 EVENT DETAILS\n📅 Date: 23 November 2026 (Monday)\n⏰ Time: 8:00 PM – 10:00 PM\n💻 Platform: Cisco Webex\n🎟️ Registration Fees:\n🔹 USM Students: RM 2\n🔹 Non-USM Students: RM 3\n👨‍🎓 Speaker: Mr. Bol Ram (PhD Student, USM)\n🌟 National MyCSD will be provided! 🌟\n🔗 Registration Link: https://forms.gle/VcHJcHrVCH5mzD4XA\n\n✨ Your degree opens doors, but your experiences shape your future!\n🔥 Don't miss this opportunity to gain fresh perspectives, learn from real experiences, and discover what lies beyond the lecture hall!\n🎓 The journey doesn't end at graduation — it's just the beginning! 🚀\n\n📞 ANY INQUIRIES\n📱 Visva Raj: 017-2047826 tel:017-2047826\n📱 Ashwanthini: 011-5116 5156\n\n#AlumniTalk2026 #LessonsBeyondLectureHall #USM #StudentDevelopment #CareerGrowth #SEP2.0","nPosts":1,"org":"SEP 2.0 (from hashtag)","orgHow":"hashtag"},{"id":"japancareer","title":"Japan Career Talk: International career in Japan","cat":"talk","start":"2026-11-11T17:00+08:00","end":"2026-11-11T18:00+08:00","where":"Zoom","mode":"online","fee":null,"points":"International MyCSD","desc":"Session on preparing and applying for work in Japan, Japanese business culture and living there. Two lucky participants may attend the ASEAN Career Fair in Singapore.","kind":"event","myCsd":true,"elig":{"kind":"unstated","note":""},"forms":[{"label":"Register","url":"https://forms.gle/ALELC9NfLLrd3MWg7"}],"flags":[{"t":"missing","text":"Fee and organiser not stated. The myCSD line comes from the post's checklist (\"International Mycsd\") and a one-line follow-up that confirmed it."}],"notes":["Prepare your latest CV as a PDF for the form.","Join the WhatsApp group at the end of the form to get the Zoom link."],"sources":[{"role":"first","ts":"2026-11-05 14:44","sender":"UMisOne","orig":null,"msg":44247,"snippet":"Konnichiwa! 🇯🇵 Are you interested in building an international career in Japan?"},{"role":"latest","ts":"2026-11-08 19:44","sender":"UMisOne","orig":null,"msg":44273,"snippet":"Konnichiwa! 🇯🇵 Are you interested in building an international career in Japan?"}],"text":"Konnichiwa! 🇯🇵 Are you interested in building an international career in Japan?\n\nJoin the JAPAN CAREER
