<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Settings · myCSD tracker</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.min.js" integrity="sha384-Sm2s7OXxsAMTyJ4iIyRBgVpeGUvMPk2lRQnnZhE78Wej7oggIoolKt+SCt0XJbUB" crossorigin="anonymous" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/signature.js" defer></script>
  <script src="js/validation.js" defer></script>
  <script src="js/settings-store.js" defer></script>
  <script src="js/refresh-on-return.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/creator-dialog.js" defer></script>
  <script data-goatcounter="https://myna-dev.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="settings-page auth-pending">
  <a class="close-link" href="index.html" aria-label="Close settings">×</a>
  <p class="settings-load-error" id="settings-load-error" aria-live="polite" hidden>Couldn't load settings.</p>
  <button class="settings-load-retry" id="settings-load-retry" type="button" hidden>Retry</button>
  <main class="settings-main" id="settings-main" hidden>
    <h1 class="settings-title">Settings</h1>

    <section class="setting-row">
      <p class="setting-label">Message style</p>
      <div class="mode-options" role="radiogroup" aria-label="Message style">
        <label class="mode-option"><input type="radio" name="message-style" value="motivational"><span>Motivational</span></label>
        <label class="mode-option"><input type="radio" name="message-style" value="harsh"><span>Harsh truth</span></label>
        <label class="mode-option"><input type="radio" name="message-style" value="off"><span>Off</span></label>
      </div>
    </section>

    <section class="setting-row">
      <label class="setting-label" for="target">Target</label>
      <input class="plain-input" id="target" type="number" min="1" max="5000" step="1" inputmode="numeric" required>
    </section>

    <section class="setting-row">
      <label class="setting-label" for="dday-preset">D-Day</label>
      <select class="plain-select" id="dday-preset">
        <option value="semester1">End of Sem 1 · 7 Feb 2027</option>
        <option value="semester2">End of Sem 2 · 18 Jul 2027</option>
        <option value="custom">Custom date</option>
      </select>
      <input class="plain-input custom-date" id="dday-custom" type="date" aria-label="Custom D-Day">
    </section>

    <section class="setting-row">
      <label class="setting-label" for="sidang">Sidang name</label>
      <input class="plain-input" id="sidang" type="text" maxlength="20" autocomplete="off">
    </section>

    <p class="save-state" id="save-state" aria-live="polite"></p>
    <button class="sign-out-item" id="sign-out" type="button">Sign out</button>
    <p class="sign-out-error" id="sign-out-error" aria-live="polite" hidden></p>
    <nav class="legal-links settings-legal-links" aria-label="Legal information">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <button class="creator-link" id="creator-link" type="button" aria-label="About the creator" aria-haspopup="dialog">&lt;.</button>
    </nav>
  </main>

  <dialog class="creator-dialog" id="creator-dialog" aria-label="About the creator">
    <div class="creator-body">
      <picture>
        <source srcset="img/miko.webp" type="image/webp">
        <img class="creator-photo" src="img/miko.jpg" alt="Miko" width="1280" height="1280" loading="lazy">
      </picture>
      <p class="creator-greeting">Hellow fellow human &#128578;</p>
      <p class="creator-url" id="creator-url">javanmyna.fyi</p>
      <button class="plain-action creator-copy" id="creator-copy" type="button">Copy</button>
      <p class="creator-status" id="creator-status" aria-live="polite"></p>
      <button class="creator-close" id="creator-close" type="button" aria-label="Close">&times;</button>
    </div>
  </dialog>
</body>
</html>
