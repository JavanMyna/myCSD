<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>myCSD tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/settings-store.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/activity-data.js" defer></script>
  <script src="js/app.js" defer></script>
  <script data-goatcounter="https://myna-dev.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="home-page">
  <main class="sign-in-view" id="sign-in-view" hidden>
    <button class="sign-in-button" id="google-sign-in" type="button">Continue with Google</button>
    <p class="sign-in-error" id="sign-in-error" aria-live="polite" hidden></p>
    <nav class="legal-links" aria-label="Legal information">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </main>

  <section class="home-view" id="home-view" aria-label="myCSD points" hidden>
    <a class="gear-link" href="menu.html" aria-label="Open menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z" />
        <path d="m19.4 15 .05.04 1.03.8-1.5 2.6-1.23-.48a1.5 1.5 0 0 0-1.4.13l-.14.1a1.5 1.5 0 0 0-.65 1.23V21h-3v-1.58a1.5 1.5 0 0 0-.8-1.33l-.14-.07a1.5 1.5 0 0 0-1.38.02l-1.22.64-1.5-2.6 1.1-.8a1.5 1.5 0 0 0 .6-1.25l-.01-.17a1.5 1.5 0 0 0-.8-1.2L6.98 12l1.5-2.6 1.35.5a1.5 1.5 0 0 0 1.37-.15l.14-.1A1.5 1.5 0 0 0 12 8.4V7h3v1.4a1.5 1.5 0 0 0 .8 1.32l.15.08a1.5 1.5 0 0 0 1.37-.02l1.22-.64 1.5 2.6-1.1.8a1.5 1.5 0 0 0-.6 1.25l.01.17a1.5 1.5 0 0 0 .8 1.2Z" />
      </svg>
    </a>
    <p class="dday-label" id="dday-label" aria-label="D-Day countdown"></p>
    <main class="home-main">
      <p class="total-points total-loading" id="total-points" aria-label="Total myCSD points">—</p>
      <p class="message-line" id="message-line" aria-live="polite"></p>
      <button class="home-retry" id="home-retry" type="button" hidden>Retry</button>
    </main>
  </section>
</body>
</html>
