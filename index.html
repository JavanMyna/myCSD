<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>myCSD tracker</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.min.js" integrity="sha384-Sm2s7OXxsAMTyJ4iIyRBgVpeGUvMPk2lRQnnZhE78Wej7oggIoolKt+SCt0XJbUB" crossorigin="anonymous" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/signature.js" defer></script>
  <script src="js/settings-store.js" defer></script>
  <script src="js/activity-data.js" defer></script>
  <script src="js/refresh-on-return.js" defer></script>
  <script src="js/app.js" defer></script>
  <script data-goatcounter="https://myna-dev.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="home-page">
  <main class="sign-in-view" id="sign-in-view" hidden>
    <button class="sign-in-button" id="google-sign-in" type="button">Continue with Google</button>
    <button class="demo-start" id="demo-start" type="button">Try demo — saved on this device only</button>
    <p class="sign-in-error" id="sign-in-error" aria-live="polite" hidden></p>
    <nav class="legal-links" aria-label="Legal information">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </main>

  <section class="home-view" id="home-view" aria-label="myCSD points" hidden>
    <a class="gear-link" href="menu.html" aria-label="Open menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="3.25" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9c.2.48.62.87 1.13 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z" />
      </svg>
    </a>
    <p class="dday-label" id="dday-label" aria-label="D-Day countdown"></p>
    <button class="home-refresh" id="home-refresh" type="button" aria-label="Refresh points and D-Day">Refresh</button>
    <main class="home-main">
      <p class="total-points total-loading" id="total-points" aria-label="Total myCSD points">—</p>
      <div class="home-copy">
        <p class="message-line" id="message-line" aria-live="polite"></p>
        <p class="goal-line" id="goal-line"></p>
        <p class="approximate-note" id="approximate-note" hidden>Approximate — includes unconfirmed activities.</p>
        <button class="home-retry" id="home-retry" type="button" hidden>Retry</button>
      </div>
    </main>
  </section>
</body>
</html>
