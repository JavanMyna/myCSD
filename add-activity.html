<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Add activity · myCSD tracker</title>
  <link rel="icon" href="favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.min.js" integrity="sha384-Sm2s7OXxsAMTyJ4iIyRBgVpeGUvMPk2lRQnnZhE78Wej7oggIoolKt+SCt0XJbUB" crossorigin="anonymous" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/settings-store.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/activity-data.js" defer></script>
  <script src="js/refresh-on-return.js" defer></script>
  <script src="js/add-activity.js" defer></script>
  <script data-goatcounter="https://myna-dev.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="plain-page auth-pending">
  <a class="close-link" href="menu.html" aria-label="Close form">×</a>
  <p class="page-load-error" id="page-load-error" aria-live="polite" hidden></p>
  <button class="page-load-retry" id="page-load-retry" type="button" hidden>Retry</button>
  <main class="plain-main form-main" id="form-main" hidden>
    <h1 class="plain-title">Add activity</h1>
    <form id="activity-form" novalidate>
      <label class="field-label" for="activity-name">Name</label>
      <input class="plain-input" id="activity-name" name="name" type="text" maxlength="100" autocomplete="off" required>

      <label class="field-label field-spaced" for="activity-points">Points</label>
      <input class="plain-input" id="activity-points" name="points" type="number" min="0" max="1000" step="1" inputmode="numeric" required>

      <label class="field-label field-spaced" for="activity-level">Level</label>
      <select class="plain-select" id="activity-level" name="level" required>
        <option value="college">College</option>
        <option value="club">Club</option>
        <option value="university">University</option>
        <option value="national">National</option>
      </select>

      <label class="field-label field-spaced" for="activity-date">Date</label>
      <input class="plain-input" id="activity-date" name="date" type="date" required>

      <p class="plain-error" id="form-error" aria-live="polite"></p>
      <button class="plain-action form-submit" id="save-activity" type="submit">Save activity</button>
    </form>
  </main>
</body>
</html>
